<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CPX 플래시카드</title>
<style>
/* ═══ CPX 답안지 (OMR) ═══════════════════════════════════════
   채점표 은유: 문진 단계 = 마킹 칸. 칠하면 열리고, 건너뛰면 빈칸이 남는다. */
:root{
  /* 표면 3단: 배경 → 카드 → 크롬(헤더·푸터). 밝기차만으로는 안 뜨므로 --elev 로 띄운다 */
  --paper:#F1F3F6; --card:#FFFFFF; --chrome:#FFFFFF;
  --ink:#14161A; --ink2:#5C636C;
  --rule:#E3E7EC; --rule2:#EDEFF2;
  --fill:#5762CE;              /* UI 액센트(인디고) — 평가색과 역할을 분리한다 */
  --onfill:#FFFFFF;            /* 액센트를 배경으로 깔 때 그 위 글자 */
  --mark:#C8232C;              /* 빨간펜 = 놓친 것 */
  --know:#1F7A57; --dont:#C8232C; --unrated:#C9D0D8;
  --elev:0 1px 3px rgba(20,22,26,.08),0 10px 26px rgba(20,22,26,.07);
  --elev-sm:0 1px 2px rgba(20,22,26,.06),0 2px 8px rgba(20,22,26,.05);
  --r-card:12px; --r-ctl:9px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --kr:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  /* 컬러태그(난이도) — 외움/모름(--know/--dont)과 같은 초록·빨강 계열이지만
     채도를 낮추고 "왼쪽 띠 + 이모지"로만 쓴다. 테두리는 절대 태그색을 쓰지 않는다. */
  --tag-hard:#B3382B; --tag-mid:#8A6410; --tag-easy:#146B66;
  /* 형광펜 2색 */
  --hl-y:#FFF2A8; --hl-p:#FBD3E4; --hl-ink:#14161A;
}
/* ── 다크 토큰 ────────────────────────────────────────────────
   테마는 3상태다: 저장값이 없으면 OS 를 따르고(=아무 속성도 안 붙는다),
   헤더 ☾/☀ 를 누르면 <html data-theme="dark|light"> 가 붙어 그 선택이 이긴다.
   그래서 같은 값을 두 번 적는다 — 미디어쿼리는 "light 를 고르지 않았을 때"로 좁히고,
   속성 선택자는 OS 가 밝아도 이기게 한다.
   ⚠️ 아래 두 블록은 값이 같아야 한다. 색을 고칠 땐 반드시 둘 다 고칠 것. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121417; --card:#1C1F24; --chrome:#171A1F;
    --ink:#F2F4F7; --ink2:#98A2AD;
    --rule:#2A2F36; --rule2:#24282E;
    --fill:#9BA5F3; --onfill:#111324;
    --mark:#F2716B; --know:#5FBF98; --dont:#F2716B; --unrated:#39414A;
    --elev:0 0 0 1px rgba(255,255,255,.05),0 10px 28px rgba(0,0,0,.55);
    --elev-sm:0 0 0 1px rgba(255,255,255,.04),0 3px 10px rgba(0,0,0,.4);
    --tag-hard:#E8897A; --tag-mid:#D9AE5A; --tag-easy:#57C7BE;
    --hl-y:#5A4E1A; --hl-p:#5E2C41; --hl-ink:#F2F4F7;
  }
}
:root[data-theme="dark"]{
  --paper:#121417; --card:#1C1F24; --chrome:#171A1F;
  --ink:#F2F4F7; --ink2:#98A2AD;
  --rule:#2A2F36; --rule2:#24282E;
  --fill:#9BA5F3; --onfill:#111324;
  --mark:#F2716B; --know:#5FBF98; --dont:#F2716B; --unrated:#39414A;
  --elev:0 0 0 1px rgba(255,255,255,.05),0 10px 28px rgba(0,0,0,.55);
  --elev-sm:0 0 0 1px rgba(255,255,255,.04),0 3px 10px rgba(0,0,0,.4);
  --tag-hard:#E8897A; --tag-mid:#D9AE5A; --tag-easy:#57C7BE;
  --hl-y:#5A4E1A; --hl-p:#5E2C41; --hl-ink:#F2F4F7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--kr);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ── 헤더: 답안지 상단 마킹 스트립 ── */
header{padding:10px 14px 9px;background:var(--chrome);border-bottom:1px solid var(--rule);
  position:relative}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.title{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;margin-right:auto;color:var(--ink2)}
.title::after{content:" / 답안지";letter-spacing:0;font-family:var(--kr);font-size:11px;opacity:.65}

.toggle{font-size:11.5px;padding:5px 10px;border-radius:var(--r-ctl);background:transparent;
  border:1px solid var(--rule);color:var(--ink2);cursor:pointer;user-select:none;
  font-family:var(--mono);letter-spacing:.02em;transition:.13s}
.toggle:hover{border-color:var(--fill);color:var(--ink)}
.toggle.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* 진행바 = 타이밍 마크 */
.pbar{display:flex;gap:3px;height:4px;margin:9px 0 8px}
.pbar>span{flex:1;border-radius:99px;background:var(--unrated)}
.pbar>span.know{background:var(--know);opacity:1}
.pbar>span.dont{background:var(--dont);opacity:1}
/* 계기판 스트립 — 진행률·외움·모름·미평가를 숫자로 세운다 */
.pstats{display:flex;gap:0}
.pstats>span{flex:1;display:flex;flex-direction:column;gap:1px;
  border-left:1px solid var(--rule);padding-left:10px}
.pstats>span:first-child{border-left:0;padding-left:0}
.pstats b{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.02em;
  color:var(--ink);line-height:1.15}
.pstats b.acc{color:var(--fill)}
.pstats i{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink2)}

.search{flex:1;min-width:150px;padding:6px 9px;border:1px solid var(--rule);border-radius:var(--r-ctl);
  background:var(--paper);color:var(--ink);font-size:12.5px;font-family:var(--kr)}
.search:focus{outline:2px solid var(--fill);outline-offset:-1px;border-color:var(--fill)}
.chips{display:flex;gap:5px;overflow-x:auto;margin-top:7px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:11px;padding:4px 9px;border:1px solid var(--rule);
  border-radius:var(--r-ctl);color:var(--ink2);cursor:pointer;font-family:var(--mono);letter-spacing:.02em}
.chip.on{background:var(--fill);border-color:var(--fill);color:var(--onfill)}

/* ── 본문 ── */
main{flex:1;overflow-y:auto;padding:13px;-webkit-overflow-scrolling:touch}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:11px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink2);
  text-transform:uppercase}
.badge{margin-left:auto;padding:2px 8px;border:1px solid var(--rule);border-radius:var(--r-ctl);
  letter-spacing:.06em}
.badge.know{color:var(--know);border-color:var(--know)}
.badge.dont{color:var(--dont);border-color:var(--dont)}

/* 앞면: 주호소 */
.frontwrap{display:flex;align-items:center;justify-content:center;min-height:54vh}
.front{text-align:center;cursor:pointer;padding:34px 20px;width:100%;
  border:1px solid var(--rule);border-radius:var(--r-card);background:var(--card);
  box-shadow:var(--elev);position:relative}
.front::before{content:"주 호 소";position:absolute;top:13px;left:0;right:0;
  font-family:var(--mono);font-size:10px;letter-spacing:.42em;color:var(--ink2);opacity:.8}
.sym{font-size:clamp(30px,8.5vw,46px);font-weight:800;letter-spacing:-.025em;line-height:1.18}
.hint{margin-top:15px;font-size:11px;color:var(--ink2);font-family:var(--mono);letter-spacing:.05em}

/* ── 단계 = 마킹 행 (시그니처) ── */
.steps{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);
  border-radius:var(--r-card);background:var(--card);box-shadow:var(--elev);overflow:hidden}
.step{border-bottom:1px solid var(--rule2);padding:0;position:relative}
.step:last-child{border-bottom:0}
.step h4{margin:0;padding:11px 13px 11px 16px;font-size:13px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;
  color:var(--ink)}
/* 상태 띠 — 행 왼쪽 세로선. 동그라미보다 좌측 여백을 24px 덜 먹어 본문이 그만큼 넓어진다 */
.step::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--rule);transition:.15s}
.step.open::before{background:var(--fill)}
.step.skipped::before{background:var(--mark)}
.step.locked{opacity:.5;cursor:pointer}
.step.next{opacity:1;cursor:pointer;background:color-mix(in srgb,var(--fill) 7%,transparent)}
.step.next::before{background:var(--fill);animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.step.skipped h4{color:var(--mark)}
.step .body{padding:0 13px 13px 16px;font-size:13.5px;line-height:1.68}
.lock{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;
  color:var(--fill);flex-shrink:0}
.lock.dim{color:var(--ink2);opacity:.5}
.lock.miss{color:var(--mark)}

.kv{display:flex;flex-direction:column;gap:6px}
.kvrow{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:start}
.kvrow b{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink2);
  font-weight:700;padding-top:3px;border-right:1px solid var(--rule2);padding-right:8px}
.script div{padding:5px 0;border-bottom:1px dashed var(--rule2);font-size:13px;line-height:1.62}
.script div:last-child{border-bottom:0}

.mn{font-size:17px;font-weight:800;letter-spacing:.01em;color:var(--fill);line-height:1.45}
.aexp{margin-top:8px;font-size:12.5px;line-height:1.62;color:var(--ink2)}
.astepwrap{margin-top:9px}
.astep{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--fill);
  border:1px solid var(--fill);padding:3px 8px;border-radius:var(--r-ctl);display:inline-block}
.asks{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.ask{display:grid;grid-template-columns:78px 1fr;gap:9px;font-size:12.5px;align-items:start}
.ask b{font-family:var(--mono);font-size:10.5px;color:var(--ink2);padding-top:2px;font-weight:700}
.ask i{font-style:normal;line-height:1.55}
.warn{color:var(--mark);font-weight:600}

.stepbar{display:flex;gap:7px;justify-content:center;margin:12px 0 2px}
.empty{text-align:center;color:var(--ink2);padding:48px 16px;font-size:13px;line-height:1.7}

/* ── 푸터 ── */
footer{border-top:1px solid var(--rule);background:var(--chrome);padding:10px 14px 12px}
.rate{display:flex;gap:8px;margin-bottom:8px}
.rate button{flex:1;padding:12px;border-radius:var(--r-ctl);border:1px solid var(--rule);
  background:transparent;color:var(--ink2);font-size:13px;font-weight:700;cursor:pointer;
  font-family:var(--kr);transition:.13s}
.rate button.know:hover,.rate button.know:focus-visible{border-color:var(--know);color:var(--know)}
.rate button.dont:hover,.rate button.dont:focus-visible{border-color:var(--dont);color:var(--dont)}
.nav{display:flex;align-items:center;gap:8px}
.nav button{padding:8px 13px;border-radius:var(--r-ctl);border:1px solid var(--rule);background:transparent;
  color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:var(--kr)}
.nav button:hover{border-color:var(--fill);color:var(--ink)}
.pos{margin:0 auto;font-family:var(--mono);font-size:12px;letter-spacing:.09em;color:var(--ink2)}

:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){
  .step h4{padding-left:14px;font-size:12.5px}
  .step .body{padding-left:14px}
  .kvrow,.ask{grid-template-columns:62px 1fr}
}

/* 읽기 폭 제한 (데스크톱) */
header>*,main>*,footer>*{max-width:880px;margin-inline:auto}

/* ═══════════════════════════════════════════════════════════════
   v4 셸: 입장 게이트 · 뷰 전환 · 라이브러리 · 피드백 · 프린트
   (색은 전부 기존 OMR 변수만 사용)
   ═══════════════════════════════════════════════════════════════ */

/* ── 입장 게이트 (2026-08-01 개편 때 유실된 스타일 복구) ── */
#gate{position:fixed;inset:0;z-index:1000;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px}
#gate h1{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
#gate p{color:var(--ink2);font-size:13px;margin:0;max-width:320px;line-height:1.7;text-align:center}
#gate input{width:252px;max-width:82vw;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r-ctl);color:var(--ink);padding:9px 11px;font-size:14px;font-family:var(--kr)}
#gate input:focus{outline:2px solid var(--fill);outline-offset:-1px;border-color:var(--fill)}
#gate button{width:252px;max-width:82vw;background:var(--ink);color:var(--card);
  border:1px solid var(--ink);border-radius:var(--r-ctl);padding:10px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:var(--kr)}
#gate .err{color:var(--mark);font-size:12.5px;min-height:17px;font-family:var(--mono)}
#gate.hidden{display:none}

/* ── 헤더 아이콘 버튼 (☾/☀ · 로그아웃) — 글자 버튼 옆에서 작게 ── */
.iconbtn{width:26px;height:26px;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;border:1px solid var(--rule);border-radius:var(--r-ctl);
  color:var(--ink2);background:transparent;cursor:pointer;user-select:none;
  font-size:13px;line-height:1;transition:.13s}
.iconbtn:hover{border-color:var(--fill);color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--fill);outline-offset:1px}
#tOut:hover{border-color:var(--mark);color:var(--mark)}

/* ── 로그아웃 확인 ── */
#outbox{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:22px}
#outbox.hidden{display:none}
#outbox .outcard{background:var(--card);color:var(--ink);border:1px solid var(--rule);
  border-radius:var(--r-card);box-shadow:var(--elev);padding:18px 19px 15px;max-width:400px;width:100%}
#outbox h3{margin:0 0 9px;font-size:15px}
#outbox p{margin:0;color:var(--ink2);font-size:13px;line-height:1.75;min-height:60px}
#outbox .good{color:var(--know)} #outbox .bad{color:var(--mark)}
#outbox .outrow{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.toggle.danger{border-color:var(--mark);color:var(--mark)}
.toggle.danger:hover{background:var(--mark);color:var(--onfill);border-color:var(--mark)}
/* 확인이 끝나기 전엔 누르지 못하게 한다 — 백업 결과를 모른 채 지우면 안 된다 */
.toggle.wait{opacity:.4;pointer-events:none}
.gwho{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink2);
  white-space:nowrap}
.gwho:empty{display:none}
/* 시트 백업 상태 — 평소엔 조용한 회색, 확인 안 된 게 5분 넘으면 빨간 경고 */
.bkstat{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink2);
  white-space:nowrap;cursor:pointer;padding:2px 5px;border:1px solid transparent;border-radius:var(--r-ctl)}
.bkstat:empty{display:none}
.bkstat.bad{color:var(--onfill);background:var(--dont);border-color:var(--dont);font-weight:700}

/* ── 뷰 전환 ── */
.vsw{display:flex;border:1px solid var(--rule);border-radius:var(--r-ctl);overflow:hidden;flex:none}
.vsw span{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:5px 9px;
  color:var(--ink2);cursor:pointer;border-right:1px solid var(--rule);user-select:none;transition:.13s}
.vsw span:last-child{border-right:0}
.vsw span:hover{color:var(--ink)}
.vsw span.on{background:var(--ink);color:var(--card)}
body.v-lib .cardonly,body.v-print .cardonly{display:none}
body.v-lib footer,body.v-print footer{display:none}
body.v-lib header>*,body.v-print header>*{max-width:none}
body.v-lib main,body.v-print main{padding:0;overflow:hidden;display:flex;flex-direction:column}
body.v-lib main>*,body.v-print main>*{max-width:none;margin-inline:0}

/* 평가 버튼 활성 표시(.act 스타일 누락 보완) */
.rate button.act.know{border-color:var(--know);color:var(--know);
  background:color-mix(in srgb,var(--know) 11%,transparent)}
.rate button.act.dont{border-color:var(--dont);color:var(--dont);
  background:color-mix(in srgb,var(--dont) 11%,transparent)}

/* ── 컨트롤 바 (라이브러리 · 프린트 공용) ── */
.cbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 13px;flex:none;
  background:var(--chrome);border-bottom:1px solid var(--rule)}
.cbar .lab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink2);
  text-transform:uppercase}
.cbar .sep{width:1px;height:15px;background:var(--rule);margin:0 2px}
.cbar .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
  color:var(--ink2)}
.cbar .toggle{padding:4px 9px;font-size:11px}
.sel{border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--paper);color:var(--ink);
  font-family:var(--mono);font-size:11px;padding:4px 6px}
.sel:focus{outline:2px solid var(--fill);outline-offset:-1px}

/* ── 라이브러리 그리드: 보이는 영역을 정확히 3행으로 등분 ── */
.libscroll{flex:1;min-height:0;overflow-y:auto;padding:9px 13px;scrollbar-gutter:stable;
  -webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));
  gap:var(--gap,9px);grid-auto-rows:var(--rowh,170px)}
.tile{border:1.5px solid var(--unrated);border-radius:var(--r-card);background:var(--card);
  box-shadow:var(--elev-sm);
  padding:8px 10px 9px;display:flex;flex-direction:column;gap:4px;cursor:pointer;
  overflow:hidden;transition:border-color .13s}
.tile:hover{border-color:var(--fill)}
.tile.know{border-color:var(--know)}
.tile.dont{border-color:var(--dont)}
.tile .tsys{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink2);flex:none;
  text-transform:uppercase;opacity:.85}
.tile .tname{font-size:12.5px;font-weight:800;line-height:1.32;flex:none;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* 계통·제목은 고정 높이, 그 아래 칸들(말야마·감별진단·피드백)은 켜진 개수만큼
   남은 높이를 1fr씩 균등 분배한다. 하나만 켜면 그 칸이 남은 높이를 전부 차지.
   칸 사이 구분선·여백은 .cell에 똑같이 줘야 세 칸의 바깥 높이가 정확히 같아진다
   (border-box + flex-basis:0에서는 padding·border 차이가 그대로 높이 차이로 남는다). */
.tile .cell{flex:1 1 0;min-height:0;overflow:hidden;
  border-top:1px solid transparent;padding-top:4px}
.tile .hero{display:grid;place-items:center;text-align:center}
.tile .hero>span{display:block;max-width:100%;font-weight:800;color:var(--fill);
  line-height:1.3;overflow-wrap:anywhere;word-break:break-word;font-size:18px}
.tile .hero>span.mnempty{color:var(--ink2);font-weight:700}
/* 최소 크기로도 안 들어가는 초장문: 하드 컷 대신 아래로 흐려서 "더 있음" 표시 */
.tile .cell.clip{-webkit-mask-image:linear-gradient(180deg,#000 76%,transparent 99%);
  mask-image:linear-gradient(180deg,#000 76%,transparent 99%)}
.tile .tddx,.tile .tfb{border-top-style:dashed;border-top-color:var(--rule2);color:var(--ink2)}
.tile .tddx>span,.tile .tfb>span{display:block;font-size:10.5px;line-height:1.34;
  overflow-wrap:anywhere;word-break:break-word}
.tile .tfb{color:var(--ink)}
.tile .tfb>span::before{content:"✎ ";color:var(--mark)}

/* ── 피드백 메모 ── */
.fbwrap{margin-top:15px;border:1px solid var(--rule);border-radius:var(--r-card);
  background:var(--card);box-shadow:var(--elev);padding:10px 12px 11px}
.fbhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fbhead .lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--ink2);
  text-transform:uppercase;margin-right:auto}
.fbwrap textarea{width:100%;min-height:66px;resize:vertical;background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);border-radius:var(--r-ctl);padding:8px 9px;font-size:13px;line-height:1.62;
  font-family:var(--kr)}
.fbwrap textarea:focus{outline:2px solid var(--fill);outline-offset:-1px;border-color:var(--fill)}
/* 형광펜을 칠하는 표시 레이어. 아래 입력칸과 같은 글자 크기라 칠한 위치가 바로 대응된다 */
.fbread{font-size:13px;line-height:1.62;color:var(--ink);white-space:pre-wrap;word-break:break-word;
  padding:2px 2px 9px;margin-bottom:9px;border-bottom:1px solid var(--rule)}
.fbrow{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.fbmsg{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink2);margin-left:auto}

/* ── 말야마 편집 (피드백 메모와 같은 상자, ③A 공개 후에만 등장) ── */
.mnwrap textarea{min-height:46px;font-weight:700;color:var(--fill);font-size:14px}
.mnflag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mark);
  border:1px solid var(--mark);border-radius:6px;padding:1px 5px;white-space:nowrap}
.mn .mnflag{border:0;padding:0;margin-left:7px;font-size:12px;vertical-align:middle}
.mnorig{font-size:10.5px;line-height:1.45;color:var(--ink2);flex:1 1 100%;min-width:0;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mnorig b{font-family:var(--mono);font-size:10px;letter-spacing:.07em;margin-right:4px}
.tile .tsys .edm{color:var(--mark);margin-left:4px}
.pcard .pmn .pedit{color:var(--ink2);font-size:10px;margin-right:3px}

/* ── 프린트 미리보기 ── */
.prscroll{flex:1;min-height:0;overflow-y:auto;padding:14px 13px 30px;background:var(--paper)}
#printdoc{max-width:980px;margin:0 auto;column-gap:13px}
#printdoc.c2{column-count:2}
#printdoc.c3{column-count:3}
.pcard{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
  display:inline-block;width:100%;border:1px solid var(--rule);border-radius:var(--r-card);
  background:var(--card);padding:8px 11px 9px;margin:0 0 10px}
.pcard h3{margin:0 0 3px;font-size:13.5px;font-weight:800;line-height:1.35}
.pcard h3 .psys{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink2);
  font-weight:600;margin-left:5px}
.pcard .pmn{font-size:12.5px;font-weight:700;color:var(--fill);line-height:1.5;margin:4px 0}
.pcard .pddx,.pcard .pfb{font-size:11px;line-height:1.5;color:var(--ink2);margin:3px 0}
.pcard .pddx b,.pcard .pfb b{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  margin-right:4px}
.pcard .psteps{margin-top:5px;border-top:1px dashed var(--rule2);padding-top:5px}
.pcard .pstep{font-size:11px;line-height:1.5;margin:4px 0}
.pcard .pstep>b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  color:var(--ink2);margin-bottom:2px}
.pcard .mn{font-size:12px;line-height:1.45}
.pcard .aexp{font-size:10.5px;margin-top:4px}
.pcard .kvrow,.pcard .ask{grid-template-columns:58px 1fr;gap:7px;font-size:11px}
.pcard .kvrow b,.pcard .ask b{font-size:9.5px}
.pcard .asks,.pcard .astepwrap{margin-top:5px}
.pcard .script div{font-size:11px;padding:3px 0}

/* ═══ 신규: 컬러태그 · 라이브러리 탭 · 형광펜 · 감별진단 편집 ═══ */

/* ── 형광펜 (말야마 · 감별진단 공용) ──
   저장은 "칠한 문자열" 자체다(인덱스 아님). 표시할 때 원문에서 찾아 <mark>로 감싼다. */
mark.hly,mark.hlp{background:var(--hl-y);color:var(--hl-ink);border-radius:2px;padding:0 1px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
mark.hlp{background:var(--hl-p)}
[data-hlt]{cursor:text}
.pen{display:inline-flex;align-items:center;gap:5px}
.pen .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink2);
  text-transform:uppercase}
.penbtn{width:26px;height:21px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;
  display:inline-block;vertical-align:middle;background:var(--hl-y)}
.penbtn.p{background:var(--hl-p)}
.penbtn.x{background:transparent;width:auto;padding:0 8px;color:var(--ink2);font-family:var(--mono);
  font-size:10.5px;line-height:19px;text-align:center}
.penbtn:hover{border-color:var(--fill)}

/* ── 컬러태그: 카드뷰 버튼 4개 ── */
.tagbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 11px}
.tagbar .lab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink2);
  text-transform:uppercase}
.tagbtn{font-family:var(--kr);font-size:11.5px;padding:4px 9px;border:1px solid var(--rule);
  border-radius:var(--r-ctl);color:var(--ink2);cursor:pointer;user-select:none;background:transparent;
  transition:.13s;white-space:nowrap}
.tagbtn:hover{border-color:var(--ink2);color:var(--ink)}
.tagbtn.on{color:var(--onfill);border-color:transparent;font-weight:700}
.tagbtn.on[data-tag="hard"]{background:var(--tag-hard)}
.tagbtn.on[data-tag="mid"]{background:var(--tag-mid)}
.tagbtn.on[data-tag="easy"]{background:var(--tag-easy)}
.tagbtn.on[data-tag=""]{background:var(--ink);color:var(--card)}

/* ── 컬러태그: 라이브러리 타일 왼쪽 띠 ──
   테두리(외움/모름)와 겹쳐 읽히지 않도록 "안쪽 왼쪽 띠 + 계통줄 이모지" 두 경로로 표시한다. */
.tile{position:relative}
.tile.tg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tgc)}
.tile.tg-hard{--tgc:var(--tag-hard)}
.tile.tg-mid{--tgc:var(--tag-mid)}
.tile.tg-easy{--tgc:var(--tag-easy)}
.tile .tsys .tgm{margin-left:4px;font-size:10px;vertical-align:middle;letter-spacing:0}

/* ── 라이브러리 탭 ── */
.libtabs{display:flex;border:1px solid var(--rule);border-radius:var(--r-ctl);overflow:hidden;flex:none}
.libtabs span{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:4px 10px;
  color:var(--ink2);cursor:pointer;border-right:1px solid var(--rule);user-select:none;transition:.13s}
.libtabs span:last-child{border-right:0}
.libtabs span:hover{color:var(--ink)}
.libtabs span.on{background:var(--ink);color:var(--card)}

/* ── 감별진단 편집 (말야마 편집과 같은 상자, ⑦ 공개 후에만 등장) ── */
.ddxwrap textarea{min-height:56px;font-size:13px;color:var(--ink)}
.pcard .pddx .pedit{color:var(--ink2);font-size:10px;margin-right:3px}

/* ── 인쇄: 항상 흰 종이 · 검정 잉크 (다크모드에서 인쇄해도 동일) ──
   반드시 prefers-color-scheme:dark 블록보다 뒤에 와야 변수가 덮인다.
   ⚠️ 위 다크 블록들의 선택자를 **하나도 빠짐없이** 여기 다시 적어야 한다.
   :root[data-theme="dark"] 도, :root:not([data-theme="light"]) 도
   맨 :root 보다 명시도가 높다((0,2,0) vs (0,1,0)) — :not() 은 인자 중 가장 센 것의
   명시도를 갖기 때문이다. 하나라도 빠지면 그 조합에서 다크 토큰이 이겨
   인쇄물에 형광펜이 짙은 올리브 바탕 + 흰 글자로 찍혀 안 읽힌다.
   특히 :not(...) 을 빠뜨리면 **테마를 한 번도 안 누른 사용자(=기본 sys) + OS 다크**가
   깨진다 — 기존 사용자 전원이 그 상태다. 소스 순서로는 못 이긴다. */
@media print{
  :root, :root:not([data-theme="light"]),
  :root[data-theme="dark"], :root[data-theme="light"]{
    --paper:#fff; --card:#fff; --chrome:#fff; --ink:#000; --ink2:#333;
    --rule:#999; --rule2:#c8c8c8;
    --fill:#000; --onfill:#fff; --mark:#000; --know:#000; --dont:#000; --unrated:#777;
    --elev:none; --elev-sm:none;
    /* 형광펜은 인쇄에서도 남는다 — 다크모드 변수를 반드시 덮을 것(안 그러면 검은 바탕이 찍힌다) */
    --hl-y:#FBEB93; --hl-p:#F8C4DB; --hl-ink:#000;
  }
  @page{margin:12mm}
  html,body{height:auto!important;overflow:visible!important;display:block!important;
    background:#fff!important;color:#000!important}
  header,footer,#gate,.gwho,.cbar,.libscroll,.stepbar,.fbwrap,.vsw,.toggle,.chips,.pbar,
  .search,.pstats,.hint,#bkSave,.bkstat,.tagbar,.libtabs,.pen{display:none!important}
  main{padding:0!important;overflow:visible!important;display:block!important;
    max-width:none!important;flex:none!important}
  main>*{max-width:none!important;margin-inline:0!important}
  .prscroll{overflow:visible!important;padding:0!important;background:#fff!important;
    flex:none!important;min-height:0!important}
  #printdoc{max-width:none;margin:0}
  .pcard{border:1px solid #999!important;background:#fff!important;box-shadow:none;
    color:#000!important}
  .pcard .pmn{color:#000!important}
  .steps,.step,.front{background:#fff!important;color:#000!important}
  a[href]::after{content:""}
}
</style>
</head>
<body>

<div id="gate">
  <h1>CPX 플래시카드</h1>
  <div id="gateBody">
    <p>이름과 스터디 참여코드를 입력하세요</p>
    <input id="gName" placeholder="이름" autocomplete="off">
    <input id="gCode" placeholder="참여코드" autocomplete="off">
    <button id="gEnter">입장</button>
    <div class="err" id="gErr"></div>
  </div>
</div>

<div id="outbox" class="hidden">
  <div class="outcard">
    <h3>로그아웃할까요?</h3>
    <p id="outMsg"></p>
    <div class="outrow">
      <span class="toggle" id="outNo">취소</span>
      <span class="toggle danger" id="outGo">로그아웃</span>
    </div>
  </div>
</div>

<header>
  <div class="row">
    <span class="title">CPX 플래시카드</span>
    <span class="gwho" id="gwho"></span>
    <span class="toggle" id="bkSave" style="display:none">전체 저장</span>
    <span class="bkstat" id="bkStat"></span>
    <span class="vsw" id="vsw"><span data-view="card">카드</span><span data-view="lib">라이브러리</span><span data-view="print">프린트</span></span>
    <span class="toggle cardonly" id="tCover">가림</span>
    <span class="toggle cardonly" id="tTwo">A 2단검증</span>
    <span class="toggle cardonly" id="tShuf">섞기</span>
    <span class="iconbtn" id="tTheme" title="밝게/어둡게" role="button" tabindex="0" aria-label="밝게/어둡게 전환"></span>
    <span class="iconbtn" id="tOut" title="로그아웃 (계정 전환)" role="button" tabindex="0" aria-label="로그아웃">⏻</span>
  </div>
  <div class="pbar" id="pbar"></div>
  <div class="pstats" id="pstats"></div>
  <div class="row" style="margin-top:6px;">
    <input class="search" id="search" placeholder="🔍 주제·질환·약자 검색 (예: 파킨슨)">
    <span class="toggle" id="fAll">전체</span>
    <span class="toggle" id="fDont">모름만</span>
    <span class="toggle" id="fUn">미평가만</span>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<footer>
  <div class="rate">
    <button class="know" id="bKnow">✓ 외움 (1)</button>
    <button class="dont" id="bDont">✗ 모름 (2)</button>
  </div>
  <div class="nav">
    <button id="bPrev">◀ 이전</button>
    <span class="pos" id="pos"></span>
    <button id="bNext">다음 ▶</button>
  </div>
</footer>

<script>
const LS_PROG="cpx_progress", LS_SET="cpx_settings", LS_FB="cpx_feedback", LS_FBQ="cpx_fb_queue",
      LS_MN="cpx_mn",
      /* 신규 저장소 — 기존 키의 형식은 건드리지 않고 옆에 새 키를 둔다 */
      LS_DDX="cpx_ddx",      // {카드ID:{text,ts}}      감별진단 덮어쓰기
      LS_TAG="cpx_tag",      // {카드ID:{v,ts}}         v = hard|mid|easy
      LS_HL ="cpx_hl",       // {카드ID:{mn:[{t,c}],ddx:[{t,c}],fb:[{t,c}],ts}}  c = y|p
      LS_PTS="cpx_progress_ts",  // {카드ID:ts} 진도용 타임스탬프. cpx_progress 는 형식 그대로 두고
                                 //            ts 넣을 자리가 없어 별도 키로 뺐다
      LS_SKEW="cpx_skew",        // 서버시계 - 기기시계 (ms). 모든 ts 는 이걸 더해 찍는다
      LS_PEND="cpx_pending",     // push 는 했는데 서버 반영이 아직 확인 안 된 것
      LS_DIRTY="cpx_dirty",      // 로컬에만 저장되고 아직 push 조차 안 한 것
      LS_OK="cpx_lastok",
      LS_OWNER="cpx_owner";  // 이 기기에 지금 담겨 있는 학습데이터의 주인 이름        // 마지막으로 시트 반영이 확인된 시각
const lsObj=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"{}")||{}; }catch(e){ return {}; } };
/* prog/set 은 앱의 뼈대다. 여기서 예외가 나면 모듈 최상위가 죽어 게이트도 안 걷히고
   화면이 백지가 된다(그 상태에서 "사이트 데이터 삭제"를 하면 진도가 통째로 날아간다).
   → 절대 던지지 않는다. 깨진 값은 버리지 말고 별도 키에 원문을 남겨 복구 여지를 둔다. */
function lsObjSafe(k){
  let raw=null;
  try{ raw=localStorage.getItem(k); }catch(e){ return {}; }
  if(raw===null||raw==="") return {};
  try{ const o=JSON.parse(raw);
       if(o && typeof o==="object" && !Array.isArray(o)) return o; }catch(e){}
  try{ localStorage.setItem(k+"_corrupt_"+Date.now(), raw); }catch(e){}
  return {};
}

/* 읽기의 lsObjSafe 와 짝이 되는 쓰기 쪽 안전망.
   Safari 프라이빗 모드는 setItem 이 항상 던지고, 저장 공간이 차도 던진다.
   여기서 예외가 새면 평가 한 번에 렌더가 끊기고 진도가 조용히 사라진다.
   → 절대 던지지 않는다. 대신 저장이 안 된다는 사실을 헤더에 계속 띄운다. */
let lsFail=false;
function lsSet(k,v){
  try{ localStorage.setItem(k,v); return true; }
  catch(e){ if(!lsFail){ lsFail=true; try{ pendPaint(); }catch(e2){} } return false; }
}

/* ── 시각 기준: 오직 서버 시계 ──────────────────────────────
   기기 시계(Date.now())는 틀어질 수 있다. 로컬 ts 와 서버 _ts 를 직접 비교하는 곳이
   많으므로, 저장하는 모든 ts 는 srvNow() = 기기시계 + skew 로 찍는다.
   skew 는 sheetLoad() 응답의 now 로 매번 갱신된다. 아직 모르면 0(=종전과 동일). */
let _skew=0;
try{ const v=Number(localStorage.getItem(LS_SKEW)); if(isFinite(v)) _skew=v; }catch(e){}
function srvNow(){ return Date.now()+_skew; }
function setSkew(serverNow){
  const n=Number(serverNow);
  if(!isFinite(n) || n<=0) return;
  _skew=n-Date.now();
  try{ localStorage.setItem(LS_SKEW,String(Math.round(_skew))); }catch(e){}
}

let prog = lsObjSafe(LS_PROG);
const SET_DEFAULTS={cover:true,two:true,shuf:false,filter:"all",sys:"all",search:"",id:null,
                    view:"card", cols:3, libName:true, libMn:true, libDdx:false, libFb:false,
                    pTitle:true, pMn:true, pDdx:false, pFb:false, pFull:false,
                    pTarget:"all", pSys:"all", pCols:2, libTab:"all",
                    theme:"sys"};        // sys = OS 설정을 따름. ☾/☀ 를 누르면 light|dark
let set = Object.assign({}, SET_DEFAULTS, lsObjSafe(LS_SET));
/* 게이트가 걷히기 전에 칠해야 로그인 화면이 한 번 번쩍이지 않는다.
   버튼 글자는 여기서 못 맞출 수도 있으니 bindThemeBtn 이 입장 후 다시 부른다. */
try{ if(set.theme==="dark"||set.theme==="light")
       document.documentElement.setAttribute("data-theme",set.theme); }catch(e){}
let fb = {};
try{ fb = JSON.parse(localStorage.getItem(LS_FB)||"{}") || {}; }catch(e){ fb={}; }
/* 말야마 덮어쓰기: {카드ID:{text,ts}}. 없으면 데이터의 a.mn 을 쓴다 — 원본은 절대 안 지워진다 */
let mnOv = {};
try{ mnOv = JSON.parse(localStorage.getItem(LS_MN)||"{}") || {}; }catch(e){ mnOv={}; }
let ddxOv = lsObj(LS_DDX);   // 감별진단 덮어쓰기 (말야마와 완전히 대칭)
let tagOv = lsObj(LS_TAG);   // 컬러태그
let hlOv  = lsObj(LS_HL);    // 형광펜
let progTs= lsObj(LS_PTS);   // 진도 타임스탬프
let deck=[], pos=0, flipped=false, rv=null;
let _lastView=null, libRand=null;   // libRand: 랜덤 탭의 현재 셔플 순서(카드ID 배열). null = 다시 섞어라

const ID_MIGRATE={"msk-back":"msk-neck","obgyn-breastmass":"obgyn-breastpain"};
(function(){let ch=false;
  for(const [o,n] of Object.entries(ID_MIGRATE)){
    if(prog[o]!==undefined){ if(prog[n]===undefined) prog[n]=prog[o]; delete prog[o]; ch=true; }
  }
  if(ch) lsSet(LS_PROG,JSON.stringify(prog));
})();


const $=id=>document.getElementById(id);
const save=()=>{lsSet(LS_PROG,JSON.stringify(prog)); lsSet(LS_SET,JSON.stringify(set));};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
/* 말야마 읽기는 전부 여기를 지난다 — 카드뷰 ③A · 라이브러리 · 프린트 · 검색 */
const mnBase=c=>String((c&&c.a&&c.a.mn)||"").trim();          // 데이터 원본
const mnEdited=c=>!!(c && mnOv[c.id] && mnOv[c.id].text);      // override 걸렸나
const mnOf=c=>{ const o=c&&mnOv[c.id];
  return (o&&o.text) ? String(o.text).trim() : mnBase(c); };

/* 감별진단 읽기도 전부 여기를 지난다 — 카드뷰 ⑦ · 라이브러리 · 프린트 · 검색.
   말야마(mnBase/mnOf/mnEdited/mnDisp)와 완전히 대칭이다. */
const ddxBase=c=>String(Array.isArray(c&&c.ddx)?c.ddx.join(", "):((c&&c.ddx)||"")).trim();
const ddxEdited=c=>!!(c && ddxOv[c.id] && ddxOv[c.id].text);
const ddxOf=c=>{ const o=c&&ddxOv[c.id];
  return (o&&o.text) ? String(o.text).trim() : ddxBase(c); };

/* ── 형광펜 ────────────────────────────────────────────────
   저장은 글자 인덱스가 아니라 "칠한 문자열 자체"다. 말야마를 고쳐도
   엉뚱한 글자에 칠해지지 않고, 그 문자열이 사라지면 그냥 안 칠해진다(조용히 무시). */
/* 칠할 수 있는 필드 목록 — 새 필드를 늘릴 땐 여기만 고치면 아래가 전부 따라온다.
   hl 레코드 하나(ts 1개)에 세 필드가 같이 들어간다. 시트도 열 하나로 받는다. */
const HLF=["mn","ddx","fb"];
const hlOf=(c,f)=>{ const r=c&&hlOv[c.id]; const a=r&&r[f]; return Array.isArray(a)?a:[]; };
const hlHas=(c,f)=>hlOf(c,f).length>0;
/* 원문(plain) → escape + <mark> 삽입. 사용자 입력이든 원본이든 전부 escape 한다
   (원본 감별진단에 "[급성<2 주]" 같은 리터럴 '<' 가 있어 raw 삽입은 위험하다). */
/* 어떤 칠이 실제로 화면에 살아남는지 계산한다. 겹치면 먼저·긴 쪽이 이긴다.
   hlHtml 과 hlToggle 이 같은 규칙을 봐야 해서 따로 뺐다 —
   안 그러면 "저장은 됐는데 화면엔 안 보이는" 유령 레코드가 생긴다. */
function hlKeep(text,spans){
  const t=String(text==null?"":text);
  const hits=[];
  if(!t||!spans||!spans.length) return hits;
  spans.forEach((sp,idx)=>{
    const s=String((sp&&sp.t)||""); if(!s) return;
    const cl=(sp.c==="p")?"p":"y";
    let from=0,i;
    while((i=t.indexOf(s,from))>=0){ hits.push({a:i,b:i+s.length,c:cl,i:idx}); from=i+s.length; }
  });
  if(!hits.length) return hits;
  hits.sort((x,y)=>x.a-y.a||y.b-x.b);
  const keep=[]; let end=-1;
  for(const m of hits){ if(m.a>=end){ keep.push(m); end=m.b; } }
  return keep;
}
function hlHtml(text,spans){
  const t=String(text==null?"":text);
  if(!t) return "";
  if(!spans||!spans.length) return esc(t);
  const keep=hlKeep(t,spans);
  if(!keep.length) return esc(t);
  let h="",p=0;
  for(const m of keep){
    h+=esc(t.slice(p,m.a))+`<mark class="hl${m.c}">`+esc(t.slice(m.a,m.b))+`</mark>`;
    p=m.b;
  }
  return h+esc(t.slice(p));
}
/* 표시용 최종 HTML — 카드뷰·라이브러리·프린트가 전부 이걸 쓴다 */

/* ── 묘비(tombstone) 규칙 ────────────────────────────────────
   "지움"을 레코드 삭제로 표현하면 로컬 ts 가 0 이 되어, 시트에 남아 있는 옛 값(ts>0)이

   그래서 지울 때 레코드를 없애지 않고 **빈 값 + 지운 시각**을 남긴다.
   읽기 함수들은 빈 값을 "없음"으로 취급하므로 화면 표시는 종전과 똑같다. */

/* ── 말야마 덮어쓰기 저장소 (피드백과 같은 패턴) ── */

const hlSaveLS=()=>{ try{ localStorage.setItem(LS_HL,JSON.stringify(hlOv)); }catch(e){} };
function hlRec(id){ const r=hlOv[id]; return (r&&typeof r==="object")?r:{}; }
function hlSetField(card,f,arr,ts){

  if(arr&&arr.length) r[f]=arr; else delete r[f];
  r.ts=ts;

     "fb 만 칠해진 레코드"가 묘비로 판정돼 방금 칠한 게 그 자리에서 지워진다 */
