<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CPX 플래시카드</title>
<style>
/* ═══ CPX 답안지 (OMR) ═══════════════════════════════════════
   채점표 은유: 문진 단계 = 마킹 칸. 칠하면 열리고, 건너뛰면 빈칸이 남는다. */
:root{
  /* 표면 3단: 배경 → 카드 → 크롬(헤더·푸터). 밝기차만으로는 안 뜨므로 --elev 로 띄운다 */
  --paper:#F1F3F6; --card:#FFFFFF; --chrome:#FFFFFF;
  --ink:#14161A; --ink2:#5C636C;
  --rule:#E3E7EC; --rule2:#EDEFF2;
  --fill:#5762CE;              /* UI 액센트(인디고) — 평가색과 역할을 분리한다 */
  --onfill:#FFFFFF;            /* 액센트를 배경으로 깔 때 그 위 글자 */
  --mark:#C8232C;              /* 빨간펜 = 놓친 것 */
  --know:#1F7A57; --dont:#C8232C; --unrated:#C9D0D8;
  --elev:0 1px 3px rgba(20,22,26,.08),0 10px 26px rgba(20,22,26,.07);
  --elev-sm:0 1px 2px rgba(20,22,26,.06),0 2px 8px rgba(20,22,26,.05);
  --r-card:12px; --r-ctl:9px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --kr:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  /* 컬러태그(난이도) — 외움/모름(--know/--dont)과 같은 초록·빨강 계열이지만
     채도를 낮추고 "왼쪽 띠 + 이모지"로만 쓴다. 테두리는 절대 태그색을 쓰지 않는다. */
  --tag-hard:#B3382B; --tag-mid:#8A6410; --tag-easy:#146B66;
  /* 형광펜 2색 */
  --hl-y:#FFF2A8; --hl-p:#FBD3E4; --hl-ink:#14161A;
  /* 진도표 히트맵 — 같은 주제를 몇 번째 했는지. 인디고(UI) 계열 5단계 */
  --jd1:#E3E6F9; --jd2:#C2C8F1; --jd3:#9FA8EA; --jd4:#5762CE; --jd5:#343CA0;
  --jd-lo:#1E2358; --jd-hi:#FFFFFF; --jd-we:#F6F7F9; --jd-today:#D98E04; --jd-sat:#3D6FB0; --jd-sun:#C8232C;
}
/* ── 다크 토큰 ────────────────────────────────────────────────
   테마는 3상태다: 저장값이 없으면 OS 를 따르고(=아무 속성도 안 붙는다),
   헤더 ☾/☀ 를 누르면 <html data-theme="dark|light"> 가 붙어 그 선택이 이긴다.
   그래서 같은 값을 두 번 적는다 — 미디어쿼리는 "light 를 고르지 않았을 때"로 좁히고,
   속성 선택자는 OS 가 밝아도 이기게 한다.
   ⚠️ 아래 두 블록은 값이 같아야 한다. 색을 고칠 땐 반드시 둘 다 고칠 것. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121417; --card:#1C1F24; --chrome:#171A1F;
    --ink:#F2F4F7; --ink2:#98A2AD;
    --rule:#2A2F36; --rule2:#24282E;
    --fill:#9BA5F3; --onfill:#111324;
    --mark:#F2716B; --know:#5FBF98; --dont:#F2716B; --unrated:#39414A;
    --elev:0 0 0 1px rgba(255,255,255,.05),0 10px 28px rgba(0,0,0,.55);
    --elev-sm:0 0 0 1px rgba(255,255,255,.04),0 3px 10px rgba(0,0,0,.4);
    --tag-hard:#E8897A; --tag-mid:#D9AE5A; --tag-easy:#57C7BE;
    --hl-y:#5A4E1A; --hl-p:#5E2C41; --hl-ink:#F2F4F7;
    --jd1:#262A45; --jd2:#343B72; --jd3:#454FA0; --jd4:#7A86E4; --jd5:#B3BBF8;
    --jd-lo:#E6E9FF; --jd-hi:#111324; --jd-we:#20242A; --jd-today:#E8B448; --jd-sat:#8FB2E6; --jd-sun:#F2716B;
  }
}
:root[data-theme="dark"]{
  --paper:#121417; --card:#1C1F24; --chrome:#171A1F;
  --ink:#F2F4F7; --ink2:#98A2AD;
  --rule:#2A2F36; --rule2:#24282E;
  --fill:#9BA5F3; --onfill:#111324;
  --mark:#F2716B; --know:#5FBF98; --dont:#F2716B; --unrated:#39414A;
  --elev:0 0 0 1px rgba(255,255,255,.05),0 10px 28px rgba(0,0,0,.55);
  --elev-sm:0 0 0 1px rgba(255,255,255,.04),0 3px 10px rgba(0,0,0,.4);
  --tag-hard:#E8897A; --tag-mid:#D9AE5A; --tag-easy:#57C7BE;
  --hl-y:#5A4E1A; --hl-p:#5E2C41; --hl-ink:#F2F4F7;
  --jd1:#262A45; --jd2:#343B72; --jd3:#454FA0; --jd4:#7A86E4; --jd5:#B3BBF8;
  --jd-lo:#E6E9FF; --jd-hi:#111324; --jd-we:#20242A; --jd-today:#E8B448; --jd-sat:#8FB2E6; --jd-sun:#F2716B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--kr);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ── 헤더: 답안지 상단 마킹 스트립 ── */
header{padding:10px 14px 9px;background:var(--chrome);border-bottom:1px solid var(--rule);
  position:relative}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.title{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;margin-right:auto;color:var(--ink2)}
.title::after{content:" / 답안지";letter-spacing:0;font-family:var(--kr);font-size:11px;opacity:.65}

.toggle{font-size:11.5px;padding:5px 10px;border-radius:var(--r-ctl);background:transparent;
  border:1px solid var(--rule);color:var(--ink2);cursor:pointer;user-select:none;
  font-family:var(--mono);letter-spacing:.02em;transition:.13s}
.toggle:hover{border-color:var(--fill);color:var(--ink)}
.toggle.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* 진행바 = 타이밍 마크 */
.pbar{display:flex;gap:3px;height:4px;margin:9px 0 8px}
.pbar>span{flex:1;border-radius:99px;background:var(--unrated)}
.pbar>span.know{background:var(--know);opacity:1}
.pbar>span.dont{background:var(--dont);opacity:1}
/* 계기판 스트립 — 진행률·외움·모름·미평가를 숫자로 세운다 */
.pstats{display:flex;gap:0}
.pstats>span{flex:1;display:flex;flex-direction:column;gap:1px;
  border-left:1px solid var(--rule);padding-left:10px}
.pstats>span:first-child{border-left:0;padding-left:0}
.pstats b{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.02em;
  color:var(--ink);line-height:1.15}
.pstats b.acc{color:var(--fill)}
.pstats i{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink2)}

.search{flex:1;min-width:150px;padding:6px 9px;border:1px solid var(--rule);border-radius:var(--r-ctl);
  background:var(--paper);color:var(--ink);font-size:12.5px;font-family:var(--kr)}
.search:focus{outline:2px solid var(--fill);outline-offset:-1px;border-color:var(--fill)}
.chips{display:flex;gap:5px;overflow-x:auto;margin-top:7px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:11px;padding:4px 9px;border:1px solid var(--rule);
  border-radius:var(--r-ctl);color:var(--ink2);cursor:pointer;font-family:var(--mono);letter-spacing:.02em}
.chip.on{background:var(--fill);border-color:var(--fill);color:var(--onfill)}

/* ── 본문 ── */
main{flex:1;overflow-y:auto;padding:13px;-webkit-overflow-scrolling:touch}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:11px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink2);
  text-transform:uppercase}
.badge{margin-left:auto;padding:2px 8px;border:1px solid var(--rule);border-radius:var(--r-ctl);
  letter-spacing:.06em}
.badge.know{color:var(--know);border-color:var(--know)}
.badge.dont{color:var(--dont);border-color:var(--dont)}

/* 앞면: 주호소 */
.frontwrap{display:flex;align-items:center;justify-content:center;min-height:54vh}
.front{text-align:center;cursor:pointer;padding:34px 20px;width:100%;
  border:1px solid var(--rule);border-radius:var(--r-card);background:var(--card);
  box-shadow:var(--elev);position:relative}
.front::before{content:"주 호 소";position:absolute;top:13px;left:0;right:0;
  font-family:var(--mono);font-size:10px;letter-spacing:.42em;color:var(--ink2);opacity:.8}
.sym{font-size:clamp(30px,8.5vw,46px);font-weight:800;letter-spacing:-.025em;line-height:1.18}
.hint{margin-top:15px;font-size:11px;color:var(--ink2);font-family:var(--mono);letter-spacing:.05em}

/* ── 단계 = 마킹 행 (시그니처) ── */
.steps{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule);
  border-radius:var(--r-card);background:var(--card);box-shadow:var(--elev);overflow:hidden}
.step{border-bottom:1px solid var(--rule2);padding:0;position:relative}
.step:last-child{border-bottom:0}
.step h4{margin:0;padding:11px 13px 11px 16px;font-size:13px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;
  color:var(--ink)}
/* 상태 띠 — 행 왼쪽 세로선. 동그라미보다 좌측 여백을 24px 덜 먹어 본문이 그만큼 넓어진다 */
.step::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--rule);transition:.15s}
.step.open::before{background:var(--fill)}
.step.skipped::before{background:var(--mark)}
.step.locked{opacity:.5;cursor:pointer}
.step.next{opacity:1;cursor:pointer;background:color-mix(in srgb,var(--fill) 7%,transparent)}
.step.next::before{background:var(--fill);animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.step.skipped h4{color:var(--mark)}
.step .body{padding:0 13px 13px 16px;font-size:13.5px;line-height:1.68}
.lock{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;
  color:var(--fill);flex-shrink:0}
.lock.dim{color:var(--ink2);opacity:.5}
.lock.miss{color:var(--mark)}

.kv{display:flex;flex-direction:column;gap:6px}
.kvrow{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:start}
.kvrow b{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink2);
  font-weight:700;padding-top:3px;border-right:1px solid var(--rule2);padding-right:8px}
.script div{padding:5px 0;border-bottom:1px dashed var(--rule2);font-size:13px;line-height:1.62}
.script div:last-child{border-bottom:0}

.mn{font-size:17px;font-weight:800;letter-spacing:.01em;color:var(--fill);line-height:1.45}
.aexp{margin-top:8px;font-size:12.5px;line-height:1.62;color:var(--ink2)}
.astepwrap{margin-top:9px}
.astep{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--fill);
  border:1px solid var(--fill);padding:3px 8px;border-radius:var(--r-ctl);display:inline-block}
.asks{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.ask{display:grid;grid-template-columns:78px 1fr;gap:9px;font-size:12.5px;align-items:start}
.ask b{font-family:var(--mono);font-size:10.5px;color:var(--ink2);padding-top:2px;font-weight:700}
.ask i{font-style:normal;line-height:1.55}
.warn{color:var(--mark);font-weight:600}

.stepbar{display:flex;gap:7px;justify-content:center;margin:12px 0 2px}
.empty{text-align:center;color:var(--ink2);padding:48px 16px;font-size:13px;line-height:1.7}

/* ── 푸터 ── */
footer{border-top:1px solid var(--rule);background:var(--chrome);padding:10px 14px 12px}
.rate{display:flex;gap:8px;margin-bottom:8px}
.rate button{flex:1;padding:12px;border-radius:var(--r-ctl);border:1px solid var(--rule);
  background:transparent;color:var(--ink2);font-size:13px;font-weight:700;cursor:pointer;
  font-family:var(--kr);transition:.13s}
.rate button.know:hover,.rate button.know:focus-visible{border-color:var(--know);color:var(--know)}
.rate button.dont:hover,.rate button.dont:focus-visible{border-color:var(--dont);color:var(--dont)}
.nav{display:flex;align-items:center;gap:8px}
.nav button{padding:8px 13px;border-radius:var(--r-ctl);border:1px solid var(--rule);background:transparent;
  color:var(--ink2);font-size:12.5px;cursor:pointer;font-family:var(--kr)}
.nav button:hover{border-color:var(--fill);color:var(--ink)}
.pos{margin:0 auto;font-family:var(--mono);font-size:12px;letter-spacing:.09em;color:var(--ink2)}

:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){
  .step h4{padding-left:14px;font-size:12.5px}
  .step .body{padding-left:14px}
  .kvrow,.ask{grid-template-columns:62px 1fr}
}

/* 읽기 폭 제한 (데스크톱) */
header>*,main>*,footer>*{max-width:880px;margin-inline:auto}

/* ═══════════════════════════════════════════════════════════════
   v4 셸: 입장 게이트 · 뷰 전환 · 라이브러리 · 피드백 · 프린트
   (색은 전부 기존 OMR 변수만 사용)
   ═══════════════════════════════════════════════════════════════ */

/* ── 입장 게이트 (2026-08-01 개편 때 유실된 스타일 복구) ── */
#gate{position:fixed;inset:0;z-index:1000;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px}
#gate h1{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
#gate p{color:var(--ink2);font-size:13px;margin:0;max-width:320px;line-height:1.7;text-align:center}
#gate input{width:252px;max-width:82vw;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r-ctl);color:var(--ink);padding:9px 11px;font-size:14px;font-family:var(--kr)}
#gate input:focus{outline:2px solid var(--fill);outline-offset:-1px;border-color:var(--fill)}
#gate button{width:252px;max-width:82vw;background:var(--ink);color:var(--card);
  border:1px solid var(--ink);border-radius:var(--r-ctl);padding:10px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:var(--kr)}
#gate .err{color:var(--mark);font-size:12.5px;min-height:17px;font-family:var(--mono)}
#gate.hidden{display:none}

/* ── 헤더 아이콘 버튼 (☾/☀ · 로그아웃) — 글자 버튼 옆에서 작게 ── */
.iconbtn{width:26px;height:26px;flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;border:1px solid var(--rule);border-radius:var(--r-ctl);
  color:var(--ink2);background:transparent;cursor:pointer;user-select:none;
  font-size:13px;line-height:1;transition:.13s}
.iconbtn:hover{border-color:var(--fill);color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--fill);outline-offset:1px}
#tOut:hover{border-color:var(--mark);color:var(--mark)}

/* ── 로그아웃 확인 ── */
#outbox{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:22px}
#outbox.hidden{display:none}
#outbox .outcard{background:var(--card);color:var(--ink);border:1px solid var(--rule);
  border-radius:var(--r-card);box-shadow:var(--elev);padding:18px 19px 15px;max-width:400px;width:100%}
#outbox h3{margin:0 0 9px;font-size:15px}
#outbox p{margin:0;color:var(--ink2);font-size:13px;line-height:1.75;min-height:60px}
#outbox .good{color:var(--know)} #outbox .bad{color:var(--mark)}
#outbox .outrow{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.toggle.danger{border-color:var(--mark);color:var(--mark)}
.toggle.danger:hover{background:var(--mark);color:var(--onfill);border-color:var(--mark)}
/* 확인이 끝나기 전엔 누르지 못하게 한다 — 백업 결과를 모른 채 지우면 안 된다 */
.toggle.wait{opacity:.4;pointer-events:none}
.gwho{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink2);
  white-space:nowrap}
.gwho:empty{display:none}
/* 시트 백업 상태 — 평소엔 조용한 회색, 확인 안 된 게 5분 넘으면 빨간 경고 */
.bkstat{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink2);
  white-space:nowrap;cursor:pointer;padding:2px 5px;border:1px solid transparent;border-radius:var(--r-ctl)}
.bkstat:empty{display:none}
.bkstat.bad{color:var(--onfill);background:var(--dont);border-color:var(--dont);font-weight:700}

/* ── 뷰 전환 ── */
.vsw{display:flex;border:1px solid var(--rule);border-radius:var(--r-ctl);overflow:hidden;flex:none}
.vsw span{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:5px 9px;
  color:var(--ink2);cursor:pointer;border-right:1px solid var(--rule);user-select:none;transition:.13s}
.vsw span:last-child{border-right:0}
.vsw span:hover{color:var(--ink)}
.vsw span.on{background:var(--ink);color:var(--card)}
body.v-lib .cardonly,body.v-print .cardonly{display:none}
body.v-lib footer,body.v-print footer{display:none}
body.v-lib header>*,body.v-print header>*{max-width:none}
body.v-lib main,body.v-print main{padding:0;overflow:hidden;display:flex;flex-direction:column}
body.v-lib main>*,body.v-print main>*{max-width:none;margin-inline:0}
/* ── 진도표 뷰 ── */
body.v-jindo .cardonly,body.v-jindo footer,body.v-jindo .filterrow,body.v-jindo #chips{display:none}
body.v-jindo header>*{max-width:none}
body.v-jindo main>*{max-width:none;margin-inline:0}
.jd{display:flex;flex-direction:column;gap:10px}
.jd-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px}
.jd-top h2{margin:0;font-size:16px;font-weight:700}
.jd-top .rng{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.jd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r-ctl);overflow:hidden}
.jd-stat{background:var(--card);padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.jd-stat .k{font-size:11px;color:var(--ink2)}
.jd-stat .v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.jd-stat .v small{font-size:11px;color:var(--ink2);font-weight:500;margin-left:3px}
/* 2·3·4회 이상 칸은 눌러서 주제 목록을 연다 (2026-09-30) */
.jd-stat.pick{cursor:pointer;transition:background .13s}
.jd-stat.pick:hover{background:var(--chrome)}
.jd-stat.pick:focus-visible{outline:2px solid var(--fill);outline-offset:-2px}
.jd-stat.pick .k::after{content:" ›";color:var(--ink2)}
#jdpop{position:fixed;inset:0;z-index:1050;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:16px}
#jdpop[hidden]{display:none}
#jdpop .pc{background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:var(--r-card);
  box-shadow:var(--elev);width:100%;max-width:460px;max-height:min(80vh,640px);display:flex;flex-direction:column}
#jdpop .ph{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
#jdpop .ph h3{margin:0;font-size:15px;flex:1}
#jdpop .ph .n{font-family:var(--mono);font-size:12px;color:var(--ink2)}
#jdpop .ph .x{border:0;background:none;color:var(--ink2);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
#jdpop .pb{overflow:auto;padding:10px 16px 14px;display:flex;flex-direction:column;gap:10px}
#jdpop .g{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:13px}
#jdpop .g .gn{color:var(--ink2);font-size:11.5px;padding-top:3px}
#jdpop .chips{display:flex;flex-wrap:wrap;gap:5px}
#jdpop .chip{border:1px solid var(--rule);border-radius:var(--r-ctl);padding:2px 7px;font-size:12.5px;white-space:nowrap}
#jdpop .chip b{font-family:var(--mono);font-weight:600;font-size:11px;margin-left:4px;color:var(--ink2)}
#jdpop .sub{font-size:11.5px;color:var(--ink2);border-top:1px dashed var(--rule);padding-top:9px;margin-top:2px}
#jdpop .chip.lo{color:var(--ink2);border-style:dashed}
#jdpop .empty{font-size:13px;color:var(--ink2);padding:6px 0}
.jd-bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.jd-bar>span{display:block;height:100%;background:var(--fill)}
.jd-sys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.jd-sys>div{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:11px;padding:6px 9px;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r-ctl)}
.jd-sys .n{font-family:var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.jd-sys .jd-bar{grid-column:1/-1}
.jd-leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:11px;color:var(--ink2)}
.jd-leg .ramp{display:flex;gap:2px}
.jd-leg .ramp span{width:20px;height:14px;border-radius:2px;font:600 9px/14px var(--mono);text-align:center}
.jd-scroll{overflow:auto;max-height:calc(100vh - 150px);background:var(--card);border:1px solid var(--rule);border-radius:var(--r-ctl)}
.jd table{border-collapse:separate;border-spacing:0;font-size:12px}
.jd th,.jd td{border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2);padding:0}
.jd thead th{position:sticky;top:0;z-index:3;background:var(--chrome);color:var(--ink2);font-weight:500;height:36px;
  border-bottom:1px solid var(--rule)}
.jd thead th.d{width:30px;min-width:30px;font:500 10px/1.25 var(--mono)}
.jd thead th.d .w{display:block;font-family:var(--kr)}
.jd thead th.sat{color:var(--jd-sat)} .jd thead th.sun{color:var(--jd-sun)}
.jd thead th.today{box-shadow:inset 0 -3px 0 var(--jd-today);color:var(--ink)}
.jd .c1,.jd .c2{position:sticky;z-index:2;background:var(--card);text-align:left}
.jd .c1{left:0;width:64px;min-width:64px}
.jd .c2{left:64px;width:128px;min-width:128px;box-shadow:1px 0 0 var(--rule)}
.jd thead .c1,.jd thead .c2{z-index:4;background:var(--chrome);padding-left:8px}
.jd td.c1{font-weight:700;font-size:10.5px;padding:4px 6px;text-align:center;line-height:1.35;color:var(--ink)}
.jd td.c2{padding:0 8px;white-space:nowrap;height:26px}
.jd td.c2 .t{display:flex;justify-content:space-between;gap:6px}
.jd td.c2 .cnt{font:500 10px var(--mono);color:var(--ink2)}
.jd td.c2 .cnt.on{color:var(--fill);font-weight:600}
.jd tr.gs td{border-top:2px solid var(--rule)}
.jd td.x{width:30px;min-width:30px;height:26px;text-align:center;cursor:pointer;background:var(--card);
  font:600 10px/1 var(--mono);color:transparent;transition:background-color .12s}
.jd td.x.we{background:var(--jd-we)}
.jd td.x.today{box-shadow:inset 2px 0 0 var(--jd-today),inset -2px 0 0 var(--jd-today)}
.jd td.x:hover{outline:2px solid var(--ink2);outline-offset:-2px}
.jd td.x:focus-visible{outline:2px solid var(--fill);outline-offset:-2px}
.jd td.x[data-l="1"]{background:var(--jd1);color:var(--jd-lo)}
.jd td.x[data-l="2"]{background:var(--jd2);color:var(--jd-lo)}
.jd td.x[data-l="3"]{background:var(--jd3);color:var(--jd-lo)}
.jd td.x[data-l="4"]{background:var(--jd4);color:var(--jd-hi)}
.jd td.x[data-l="5"]{background:var(--jd5);color:var(--jd-hi)}
.jd tfoot td{position:sticky;bottom:0;z-index:3;background:var(--card);border-top:2px solid var(--rule);height:28px}
.jd tfoot td.c1,.jd tfoot td.c2{z-index:4}
.jd tfoot td.c2{font-size:11px;color:var(--ink2)}
.jd tfoot td.dt{text-align:center;font:600 10px/1 var(--mono)}
.jd-note{font-size:11px;color:var(--ink2)}
.jd-wait{font-size:12px;padding:7px 10px;border-radius:var(--r-ctl);background:var(--jd1);color:var(--jd-lo)}
@media (prefers-reduced-motion:reduce){.jd td.x{transition:none}}
@media (max-width:600px){ .jd .c1{width:26px;min-width:26px} .jd .c2{left:26px;width:108px;min-width:108px}
  .jd td.c1{writing-mode:vertical-rl;padding:4px 2px;letter-spacing:.04em} .jd thead .c1{padding-left:0;font-size:0} }

/* 평가 버튼 활성 표시(.act 스타일 누락 보완) */
.rate button.act.know{border-color:var(--know);color:var(--know);
  background:color-mix(in srgb,var(--know) 11%,transparent)}
.rate button.act.dont{border-color:var(--dont);color:var(--dont);
  background:color-mix(in srgb,var(--dont) 11%,transparent)}

/* ── 컨트롤 바 (라이브러리 · 프린트 공용) ── */
.cbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 13px;flex:none;
  background:var(--chrome);border-bottom:1px solid var(--rule)}
.cbar .lab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink2);
  text-transform:uppercase}
.cbar .sep{width:1px;height:15px;background:var(--rule);margin:0 2px}
.cbar .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;
  color:var(--ink2)}
.cbar .toggle{padding:4px 9px;font-size:11px}
.sel{border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--paper);color:var(--ink);
  font-family:var(--mono);font-size:11px;padding:4px 6px}
.sel:focus{outline:2px solid var(--fill);outline-offset:-1px}

/* ── 라이브러리 그리드: 보이는 영역을 정확히 3행으로 등분 ── */
.libscroll{flex:1;min-height:0;overflow-y:auto;padding:9px 13px;scrollbar-gutter:stable;
  -webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));
  gap:var(--gap,9px);grid-auto-rows:var(--rowh,170px)}
.tile{border:1.5px solid var(--unrated);border-radius:var(--r-card);background:var(--card);
  box-shadow:var(--elev-sm);
  padding:8px 10px 9px;display:flex;flex-direction:column;gap:4px;cursor:pointer;
  overflow:hidden;transition:border-color .13s}
.tile:hover{border-color:var(--fill)}
.tile.know{border-color:var(--know)}
.tile.dont{border-color:var(--dont)}
.tile .tsys{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink2);flex:none;
  text-transform:uppercase;opacity:.85}
.tile .tname{font-size:12.5px;font-weight:800;line-height:1.32;flex:none;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* 계통·제목은 고정 높이, 그 아래 칸들(말야마·감별진단·피드백)은 켜진 개수만큼
   남은 높이를 1fr씩 균등 분배한다. 하나만 켜면 그 칸이 남은 높이를 전부 차지.
   칸 사이 구분선·여백은 .cell에 똑같이 줘야 세 칸의 바깥 높이가 정확히 같아진다
   (border-box + flex-basis:0에서는 padding·border 차이가 그대로 높이 차이로 남는다). */
.tile .cell{flex:1 1 0;min-height:0;overflow:hidden;
  border-top:1px solid transparent;padding-top:4px}
.tile .hero{display:grid;place-items:center;text-align:center}
.tile .hero>span{display:block;max-width:100%;font-weight:800;color:var(--fill);
  line-height:1.3;overflow-wrap:anywhere;word-break:break-word;font-size:18px}
.tile .hero>span.mnempty{color:var(--ink2);font-weight:700}
/* 최소 크기로도 안 들어가는 초장문: 하드 컷 대신 아래로 흐려서 "더 있음" 표시 */
.tile .cell.clip{-webkit-mask-image:linear-gradient(180deg,#000 76%,transparent 99%);
  mask-image:linear-gradient(180deg,#000 76%,transparent 99%)}
.tile .tddx,.tile .tfb{border-top-style:dashed;border-top-color:var(--rule2);color:var(--ink2)}
.tile .tddx>span,.tile .tfb>span{display:block;font-size:10.5px;line-height:1.34;
  overflow-wrap:anywhere;word-break:break-word}
.tile .tfb{color:var(--ink)}
.tile .tfb>span::before{content:"✎ ";color:var(--mark)}

/* ── 피드백 메모 ── */
.fbwrap{margin-top:15px;border:1px solid var(--rule);border-radius:var(--r-card);
  background:var(--card);box-shadow:var(--elev);padding:10px 12px 11px}
.fbhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fbhead .lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--ink2);
  text-transform:uppercase;margin-right:auto}
.fbwrap textarea{width:100%;min-height:66px;resize:vertical;background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);border-radius:var(--r-ctl);padding:8px 9px;font-size:13px;line-height:1.62;
  font-family:var(--kr)}
.fbwrap textarea:focus{outline:2px solid var(--fill);outline-offset:-1px;border-color:var(--fill)}
/* 형광펜을 칠하는 표시 레이어. 아래 입력칸과 같은 글자 크기라 칠한 위치가 바로 대응된다 */
.fbread{font-size:13px;line-height:1.62;color:var(--ink);white-space:pre-wrap;word-break:break-word;
  padding:2px 2px 9px;margin-bottom:9px;border-bottom:1px solid var(--rule)}
.fbrow{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.fbmsg{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink2);margin-left:auto}

/* ── 말야마 편집 (피드백 메모와 같은 상자, ③A 공개 후에만 등장) ── */
.mnwrap textarea{min-height:46px;font-weight:700;color:var(--fill);font-size:14px}
.mnflag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mark);
  border:1px solid var(--mark);border-radius:6px;padding:1px 5px;white-space:nowrap}
.mn .mnflag{border:0;padding:0;margin-left:7px;font-size:12px;vertical-align:middle}
.mnorig{font-size:10.5px;line-height:1.45;color:var(--ink2);flex:1 1 100%;min-width:0;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mnorig b{font-family:var(--mono);font-size:10px;letter-spacing:.07em;margin-right:4px}
.tile .tsys .edm{color:var(--mark);margin-left:4px}
.pcard .pmn .pedit{color:var(--ink2);font-size:10px;margin-right:3px}

/* ── 프린트 미리보기 ── */
.prscroll{flex:1;min-height:0;overflow-y:auto;padding:14px 13px 30px;background:var(--paper)}
#printdoc{max-width:980px;margin:0 auto;column-gap:13px}
#printdoc.c2{column-count:2}
#printdoc.c3{column-count:3}
.pcard{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
  display:inline-block;width:100%;border:1px solid var(--rule);border-radius:var(--r-card);
  background:var(--card);padding:8px 11px 9px;margin:0 0 10px}
.pcard h3{margin:0 0 3px;font-size:13.5px;font-weight:800;line-height:1.35}
.pcard h3 .psys{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink2);
  font-weight:600;margin-left:5px}
.pcard .pmn{font-size:12.5px;font-weight:700;color:var(--fill);line-height:1.5;margin:4px 0}
.pcard .pddx,.pcard .pfb{font-size:11px;line-height:1.5;color:var(--ink2);margin:3px 0}
.pcard .pddx b,.pcard .pfb b{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  margin-right:4px}
.pcard .psteps{margin-top:5px;border-top:1px dashed var(--rule2);padding-top:5px}
.pcard .pstep{font-size:11px;line-height:1.5;margin:4px 0}
.pcard .pstep>b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
  color:var(--ink2);margin-bottom:2px}
.pcard .mn{font-size:12px;line-height:1.45}
.pcard .aexp{font-size:10.5px;margin-top:4px}
.pcard .kvrow,.pcard .ask{grid-template-columns:58px 1fr;gap:7px;font-size:11px}
.pcard .kvrow b,.pcard .ask b{font-size:9.5px}
.pcard .asks,.pcard .astepwrap{margin-top:5px}
.pcard .script div{font-size:11px;padding:3px 0}

/* ═══ 신규: 컬러태그 · 라이브러리 탭 · 형광펜 · 감별진단 편집 ═══ */

/* ── 형광펜 (말야마 · 감별진단 공용) ──
   저장은 "칠한 문자열" 자체다(인덱스 아님). 표시할 때 원문에서 찾아 <mark>로 감싼다. */
mark.hly,mark.hlp{background:var(--hl-y);color:var(--hl-ink);border-radius:2px;padding:0 1px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
mark.hlp{background:var(--hl-p)}
[data-hlt]{cursor:text}
.pen{display:inline-flex;align-items:center;gap:5px}
.pen .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink2);
  text-transform:uppercase}
.penbtn{width:26px;height:21px;border:1px solid var(--rule);border-radius:6px;cursor:pointer;
  display:inline-block;vertical-align:middle;background:var(--hl-y)}
.penbtn.p{background:var(--hl-p)}
.penbtn.x{background:transparent;width:auto;padding:0 8px;color:var(--ink2);font-family:var(--mono);
  font-size:10.5px;line-height:19px;text-align:center}
.penbtn:hover{border-color:var(--fill)}

/* ── 컬러태그: 카드뷰 버튼 4개 ── */
.tagbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 11px}
.tagbar .lab{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink2);
  text-transform:uppercase}
.tagbtn{font-family:var(--kr);font-size:11.5px;padding:4px 9px;border:1px solid var(--rule);
  border-radius:var(--r-ctl);color:var(--ink2);cursor:pointer;user-select:none;background:transparent;
  transition:.13s;white-space:nowrap}
.tagbtn:hover{border-color:var(--ink2);color:var(--ink)}
.tagbtn.on{color:var(--onfill);border-color:transparent;font-weight:700}
.tagbtn.on[data-tag="hard"]{background:var(--tag-hard)}
.tagbtn.on[data-tag="mid"]{background:var(--tag-mid)}
.tagbtn.on[data-tag="easy"]{background:var(--tag-easy)}
.tagbtn.on[data-tag=""]{background:var(--ink);color:var(--card)}

/* ── 컬러태그: 라이브러리 타일 왼쪽 띠 ──
   테두리(외움/모름)와 겹쳐 읽히지 않도록 "안쪽 왼쪽 띠 + 계통줄 이모지" 두 경로로 표시한다. */
.tile{position:relative}
.tile.tg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tgc)}
.tile.tg-hard{--tgc:var(--tag-hard)}
.tile.tg-mid{--tgc:var(--tag-mid)}
.tile.tg-easy{--tgc:var(--tag-easy)}
.tile .tsys .tgm{margin-left:4px;font-size:10px;vertical-align:middle;letter-spacing:0}

/* ── 라이브러리 탭 ── */
.libtabs{display:flex;border:1px solid var(--rule);border-radius:var(--r-ctl);overflow:hidden;flex:none}
.libtabs span{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:4px 10px;
  color:var(--ink2);cursor:pointer;border-right:1px solid var(--rule);user-select:none;transition:.13s}
.libtabs span:last-child{border-right:0}
.libtabs span:hover{color:var(--ink)}
.libtabs span.on{background:var(--ink);color:var(--card)}

/* ── 감별진단 편집 (말야마 편집과 같은 상자, ⑦ 공개 후에만 등장) ── */
.ddxwrap textarea{min-height:56px;font-size:13px;color:var(--ink)}
.pcard .pddx .pedit{color:var(--ink2);font-size:10px;margin-right:3px}

/* ── 인쇄: 항상 흰 종이 · 검정 잉크 (다크모드에서 인쇄해도 동일) ──
   반드시 prefers-color-scheme:dark 블록보다 뒤에 와야 변수가 덮인다.
   ⚠️ 위 다크 블록들의 선택자를 **하나도 빠짐없이** 여기 다시 적어야 한다.
   :root[data-theme="dark"] 도, :root:not([data-theme="light"]) 도
   맨 :root 보다 명시도가 높다((0,2,0) vs (0,1,0)) — :not() 은 인자 중 가장 센 것의
   명시도를 갖기 때문이다. 하나라도 빠지면 그 조합에서 다크 토큰이 이겨
   인쇄물에 형광펜이 짙은 올리브 바탕 + 흰 글자로 찍혀 안 읽힌다.
   특히 :not(...) 을 빠뜨리면 **테마를 한 번도 안 누른 사용자(=기본 sys) + OS 다크**가
   깨진다 — 기존 사용자 전원이 그 상태다. 소스 순서로는 못 이긴다. */
@media print{
  :root, :root:not([data-theme="light"]),
  :root[data-theme="dark"], :root[data-theme="light"]{
    --paper:#fff; --card:#fff; --chrome:#fff; --ink:#000; --ink2:#333;
    --rule:#999; --rule2:#c8c8c8;
    --fill:#000; --onfill:#fff; --mark:#000; --know:#000; --dont:#000; --unrated:#777;
    --elev:none; --elev-sm:none;
    /* 형광펜은 인쇄에서도 남는다 — 다크모드 변수를 반드시 덮을 것(안 그러면 검은 바탕이 찍힌다) */
    --hl-y:#FBEB93; --hl-p:#F8C4DB; --hl-ink:#000;
  }
  @page{margin:12mm}
  html,body{height:auto!important;overflow:visible!important;display:block!important;
    background:#fff!important;color:#000!important}
  header,footer,#gate,.gwho,.cbar,.libscroll,.stepbar,.fbwrap,.vsw,.toggle,.chips,.pbar,
  .search,.pstats,.hint,#bkSave,.bkstat,.tagbar,.libtabs,.pen{display:none!important}
  main{padding:0!important;overflow:visible!important;display:block!important;
    max-width:none!important;flex:none!important}
  main>*{max-width:none!important;margin-inline:0!important}
  .prscroll{overflow:visible!important;padding:0!important;background:#fff!important;
    flex:none!important;min-height:0!important}
  #printdoc{max-width:none;margin:0}
  .pcard{border:1px solid #999!important;background:#fff!important;box-shadow:none;
    color:#000!important}
  .pcard .pmn{color:#000!important}
  .steps,.step,.front{background:#fff!important;color:#000!important}
  a[href]::after{content:""}
}

/* ── 복기 (⑨ 단계) ── */
.bok{font-size:13px;line-height:1.62}
.bok p{margin:3px 0 5px}
.boks{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink2);
  font-weight:700;margin:12px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--rule2)}
.bok .boks:first-child{margin-top:0}
.bokt{font-weight:800;font-size:13.5px;color:var(--fill);margin:9px 0 3px}
.boktb{overflow-x:auto;margin:6px 0}
.boktb table{border-collapse:collapse;font-size:12px}
.boktb th,.boktb td{border:1px solid var(--rule2);padding:3px 6px;text-align:left;vertical-align:top}
.boktb th{font-weight:700}
.bokcw{margin-top:12px;padding-top:9px;border-top:1px dashed var(--rule2)}
.bokkv{margin:4px 0 8px;border-top:1px solid var(--rule2)}
.bkr{display:grid;grid-template-columns:62px 1fr;gap:0 8px;padding:3px 0;border-bottom:1px solid var(--rule2)}
.bkr>b{font-size:11.5px;font-weight:800;color:var(--ink2);word-break:keep-all}
.bkr.sub>b{font-weight:600;padding-left:10px}
.bkr>div{min-width:0;overflow-wrap:anywhere}
.bkr>div>div{margin:0 0 2px}
.bktag{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-right:3px}
.boksup{margin:8px 0;padding:2px 10px 4px;border-left:3px solid var(--rule2)}
.boksup .boks{border-bottom:0}
.bokg{font-weight:800;font-size:12px;margin:14px 0 4px;color:var(--ink2)}
.pcard .bok{font-size:11px}
.pcard .bokcw{display:none}
</style>
</head>
<body>

<div id="gate">
  <h1>CPX 플래시카드</h1>
  <div id="gateBody">
    <p>이름과 스터디 참여코드를 입력하세요</p>
    <input id="gName" placeholder="이름" autocomplete="off">
    <input id="gCode" placeholder="참여코드" autocomplete="off">
    <button id="gEnter">입장</button>
    <div class="err" id="gErr"></div>
  </div>
</div>

<div id="outbox" class="hidden">
  <div class="outcard">
    <h3>로그아웃할까요?</h3>
    <p id="outMsg"></p>
    <div class="outrow">
      <span class="toggle" id="outNo">취소</span>
      <span class="toggle danger" id="outGo">로그아웃</span>
    </div>
  </div>
</div>

<header>
  <div class="row">
    <span class="title">CPX 플래시카드</span>
    <span class="gwho" id="gwho"></span>
    <span class="toggle" id="bkSave" style="display:none">전체 저장</span>
    <span class="bkstat" id="bkStat"></span>
    <span class="vsw" id="vsw"><span data-view="card">카드</span><span data-view="lib">라이브러리</span><span data-view="print">프린트</span><span data-view="jindo">진도표</span></span>
    <span class="toggle cardonly" id="tCover">가림</span>
    <span class="toggle cardonly" id="tTwo">A 2단검증</span>
    <span class="toggle cardonly" id="tShuf">섞기</span>
    <span class="iconbtn" id="tTheme" title="밝게/어둡게" role="button" tabindex="0" aria-label="밝게/어둡게 전환"></span>
    <span class="iconbtn" id="tOut" title="로그아웃 (계정 전환)" role="button" tabindex="0" aria-label="로그아웃">⏻</span>
  </div>
  <div class="pbar" id="pbar"></div>
  <div class="pstats" id="pstats"></div>
  <div class="row filterrow" style="margin-top:6px;">
    <input class="search" id="search" placeholder="🔍 주제·질환·약자 검색 (예: 파킨슨)">
    <span class="toggle" id="fAll">전체</span>
    <span class="toggle" id="fDont">모름만</span>
    <span class="toggle" id="fUn">미평가만</span>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<footer>
  <div class="rate">
    <button class="know" id="bKnow">✓ 외움 (1)</button>
    <button class="dont" id="bDont">✗ 모름 (2)</button>
  </div>
  <div class="nav">
    <button id="bPrev">◀ 이전</button>
    <span class="pos" id="pos"></span>
    <button id="bNext">다음 ▶</button>
  </div>
</footer>

<script>
const LS_PROG="cpx_progress", LS_SET="cpx_settings", LS_FB="cpx_feedback", LS_FBQ="cpx_fb_queue",
      LS_MN="cpx_mn",
      /* 신규 저장소 — 기존 키의 형식은 건드리지 않고 옆에 새 키를 둔다 */
      LS_DDX="cpx_ddx",      // {카드ID:{text,ts}}      감별진단 덮어쓰기
      LS_TAG="cpx_tag",      // {카드ID:{v,ts}}         v = hard|mid|easy
      LS_HL ="cpx_hl",       // {카드ID:{mn:[{t,c}],ddx:[{t,c}],fb:[{t,c}],ts}}  c = y|p
      LS_PTS="cpx_progress_ts",  // {카드ID:ts} 진도용 타임스탬프. cpx_progress 는 형식 그대로 두고
                                 //            ts 넣을 자리가 없어 별도 키로 뺐다
      LS_SKEW="cpx_skew",        // 서버시계 - 기기시계 (ms). 모든 ts 는 이걸 더해 찍는다
      LS_PEND="cpx_pending",     // push 는 했는데 서버 반영이 아직 확인 안 된 것
      LS_DIRTY="cpx_dirty",      // 로컬에만 저장되고 아직 push 조차 안 한 것
      LS_OK="cpx_lastok",
      LS_OWNER="cpx_owner";  // 이 기기에 지금 담겨 있는 학습데이터의 주인 이름        // 마지막으로 시트 반영이 확인된 시각
const lsObj=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"{}")||{}; }catch(e){ return {}; } };
/* prog/set 은 앱의 뼈대다. 여기서 예외가 나면 모듈 최상위가 죽어 게이트도 안 걷히고
   화면이 백지가 된다(그 상태에서 "사이트 데이터 삭제"를 하면 진도가 통째로 날아간다).
   → 절대 던지지 않는다. 깨진 값은 버리지 말고 별도 키에 원문을 남겨 복구 여지를 둔다. */
function lsObjSafe(k){
  let raw=null;
  try{ raw=localStorage.getItem(k); }catch(e){ return {}; }
  if(raw===null||raw==="") return {};
  try{ const o=JSON.parse(raw);
       if(o && typeof o==="object" && !Array.isArray(o)) return o; }catch(e){}
  try{ localStorage.setItem(k+"_corrupt_"+Date.now(), raw); }catch(e){}
  return {};
}

/* 읽기의 lsObjSafe 와 짝이 되는 쓰기 쪽 안전망.
   Safari 프라이빗 모드는 setItem 이 항상 던지고, 저장 공간이 차도 던진다.
   여기서 예외가 새면 평가 한 번에 렌더가 끊기고 진도가 조용히 사라진다.
   → 절대 던지지 않는다. 대신 저장이 안 된다는 사실을 헤더에 계속 띄운다. */
let lsFail=false;
function lsSet(k,v){
  try{ localStorage.setItem(k,v); return true; }
  catch(e){ if(!lsFail){ lsFail=true; try{ pendPaint(); }catch(e2){} } return false; }
}

/* ── 시각 기준: 오직 서버 시계 ──────────────────────────────
   기기 시계(Date.now())는 틀어질 수 있다. 로컬 ts 와 서버 _ts 를 직접 비교하는 곳이
   많으므로, 저장하는 모든 ts 는 srvNow() = 기기시계 + skew 로 찍는다.
   skew 는 sheetLoad() 응답의 now 로 매번 갱신된다. 아직 모르면 0(=종전과 동일). */
let _skew=0;
try{ const v=Number(localStorage.getItem(LS_SKEW)); if(isFinite(v)) _skew=v; }catch(e){}
function srvNow(){ return Date.now()+_skew; }
function setSkew(serverNow){
  const n=Number(serverNow);
  if(!isFinite(n) || n<=0) return;
  _skew=n-Date.now();
  try{ localStorage.setItem(LS_SKEW,String(Math.round(_skew))); }catch(e){}
}

let prog = lsObjSafe(LS_PROG);
const SET_DEFAULTS={cover:true,two:true,shuf:false,filter:"all",sys:"all",search:"",id:null,
                    view:"card", cols:3, libName:true, libMn:true, libDdx:false, libFb:false,
                    pTitle:true, pMn:true, pDdx:false, pFb:false, pFull:false,
                    pTarget:"all", pSys:"all", pCols:2, libTab:"all",
                    theme:"sys"};        // sys = OS 설정을 따름. ☾/☀ 를 누르면 light|dark
let set = Object.assign({}, SET_DEFAULTS, lsObjSafe(LS_SET));
/* 게이트가 걷히기 전에 칠해야 로그인 화면이 한 번 번쩍이지 않는다.
   버튼 글자는 여기서 못 맞출 수도 있으니 bindThemeBtn 이 입장 후 다시 부른다. */
try{ if(set.theme==="dark"||set.theme==="light")
       document.documentElement.setAttribute("data-theme",set.theme); }catch(e){}
let fb = {};
try{ fb = JSON.parse(localStorage.getItem(LS_FB)||"{}") || {}; }catch(e){ fb={}; }
/* 말야마 덮어쓰기: {카드ID:{text,ts}}. 없으면 데이터의 a.mn 을 쓴다 — 원본은 절대 안 지워진다 */
let mnOv = {};
try{ mnOv = JSON.parse(localStorage.getItem(LS_MN)||"{}") || {}; }catch(e){ mnOv={}; }
let ddxOv = lsObj(LS_DDX);   // 감별진단 덮어쓰기 (말야마와 완전히 대칭)
let tagOv = lsObj(LS_TAG);   // 컬러태그
let hlOv  = lsObj(LS_HL);    // 형광펜
let progTs= lsObj(LS_PTS);   // 진도 타임스탬프
let deck=[], pos=0, flipped=false, rv=null;
let _lastView=null, libRand=null;   // libRand: 랜덤 탭의 현재 셔플 순서(카드ID 배열). null = 다시 섞어라

const ID_MIGRATE={"msk-back":"msk-neck","obgyn-breastmass":"obgyn-breastpain"};
(function(){let ch=false;
  for(const [o,n] of Object.entries(ID_MIGRATE)){
    if(prog[o]!==undefined){ if(prog[n]===undefined) prog[n]=prog[o]; delete prog[o]; ch=true; }
  }
  if(ch) lsSet(LS_PROG,JSON.stringify(prog));
})();


const $=id=>document.getElementById(id);
const save=()=>{lsSet(LS_PROG,JSON.stringify(prog)); lsSet(LS_SET,JSON.stringify(set));};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
/* 말야마 읽기는 전부 여기를 지난다 — 카드뷰 ③A · 라이브러리 · 프린트 · 검색 */
const mnBase=c=>String((c&&c.a&&c.a.mn)||"").trim();          // 데이터 원본
const mnEdited=c=>!!(c && mnOv[c.id] && mnOv[c.id].text);      // override 걸렸나
const mnOf=c=>{ const o=c&&mnOv[c.id];
  return (o&&o.text) ? String(o.text).trim() : mnBase(c); };

/* 감별진단 읽기도 전부 여기를 지난다 — 카드뷰 ⑦ · 라이브러리 · 프린트 · 검색.
   말야마(mnBase/mnOf/mnEdited/mnDisp)와 완전히 대칭이다. */
const ddxBase=c=>String(Array.isArray(c&&c.ddx)?c.ddx.join(", "):((c&&c.ddx)||"")).trim();
const ddxEdited=c=>!!(c && ddxOv[c.id] && ddxOv[c.id].text);
const ddxOf=c=>{ const o=c&&ddxOv[c.id];
  return (o&&o.text) ? String(o.text).trim() : ddxBase(c); };

/* ── 형광펜 ────────────────────────────────────────────────
   저장은 글자 인덱스가 아니라 "칠한 문자열 자체"다. 말야마를 고쳐도
   엉뚱한 글자에 칠해지지 않고, 그 문자열이 사라지면 그냥 안 칠해진다(조용히 무시). */
/* 칠할 수 있는 필드 목록 — 새 필드를 늘릴 땐 여기만 고치면 아래가 전부 따라온다.
   hl 레코드 하나(ts 1개)에 세 필드가 같이 들어간다. 시트도 열 하나로 받는다. */
const HLF=["mn","ddx","fb"];
const hlOf=(c,f)=>{ const r=c&&hlOv[c.id]; const a=r&&r[f]; return Array.isArray(a)?a:[]; };
const hlHas=(c,f)=>hlOf(c,f).length>0;
/* 원문(plain) → escape + <mark> 삽입. 사용자 입력이든 원본이든 전부 escape 한다
   (원본 감별진단에 "[급성<2 주]" 같은 리터럴 '<' 가 있어 raw 삽입은 위험하다). */
/* 어떤 칠이 실제로 화면에 살아남는지 계산한다. 겹치면 먼저·긴 쪽이 이긴다.
   hlHtml 과 hlToggle 이 같은 규칙을 봐야 해서 따로 뺐다 —
   안 그러면 "저장은 됐는데 화면엔 안 보이는" 유령 레코드가 생긴다. */
function hlKeep(text,spans){
  const t=String(text==null?"":text);
  const hits=[];
  if(!t||!spans||!spans.length) return hits;
  spans.forEach((sp,idx)=>{
    const s=String((sp&&sp.t)||""); if(!s) return;
    const cl=(sp.c==="p")?"p":"y";
    let from=0,i;
    while((i=t.indexOf(s,from))>=0){ hits.push({a:i,b:i+s.length,c:cl,i:idx}); from=i+s.length; }
  });
  if(!hits.length) return hits;
  hits.sort((x,y)=>x.a-y.a||y.b-x.b);
  const keep=[]; let end=-1;
  for(const m of hits){ if(m.a>=end){ keep.push(m); end=m.b; } }
  return keep;
}
function hlHtml(text,spans){
  const t=String(text==null?"":text);
  if(!t) return "";
  if(!spans||!spans.length) return esc(t);
  const keep=hlKeep(t,spans);
  if(!keep.length) return esc(t);
  let h="",p=0;
  for(const m of keep){
    h+=esc(t.slice(p,m.a))+`<mark class="hl${m.c}">`+esc(t.slice(m.a,m.b))+`</mark>`;
    p=m.b;
  }
  return h+esc(t.slice(p));
}
/* 표시용 최종 HTML — 카드뷰·라이브러리·프린트가 전부 이걸 쓴다 */
const mnDisp =c=>hlHtml(mnOf(c), hlOf(c,"mn"));
const ddxDisp=c=>hlHtml(ddxOf(c),hlOf(c,"ddx"));
const fbDisp =c=>hlHtml(fbText(c.id),hlOf(c,"fb"));

/* ── 컬러태그 ── */
const TAGS=[{v:"hard",e:"🔴",n:"어려움"},{v:"mid",e:"🟡",n:"애매"},
            {v:"easy",e:"🟢",n:"쉬움"},{v:"",e:"⚪",n:"미지정"}];
const tagOf=c=>{ const r=c&&tagOv[c.id]; const v=r&&r.v;
  return (v==="hard"||v==="mid"||v==="easy")?v:""; };
const tagEmoji=v=>({hard:"🔴",mid:"🟡",easy:"🟢"}[v]||"");

/* ── 피드백 메모 저장소 (localStorage 1차) ── */
const fbSaveLS=()=>{ try{ localStorage.setItem(LS_FB,JSON.stringify(fb)); }catch(e){} };
const fbText=id=>(fb[id]&&fb[id].text)||"";

/* ── 묘비(tombstone) 규칙 ────────────────────────────────────
   "지움"을 레코드 삭제로 표현하면 로컬 ts 가 0 이 되어, 시트에 남아 있는 옛 값(ts>0)이
   항상 이긴다 = 지운 게 되살아난다.
   그래서 지울 때 레코드를 없애지 않고 **빈 값 + 지운 시각**을 남긴다.
   읽기 함수들은 빈 값을 "없음"으로 취급하므로 화면 표시는 종전과 똑같다. */

/* ── 말야마 덮어쓰기 저장소 (피드백과 같은 패턴) ── */
const mnSaveLS=()=>{ try{ localStorage.setItem(LS_MN,JSON.stringify(mnOv)); }catch(e){} };
/* 비었거나 원본과 같으면 빈 override(묘비) = 원본 복귀 */
function mnSet(card,text,ts){
  const t=String(text||"").trim();
  mnOv[card.id]=(!t || t===mnBase(card)) ? {text:"",ts:ts} : {text:t,ts:ts};
  mnSaveLS();
}

/* ── 감별진단 덮어쓰기 저장소 (말야마와 완전히 같은 규칙) ── */
const ddxSaveLS=()=>{ try{ localStorage.setItem(LS_DDX,JSON.stringify(ddxOv)); }catch(e){} };
function ddxSet(card,text,ts){
  const t=String(text||"").trim();
  ddxOv[card.id]=(!t || t===ddxBase(card)) ? {text:"",ts:ts} : {text:t,ts:ts};
  ddxSaveLS();
}

/* ── 컬러태그 저장소 ── */
const tagSaveLS=()=>{ try{ localStorage.setItem(LS_TAG,JSON.stringify(tagOv)); }catch(e){} };
function tagSet(card,v,ts){
  const ok=(v==="hard"||v==="mid"||v==="easy");
  tagOv[card.id]={v: ok?v:"", ts:ts};               // 미지정도 레코드로 남긴다(묘비)

/* ── 형광펜 저장소 ── */
const hlSaveLS=()=>{ try{ localStorage.setItem(LS_HL,JSON.stringify(hlOv)); }catch(e){} };
function hlRec(id){ const r=hlOv[id]; return (r&&typeof r==="object")?r:{}; }
function hlSetField(card,f,arr,ts){
  const r=Object.assign({},hlRec(card.id));
  if(arr&&arr.length) r[f]=arr; else delete r[f];
  r.ts=ts;
  /* 세 필드가 모두 비어야 묘비다 — HLF 를 안 쓰고 mn·ddx 만 보면
     "fb 만 칠해진 레코드"가 묘비로 판정돼 방금 칠한 게 그 자리에서 지워진다 */
  if(!HLF.some(k=>r[k]&&r[k].length)) hlOv[card.id]={ts:ts};
  else hlOv[card.id]=r;
  hlSaveLS();
}
/* 시트로 보낼 hl 문자열. 전부 비면 ""(= "형광펜 전부 해제"의 정식 표현).
   비어 있지 않으면 세 키를 **항상 다 적는다** — 받는 쪽이
   "fb 키가 없음(= 구버전이 쓴 것)"과 "fb:[](= 신버전이 fb 만 해제)"를 구분해야 하기 때문이다. */
function hlPayload(rec){
  const r=(rec&&typeof rec==="object")?rec:{};
  const o={};
  HLF.forEach(k=>{ o[k]=Array.isArray(r[k])?r[k]:[]; });
  return HLF.some(k=>o[k].length) ? JSON.stringify(o) : "";
}

/* 선택한 문자열에 색을 칠하거나(같은 색이 이미 있으면) 벗긴다.
   act: "y" | "p" | "x"(지우기). 반환값은 실제로 뭔가 바뀌었는지. */
let _hlWhy="";                 // 거절 사유 — 버튼이 알맞은 안내를 띄우게
function hlToggle(card,f,sel,act){
  _hlWhy="";
  const s=String(sel||"").trim();
  if(!s) return false;
  /* 3항 분기로 두면 fb 선택이 ddx 원문과 대조돼 전부 거부된다 */
  const src=(f==="mn")?mnOf(card):(f==="ddx")?ddxOf(card):(f==="fb")?fbText(card.id):"";
  if(!src || src.indexOf(s)<0){ _hlWhy="notfound"; return false; }   // 원문에 없는 선택은 무시
  let arr=hlOf(card,f).slice();
  const same=arr.findIndex(x=>x&&x.t===s);
  let changed=false;
  if(act==="x"){
    // 선택 영역과 겹치는 칠을 전부 벗긴다(포함·피포함 둘 다)
    const n=arr.filter(x=>!(x&&(x.t===s||s.indexOf(x.t)>=0||x.t.indexOf(s)>=0)));
    changed=n.length!==arr.length; arr=n;
  }else if(same>=0 && arr[same].c===act){
    arr.splice(same,1); changed=true;               // 같은 색 재선택 = 해제
  }else if(same>=0){
    arr[same]={t:s,c:act}; changed=true;            // 색만 바꿈
  }else{
    /* 이미 칠한 곳과 겹치면 화면엔 아무 변화가 없는데 저장소·시트에만 죽은 레코드가 쌓인다
       ("형광펜 반영됨"이라 해놓고 아무 일도 안 일어나는 것처럼 보인다).
       → 실제로 살아남는지 먼저 따져보고, 안 살아남거나 남의 칠을 밀어내면 거절한다. */
    const before=hlKeep(src,arr).length;
    const next=arr.concat([{t:s,c:act}]);
    const keep=hlKeep(src,next);
    const mineKept=keep.some(m=>m.i===next.length-1);
    if(!mineKept || keep.length<=before){ _hlWhy="overlap"; return false; }
    arr=next; changed=true;
  }
  if(changed) hlSetField(card,f,arr,srvNow());
  return changed;
}

/* ── 구글시트 백업 (config.json의 "sheet"가 비면 조용히 비활성) ── */
let SHEET="";
function sess(){ try{ return JSON.parse(localStorage.getItem("cpx_session")||"null")||{}; }catch(e){ return {}; } }

/* ── 전송 상태 두 가지 ───────────────────────────────────────
   dirty   : 로컬에는 저장됐는데 아직 push 조차 안 했다 (저장 버튼을 안 누른 편집 등)
   pending : push 는 했는데 서버에 들어갔는지 확인이 안 됐다
   mode:'no-cors' 라 응답을 못 읽는다 → "보냈다"는 성공의 증거가 아니다.
   다음 sheetLoad() 에서 서버가 그 값을 갖고 있는 걸 보고 나서야 pending 을 지운다. */
const PFIELDS=["text","mn","ddx","tag","hl","prog"];
/* no-cors 로 보내므로 "보냈다"는 성공의 증거가 아니다 — 서버가 거절해도 fetch 는 resolve 한다.
   그래서 저장 직후 JSONP 로 되읽어(응답을 읽을 수 있는 유일한 경로) 실제 반영을 확인한다.
   확인되면 pend 에서 빠지고, 안 되면 한 번 더 자동으로 밀어낸 뒤 경고를 띄운다. */
const VERIFY_AFTER=2500;                    // 저장 후 이만큼 뒤 되읽어 확인
const VERIFY_RETRY=7000;                    // 확인 실패 시 재전송 후 다시 확인
const PEND_WARN=120000;                     // 전송 끝난 뒤 이만큼 + 그 뒤 되읽기 성공이 있었는데도 없으면 경고
let pend=lsObj(LS_PEND), dirty=lsObj(LS_DIRTY);
const pendSave =()=>{ try{ localStorage.setItem(LS_PEND ,JSON.stringify(pend )); }catch(e){} };
const dirtySave=()=>{ try{ localStorage.setItem(LS_DIRTY,JSON.stringify(dirty)); }catch(e){} };
/* 형광펜은 문자열로도 객체로도 오간다 — 비교용 정규화 */
function hlKey(v){
  let o=v;
  if(typeof o==="string"){ const t=o.trim();
    if(!t) o=null; else { try{ o=JSON.parse(t); }catch(e){ o=null; } } }
  const out={};
  HLF.forEach(k=>{ out[k]=(o&&Array.isArray(o[k]))?o[k]:[]; });
  return JSON.stringify(out);
}
function dirtyMark(id,f){ if(!SHEET||!id) return; dirty[id+"|"+f]=1; dirtySave(); pendPaint(); }
function dirtyClear(id,f){ const k=id+"|"+f;
  if(dirty[k]===undefined) return; delete dirty[k]; dirtySave(); }
/* push 한 필드를 pending 으로 올린다. 같은 필드가 dirty 였다면 내린다.
   반환: 이번에 만든 pend 항목들 {키: 항목} — 전송이 끝났을 때 **바로 이 세대**에만 d 를 붙이려고 쓴다.
   ⚠ 2026-09-30 (Codex 리뷰 치명): 전송이 줄을 서면서 청크가 늦게 pendMark 되는 사이 사용자가
     같은 칸을 새로 고치면, 옛 값 청크가 새 편집의 dirty 를 지우고 pend 도 옛 값으로 덮어
     새 편집이 영구 미전송될 수 있었다. → (1) 더 최신 ts 의 pend 는 옛 청크로 되돌리지 않는다
     (2) dirty 는 **로컬 현재값이 이 전송분과 같을 때만** 내린다. */
function pendMark(p){
  const marks={};
  if(!SHEET||!p||!p.cardId) return marks;
  let ch=false, byId=null;
  PFIELDS.forEach(f=>{
    if(p[f]===undefined) return;
    const v=(f==="hl")?hlKey(p[f]):String(p[f]==null?"":p[f]);
    const k=p.cardId+"|"+f, old=pend[k], t=+p.ts||srvNow();
    if(old && (+old.t||0)>t) return;                 // 이미 더 새 값이 줄에 있다
    /* ⚠ 확인 횟수(p)는 **같은 값을 다시 보내는 경우에만** 물려받는다.
       안 물려받으면 재전송할 때마다 0 으로 돌아가 영원히 재시도만 도는 무한루프가 된다.
       값이 바뀌었으면(= 새 편집) 처음부터 다시 세는 게 맞다. */
    const carry=(old && old.v===v) ? (+old.p||0) : 0;
    /* 다시 보내는 것이므로 이전의 실패 표시(f)·전송완료(d)는 지운다 */
    pend[k]=marks[k]={v:v, t:t, s:Date.now(), p:carry};
    if(dirty[k]!==undefined){
      if(!byId) byId=cardById();
      const c=byId[p.cardId], cur=c?fieldPayload(c,f):null;
      const cv=cur?((f==="hl")?hlKey(cur[f]):String(cur[f]==null?"":cur[f])):null;
      const sameTs=(f==="prog" && !(+progTs[p.cardId]))?true:((+(cur&&cur.ts)||0)===t);
      if(cur && cv===v && sameTs) dirtyClear(p.cardId,f);
    }
    ch=true;
  });
  if(ch){ pendSave(); pendPaint(); }
  return marks;
}
/* 서버가 우리 값을 갖고 있거나, 우리 것보다 더 최신 값을 갖고 있으면 확인된 것으로 본다
   (후자는 다른 기기가 그 뒤에 덮어쓴 경우다 — 어느 쪽이든 "백업 안 됨"은 아니다) */
function pendClear(id,f,srvVal,srvTs){
  const k=id+"|"+f, e=pend[k];
  if(!e) return false;
  const sv=(f==="hl")?hlKey(srvVal):String(srvVal==null?"":srvVal);
  if(sv===String(e.v==null?"":e.v) || (+srvTs||0)>=(+e.t||0)){ delete pend[k]; return true; }
  return false;
}

/* ── 저장 직후 확인 ──────────────────────────────────────────
   여러 번 저장해도 확인은 한 번으로 합친다(타이머 1개).
   1차 확인에서 남아 있는 pend 가 있으면 그것만 다시 밀어내고 2차 확인을 건다.
   2차에도 남으면 더 재시도하지 않는다 — PEND_WARN 이 지나면 헤더 경고가 뜨고,
   사용자가 그걸 눌러 수동 재시도할 수 있다(무한 재시도로 할당량을 태우지 않는다). */
let _verifyT=null;
/* 서버가 "명단에 없는 이름"이라고 답하면 세워지는 깃발.
   서면 시트로 나가는 요청을 전부 멈춘다 — 차단된 사람이 2분마다 계속 두드리면
   막은 의미가 없다(막는 이유 자체가 서버 부하다). */
let _denied=false;
/* 게이트에서 서버 판정을 기다리는 시간. 넘으면 "판정 불가"로 보고 통과시킨다.
   ⚠ 4초로 뒀다가 실배포에서 물렸다 — Apps Script 는 리다이렉트를 한 번 타서
     실측 2.6~4.2초가 걸린다(정상 응답인데도!). 짧게 잡으면 멀쩡한 사용자가
     "명단에 없는 이름" 대신 "인터넷이 필요하다" 화면을 보게 된다.
   길게 잡아도 오프라인 사용자는 안 기다린다 — 네트워크가 없으면 script 태그의
   onerror 가 즉시 떨어져 그 자리에서 null 로 끝난다. 이 시간은 "응답이 오긴 오는데
   서버가 느린" 경우에만 쓰인다. */
const AUTH_WAIT=25000;
/* 12000 도 부족했다. 2026-08-21 라이브 실측:
     웜(연속 요청)           1.8~3.1초 · 중앙값 2.6초   ← README 의 "2.6~4.2초" 는 이 상태만 잰 값
     콜드(유휴 뒤 첫 요청)   13.3 / 16.0 / 21.4초        ← Apps Script 컨테이너 기동
   아침에 처음 앱을 여는 순간이 바로 콜드다. 12초로는 정상 서버인데도 타임아웃이 나서
   키를 못 받고 "학습 내용을 불러오지 못했어요" 화면을 보게 된다.
   길게 잡아도 오프라인 사용자는 안 기다린다 — script 태그의 onerror 가 즉시 떨어진다. */
function scheduleVerify(delay){
  if(!SHEET) return;
  if(_verifyT) return;                       // 이미 예약돼 있으면 합류
  _verifyT=setTimeout(()=>{
    _verifyT=null;
    /* 판정 대상은 **확인 요청을 쏘는 이 순간 이미 보내진 것**뿐이다.
       그 뒤에 생긴 저장은 이 응답에 들어 있을 리가 없는데, 예전엔 그것까지 같이 세어
       멀쩡한 저장을 실패로 찍었다(전역 _verifyPass 하나로 전체를 판정했다). */
    /* 전송이 끝난 것(d)만 판정한다. 아직 줄 서 있거나 가는 중인 건 이 조회에 있을 리 없다 —
       그걸 세면 멀쩡한 저장이 재전송·경고로 이어진다(2026-09-30 수정). */
    const t0=Date.now();
    const snap=Object.keys(pend).filter(k=>pend[k].d && pend[k].d<=t0);
    if(!snap.length){ pendPaint(); return; }
    /* ⚠ 예전엔 요청을 쏜 뒤 **1500ms 고정 대기** 후에 셌다. 그런데 실제 서버 응답은
       실측 2.6~4.2초다(Apps Script 가 리다이렉트를 한 번 탄다 — AUTH_WAIT 을 4초→12초로
       올린 것과 똑같은 이유다). 즉 **정상적으로 저장된 것도** 응답이 오기 전에 판정당해
       "안 들어갔다"가 되고, 재전송 → 또 조기 판정 → 빨간 경고로 이어졌다.
       게다가 그 재전송이 서버 락 경쟁을 키워 진짜 실패를 만들어냈다(악순환).
       → 이제 타이머가 아니라 **응답이 실제로 도착한 뒤** 센다. */
    sheetLoad(true,ok=>{
      /* 응답을 못 받았으면(오프라인·타임아웃·차단) **판정하지 않는다.**
         여기서 실패로 찍으면 지하철에서 앱을 켠 사람에게 빨간 경고가 뜬다.
         네트워크가 돌아오면 2분 주기나 탭 복귀가 다시 확인해준다. */
      if(!ok){ pendPaint(); return; }
      /* 그 사이 확인돼 빠진 건 제외. 그 사이 다시 편집·재전송돼 새로 pend 된 것(d 가 없거나 t0 뒤)도 제외 */
      const left=snap.filter(k=>pend[k] && pend[k].d && pend[k].d<=t0);
      if(!left.length){ pendPaint(); return; }
      const again=[];
      left.forEach(k=>{
        const n=(+pend[k].p||0)+1;
        pend[k].p=n;
        /* 두 번 보내고 두 번 되읽었는데도 없다 = 실패가 확정된 것이다.
           PEND_WARN 을 기다리지 말고 바로 알린다 — 모르고 지나가는 게 제일 위험하다. */
        if(n>=2) pend[k].f=true; else again.push(k);
      });
      pendSave(); pendPaint();
      /* 아직 기회가 남은 것만 다시 보낸다. 다음 확인은 sendBulk 가 알아서 건다
         (전량 재전송은 하지 않는다 — 그게 락 경쟁을 키우던 원인이다). */
      if(again.length) retryPending(again);
    });
  }, delay||VERIFY_AFTER);
}

function queueAdd(p){
  try{ const q=JSON.parse(localStorage.getItem(LS_FBQ)||"[]");
       q.push(p); localStorage.setItem(LS_FBQ,JSON.stringify(q.slice(-300))); }catch(e){}
}
/* 모든 push 는 여기를 지난다. ts 는 여기서 반드시 채워진다 —
   큐에 들어갈 때 이미 찍혀 있어야 며칠 뒤 재전송돼도 원래 시각이 유지된다. */
/* ── 2026-09-30 저장 튕김 수정 ─────────────────────────────────────
   서버 실행기록(9/28~30, 600건) 실측: doPost 95건 중 94건 정상 완료, 1건만 6분 타임아웃.
   즉 서버가 받은 저장은 거의 다 들어갔다. 경고는 클라이언트 쪽에서 났다.
   ① 한 기기에서 POST 가 동시에 여러 발 나갔다 — 부팅/탭복귀 때 queueFlush·flushDirty·
      retryPending 이 각자 따로 쏘고, 큐는 forEach 로 한꺼번에 쐈다(9/29 15:27:25 같은 초에 11건).
      → 이 기기의 모든 POST 를 줄 하나(_postChain)로 세운다. 한 번에 하나만 나간다.
   ② fetch 가 끊기면(아이패드에서 앱 전환·리다이렉트 두 번째 구간 끊김) 서버엔 들어갔어도
      "저장 실패"로 찍었다. → 끊김은 실패가 아니라 "모름"이다. 재큐하지 않고 되읽기 확인에 맡긴다
      (없으면 확인 사이클이 1회 재전송, 같은 ts 라 멱등).
   ③ 확인은 "전송이 끝난 것"(pend.d)만 센다. 아직 가는 중인 걸 조회해 놓고 없다며
      재전송·경고하던 헛판정을 없앤다. */
const POST_TIMEOUT=60000;                    // 콜드 13~21초 + 처리 여유. 넘으면 끊고 다시 보낸다(멱등)
var _postChain=Promise.resolve(), _postBusy=0;   // var: pendPaint 가 먼저 불려도 TDZ 없이
function payloadKeys(p){
  const out=[];
  (p&&Array.isArray(p.bulk)?p.bulk:[p]).forEach(it=>{
    if(!it||!it.cardId) return;
    PFIELDS.forEach(f=>{ if(it[f]!==undefined) out.push(it.cardId+"|"+f); });
  });
  return out;
}
/* 전송이 끝났다(응답 도착 또는 끊김) — 확인 대상에 넣는다. pendMark 가 만든 **그 세대**에만 d 를 붙인다.
   (같은 키의 더 새 값이 뒤에 줄 서 있으면 그건 아직 안 보낸 것이다 — Codex 리뷰 중간 1) */
function pendSent(marks){
  let ch=false;
  Object.keys(marks||{}).forEach(k=>{ const e=pend[k], m=marks[k];
    if(e && e.s===m.s && e.t===m.t && e.v===m.v && !e.d){ e.d=Date.now(); ch=true; } });
  if(ch) pendSave();
}
function sheetPush(p,requeue,noVerify){
  if(!SHEET) return Promise.resolve(false);          // 미설정 → 아무것도 안 함
  if(p && p.cardId && p.ts===undefined) p.ts=srvNow();
  const marks={};
  (p && Array.isArray(p.bulk) ? p.bulk : [p]).forEach(it=>Object.assign(marks,pendMark(it)));
  const body=JSON.stringify(p);
  _postBusy++; pendPaint();
  const run=()=>{
    let ac=null, tm=null;
    try{ ac=new AbortController(); tm=setTimeout(()=>{ try{ ac.abort(); }catch(e){} },POST_TIMEOUT); }catch(e){ ac=null; }
    let f;
    try{
      f=fetch(SHEET,{method:"POST",mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},   // preflight 회피
        body:body, signal:ac?ac.signal:undefined});
    }catch(e){ f=Promise.reject(e); }
    return f.then(()=>{ clearTimeout(tm); pendSent(marks);
                        if(!noVerify) scheduleVerify(); return true; })   // 보낸 것으로 끝내지 않고 되읽어 확인한다
            /* 끊김 = "모름". 곧바로 다시 보내지 않는다 — 끊김이 계속되는 기기에선 무한 재전송이 된다
               (가짜 서버 실측: 8초마다 재전송 반복). 보낸 것으로 치고 되읽기로 판정한다:
               서버에 있으면 확인 완료, 없으면 scheduleVerify 가 retryPending 으로 1회 재전송 → 그래도 없으면 f. */
            .catch(()=>{ clearTimeout(tm); pendSent(marks); scheduleVerify(); return false; });
  };
  const r=_postChain.then(run,run);
  _postChain=r.then(()=>{},()=>{});
  return r.finally(()=>{ _postBusy--; pendPaint(); });
}
/* 옛 재시도 큐(구버전이 쌓아 둔 것) — 봉투를 그대로 동시에 쏘지 않고 키로 풀어 dirty 로 합친다.
   값은 로컬 현재값으로 다시 만든다(큐의 옛 값보다 로컬이 같거나 최신이다). */
function queueFlush(){
  if(!SHEET) return;
  let q=[]; try{ q=JSON.parse(localStorage.getItem(LS_FBQ)||"[]"); }catch(e){ q=[]; }
  if(!q.length) return;
  q.forEach(p=>payloadKeys(p).forEach(k=>{ dirty[k]=1; }));
  dirtySave();
  lsSet(LS_FBQ,"[]");
  flushDirty();
}

/* ── 일괄 전송 ───────────────────────────────────────────────
   (카드,필드) 한 건짜리 payload 를 만든다. 필드마다 제 ts 를 달고 나가므로
   한 카드의 여러 필드를 같이 보내도 서로의 시각을 오염시키지 않는다.
   로컬에 레코드 자체가 없으면(=한 번도 손댄 적 없음) null — 보내지 않는다. */
function fieldPayload(card,f){
  const id=card.id, base={cardId:id, cardName:card.name||""};
  const r=({text:fb,mn:mnOv,ddx:ddxOv,tag:tagOv,hl:hlOv})[f];
  const rec=r?r[id]:null;
  if(f==="prog"){
    const t=+progTs[id]||0;
    if(!t && prog[id]===undefined) return null;
    return Object.assign(base,{prog:prog[id]||"", ts:t||srvNow()});
  }
  if(!rec || typeof rec!=="object") return null;
  const ts=+rec.ts||0;
  if(f==="text") return Object.assign(base,{text:String(rec.text||""), ts:ts});
  if(f==="mn")   return Object.assign(base,{mn:  String(rec.text||""), ts:ts});
  if(f==="ddx")  return Object.assign(base,{ddx: String(rec.text||""), ts:ts});
  if(f==="tag")  return Object.assign(base,{tag: String(rec.v||""),    ts:ts});
  if(f==="hl") return Object.assign(base,{hl:hlPayload(rec), ts:ts});
  return null;
}
/* ⚠ 청크를 **줄이면** 안 된다. 순차 전송으로 바꾼 뒤로는 자기 자신과의 락 경쟁이 없어졌고,
   대신 **요청당 고정비용이 지배한다** — Apps Script 는 리다이렉트를 한 번 타서
   항목이 1건이든 100건이든 2.6~4.2초가 먼저 깔린다(실측).
   그래서 청크를 40 으로 줄이면 8회 × 3.5초 = 28초가 순수 대기로 날아간다.
   크게 묶어 요청 수를 줄이는 쪽이 빠르다. 다만 한 요청이 통째로 실패했을 때
   잃는 범위도 그만큼 커지므로, 전부를 한 방에 보내지는 않는다(318건 → 3회). */
const BULK_CHUNK=110;
/* beacon=true 면 언로드 중에도 살아남는 sendBeacon 으로 보낸다(fetch 는 취소된다) */
function sendBulk(items,beacon){
  if(!SHEET || !items || !items.length) return Promise.resolve(false);   // 빈 요청 금지
  const s=sess(), chunks=[];
  if(beacon){
    /* ⚠ 언로드 중에는 순차 전송을 할 수 없다 — 브라우저가 await 를 기다려주지 않는다.
       그래서 **요청 수 자체를 최소로** 만든다: 항목 수가 아니라 바이트로 잘라
       sendBeacon 한도(64KB) 안에서 가능한 한 크게 묶는다.
       탭을 닫을 때 비콘 3발이 동시에 나가 셋 다 락에서 버려지고, 재접속해도
       아무도 재전송하지 않아 **265건이 영구히 고착되던** 경로가 여기다(실측 재현).
       BULK_CHUNK(40)를 그대로 쓰면 비콘이 7발이 되어 오히려 더 나빠진다. */
    const LIM=45000;                       // 64KB 한도에 봉투·인코딩 여유를 뺀 값
    let cur=[], size=0;
    items.forEach(it=>{
      const n=JSON.stringify(it).length+1;
      if(cur.length && size+n>LIM){ chunks.push(cur); cur=[]; size=0; }
      cur.push(it); size+=n;
    });
    if(cur.length) chunks.push(cur);
  }else{
    for(let i=0;i<items.length;i+=BULK_CHUNK) chunks.push(items.slice(i,i+BULK_CHUNK));
  }
  if(beacon && navigator.sendBeacon){
    let ok=true;
    chunks.forEach(c=>{
      const body=new Blob([JSON.stringify({name:s.name||"",code:s.code||"",bulk:c})],
                          {type:"text/plain;charset=utf-8"});
      let r=false; try{ r=navigator.sendBeacon(SHEET,body); }catch(e){ r=false; }
      if(!r) ok=false;
      const bm={}; c.forEach(it=>Object.assign(bm,pendMark(it)));   // 언로드 중이라도 상태는 남긴다
      /* 비콘은 응답이 없다 — 브라우저가 받아 줬으면 넘긴 순간을 전송 끝으로 보고 되읽기로 판정.
         안 받아 줬으면(false) 확실한 미전송이다 → dirty 로 되돌려 복귀·주기·온라인 때 다시 나가게 한다
         (안 그러면 d 도 dirty 도 없는 pend 로 남아 새로고침 전까지 영구 대기 — Codex 리뷰 높음 2) */
      if(r) pendSent(bm);
      else { Object.keys(bm).forEach(k=>{ dirty[k]=1; }); dirtySave(); }
    });
    return Promise.resolve(ok);
  }
  /* ⚠ 청크를 동시에 쏘면 안 된다. 서버(Apps Script)의 doPost 는 전체가 하나의 ScriptLock 으로
     직렬화되고, waitLock(10000) 을 넘기면 예외로 끝나 **그 청크의 항목 전부가 버려진다.**
     그런데 우리는 no-cors 로 보내므로 그 실패를 읽지 못한다 — 성공으로 착각하고 pend 에 남는다.
     4청크를 동시에 던지면 뒤의 둘은 자기가 만든 락 경쟁 때문에 거의 확실히 못 들어간다.
     → 한 번에 하나씩 보낸다. 느려 보여도 이쪽이 실제로는 더 빨리 끝난다(재전송이 없으므로). */
  let ok=true;
  return chunks.reduce((chain,c)=>chain.then(()=>
      /* noVerify=true : 청크마다 확인을 걸면 마지막 청크가 나가기도 전에 확인이 돈다.
         확인은 전부 나간 뒤 아래에서 한 번만 건다. */
      sheetPush({name:s.name||"",code:s.code||"",bulk:c},true,true)
        .then(r=>{ if(!r) ok=false; })
    ), Promise.resolve())
    .then(()=>{ scheduleVerify(); return ok; });
}
/* 추가 메모 = 카드마다 붙는 가상 카드 "<id>__m2" 의 text 필드(2026-09-30).
   서버·시트 스키마를 건드리지 않으려고 진도표(__jindo)와 같은 방식으로 얹었다. 시트엔 행이 하나 더 생긴다. */
const M2="__m2";
const m2Card=c=>({id:c.id+M2, name:(c.name||"")+" · 추가 메모"});
function cardById(){ const m={}; CARDS.forEach(c=>{ m[c.id]=c; const v=m2Card(c); m[v.id]=v; }); m[JD_ID]=JD_CARD; return m; }
function keysToItems(keys){
  const by=cardById(), items=[];
  keys.forEach(k=>{
    const i=k.lastIndexOf("|"); if(i<0) return;
    const c=by[k.slice(0,i)], f=k.slice(i+1);
    if(!c || PFIELDS.indexOf(f)<0) return;
    if(c.id===JD_ID && jdHeld()) return;          // 받기 전 진도표는 안 보낸다(flushDirty 가 dirty 에 남긴다)
    const p=fieldPayload(c,f); if(p) items.push(p);
  });
  return items;
}
/* 아직 push 안 한 것들을 전부 밀어낸다. 2분 주기·탭 이탈·탭 복귀·페이지 종료에서 부른다.
   dirty 가 없으면 요청을 아예 안 보낸다(그게 곧 스로틀이다).
   입력 중이어도 상관없다 — 내 것을 올리는 방향이라 입력을 방해하지 않는다. */
function flushDirty(beacon){
  if(!SHEET || _loggingOut || _denied) return Promise.resolve(false);
  /* ⚠ _loggingOut 검사가 여기에도 있어야 한다. pushOut 만 막으면
     pushSoon(평가·태그 모아보내기) 타이머가 로그아웃 직후에 터져
     **앞사람 데이터를 다음 사람 이름으로** 밀어낼 수 있다. */
  const keys=Object.keys(dirty);
  if(!keys.length) return Promise.resolve(false);
  /* 진도표는 표 전체가 한 필드라, 서버 것을 받아 합치기 전에 올리면 빈 표/낡은 표가
     서버의 최신 표를 통째로 덮는다. 받기 전까진 dirty 에 남겨 두고 나머지만 보낸다. */
  const hold=jdHeld()?keys.filter(k=>k.indexOf(JD_ID+"|")===0):[];
  const items=keysToItems(hold.length?keys.filter(k=>hold.indexOf(k)<0):keys);
  dirty={}; hold.forEach(k=>{ dirty[k]=1; }); dirtySave();
  if(!items.length){ pendPaint(); return Promise.resolve(false); }
  return sendBulk(items,beacon);
}
/* 확인 안 된 pending 을 로컬 현재값으로 다시 보낸다(헤더 경고 클릭).
   keys 를 주면 그것만 — 확인 사이클은 아직 기회가 남은 것만 골라 보낸다.
   안 그러면 이미 실패 확정된 것까지 매번 같이 나가 서버 락 경쟁을 키운다. */
function retryPending(keys){
  const items=keysToItems(keys||Object.keys(pend));
  if(items.length) sendBulk(items,false);
}
/* 전체 저장 — 로컬에 있는 모든 카드 데이터를 필드 단위로 모아 bulk 한 방으로 올린다.
   공부를 마칠 때 누르는 마무리 버튼이라 성공/실패가 분명해야 한다.
   실패하면 dirty 를 되살려 둔다(다음 자동 밀어내기 때 다시 나가도록). */
function bulkBackup(){
  if(!SHEET) return Promise.resolve({cards:0,items:0,ok:false});
  fbFlush(); mnFlush(); ddxFlush();               // 입력 중이던 것부터 확정
  const items=[], seen={};
  CARDS.forEach(c=>PFIELDS.forEach(f=>{
    const p=fieldPayload(c,f);
    if(p){ items.push(p); seen[c.id]=1; }
  }));
  CARDS.forEach(c=>{ const p=fieldPayload(m2Card(c),"text"); if(p){ items.push(p); seen[c.id]=1; } });
  /* 진도표는 카드가 아니다 — 카드 수엔 안 세고, 받기 전이면 보내지 않고 dirty 로 남긴다 */
  const jp=fieldPayload(JD_CARD,"text");
  if(jp){ if(jdHeld()){ dirty[JD_ID+"|text"]=1; dirtySave(); } else items.push(jp); }
  const cards=Object.keys(seen).length;
  if(!items.length) return Promise.resolve({cards:0,items:0,ok:true});
  /* 끊긴 청크도 pend 에 남아 되읽기 확인이 판정·재전송한다(sheetPush). 여기서 전량을 다시
     dirty 로 찍으면 이미 들어간 청크까지 또 나간다 → 하지 않는다(2026-09-30). */
  return sendBulk(items,false).then(ok=>({cards:cards, items:items.length, ok:ok,
                                          keys:payloadKeys({bulk:items})}));
}
/* 헤더 "전체 저장" 버튼 — 어느 뷰에서든 누를 수 있다 */
function bindBulkBtn(){
  const b=document.getElementById("bkSave");
  if(!b) return;
  if(!SHEET){ b.style.display="none"; return; }   // 시트 미설정이면 아예 안 보인다
  b.style.display="";
  let busy=false;
  b.onclick=()=>{
    if(busy) return;
    busy=true; b.classList.add("on"); b.textContent="저장 중…";
    const done=(t,keepOn)=>{
      b.textContent=t; b.classList.toggle("on",!!keepOn); busy=false;
      setTimeout(()=>{ if(!busy) b.textContent="전체 저장"; },4000);
    };
    bulkBackup().then(r=>{
      if(!r.items) return done("저장할 내용 없음");
      /* ⚠ 결과는 fetch 성패가 아니라 **서버 되읽기 확인**으로 정한다(2026-09-30).
         no-cors 라 fetch 성공 ≠ 저장, fetch 끊김 ≠ 실패(서버엔 들어갔는데 리다이렉트
         두 번째 구간만 끊긴 경우가 있다). 보낸 키가 pend 에서 전부 빠지면 확인 완료. */
      b.textContent="확인 중…";
      const t0=Date.now();
      const tick=()=>{
        /* 이 버튼이 보낸 것만 본다. 누른 뒤 새로 고친 칸(dirty)은 자기 경로로 따로 나간다 */
        const left=r.keys.filter(k=>pend[k]);
        if(!left.length) return done("✓ "+r.cards+"장 저장 확인");
        if(left.some(k=>pend[k]&&pend[k].f)) return done("일부 미확인 — 헤더를 눌러 재시도");
        if(Date.now()-t0>120000) return done("확인 지연 · 자동 재시도 중");
        setTimeout(tick,1000);
      };
      setTimeout(tick,1000);
    }).catch(()=>done("확인 지연 · 자동 재시도 중"));
  };
}

/* 저장 버튼 옆 문구. 보낸 것과 서버에 들어간 것은 다르다 — 확인 전에는 "전송"이라 쓰지 않는다.
   실제 반영 확인은 헤더의 백업 상태(bkStat)가 책임진다. */
const sheetNote=()=>SHEET?" · 시트 전송 대기":"";

/* ── 백업 상태 표시 (헤더) ── */
function pendPaint(){
  const el=document.getElementById("bkStat"); if(!el) return;
  /* 로컬 저장 실패는 시트 백업 지연보다 심각하다 — 이 자리를 먼저 가져간다 */
  if(lsFail){ el.className="bkstat bad"; el.textContent="⚠ 이 기기에 저장 안 됨";
              el.title="프라이빗 브라우징이거나 저장 공간이 찼습니다. 진도가 이 기기에 남지 않아요.";
              return; }
  if(!SHEET){ el.className="bkstat"; el.textContent=""; el.title=""; return; }
  if(_denied){ el.className="bkstat bad"; el.textContent="⚠ 동기화 중지됨";
               el.title="참여 명단에 없는 이름입니다. 관리자에게 문의하세요.";
               return; }
  const now=Date.now();
  /* f = 확인이 실패로 끝난 것(즉시 경고). s 는 보낸 시각 — 확인이 아예 안 돌아온 경우의 안전망. */
  /* 빨간 경고는 **실제로 없다고 확인된 것**만. 보낸 지 오래됐다는 이유만으로는 띄우지 않는다 —
     아이패드에서 앱을 오가면 확인이 멈춰 있다가 돌아오는 순간 전부 "30초 초과"가 되어
     멀쩡한 저장에 경고가 떴다(2026-09-30). 안전망: 전송이 끝났고(d), 그 뒤 15초 넘어서
     되읽기에 성공한 적이 있는데도 2분째 확인이 안 되면 경고. */
  const lastOk=+localStorage.getItem(LS_OK)||0;
  const late=Object.keys(pend).filter(k=>{ const e=pend[k];
    return e.f || (e.d && lastOk>e.d+15000 && now-e.d>PEND_WARN); }).length;
  if(late){
    el.className="bkstat bad";
    el.textContent="⚠ 시트 백업 안 됨 ("+late+"건)";
    el.title="눌러서 다시 시도합니다";

  const wait=Object.keys(pend).length+Object.keys(dirty).length;
  const t=+localStorage.getItem(LS_OK)||0;

  el.textContent=(t?("백업 확인 "+new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}))
                   :"백업 확인 전")+(_postBusy?" · 전송 중":(wait?(" · 대기 "+wait):""));
}
/* ── 시트 자동 갱신 ──
   다른 기기(아이패드↔노트북)의 변경을 가져오기 위해 (a) 탭 복귀 (b) 2분 주기로 다시 읽는다.
   SHEET 가 비면(오프라인판) 타이머도 리스너도 아예 안 건다 = 네트워크 요청 0건. */
const SHEET_MIN=10000, SHEET_EVERY=120000;
let _sheetLast=0, _sheetTimer=null, _needRender=false;
/* 지금 편집 중인 칸 — 갱신이 이 칸을 덮어쓰거나 화면을 다시 그리면 입력이 날아간다 */
function editingNow(){

/* 편집이 끝나면 미뤄둔 다시그리기를 실행한다 */

/* 아직 안 보낸 편집을 확정하고 밀어낸다. 언로드 직전이면 sendBeacon 으로. */
function pushOut(beacon){
  /* 로그아웃이 부른 reload 의 pagehide 에서도 이게 돈다 —
     막지 않으면 앞사람 데이터를 다음 사람 이름으로 밀어낼 수 있다 */
  if(_loggingOut || _denied) return Promise.resolve(false);
  fbFlush(); mnFlush(); ddxFlush();      // 디바운스 대기중이던 입력부터 로컬 확정

/* ── 명단에서 빠졌을 때 ────────────────────────────────────────────────
   세션만 끊어 게이트로 돌려보낸다. **학습 데이터는 한 글자도 지우지 않는다.**
   지우는 순간, 서버가 한 번만 잘못 답해도 그 사람 공부 기록이 영구히 날아간다 —
   되돌릴 방법이 없다. 반면 안 지우면 명단에 다시 넣는 것만으로 그대로 살아난다.
   차단은 되돌릴 수 있어야 하는 조치다. */
function denyKick(){
  if(_denied) return;
  _denied=true;
  /* 디바운스(400ms) 대기중이던 입력부터 로컬에 확정한다 —
     쫓겨나면서 방금 친 글자를 잃지 않게. 시트로는 안 나간다(어차피 거부당한다). */
  try{ fbFlush(); mnFlush(); ddxFlush(); }catch(e){}
  clearTimeout(_verifyT); _verifyT=null;
  clearInterval(_sheetTimer); _sheetTimer=null;
  try{ localStorage.removeItem(GATE_KEY); }catch(e){}   // 세션만 끊는다
  /* 콘텐츠 키 캐시도 지운다 — 이걸 남기면 차단당한 사람이 오프라인으로 계속 본다.
     ⚠ 이건 콘텐츠 키일 뿐 학습 데이터가 아니다. 공부 기록은 그대로 남는다. */
  try{ localStorage.removeItem(LS_CKEY); }catch(e){}
  _contentOpen=false;
  const gate=document.getElementById("gate"), body=document.getElementById("gateBody");
  if(gate&&body){
    body.innerHTML='<p><b>참여 명단에 없는 이름이에요.</b></p>'
                  +'<div class="err">관리자에게 문의하세요.</div>'
                  +'<p style="font-size:12px;opacity:.75;margin-top:14px">'
                  +'이 기기에 저장된 공부 기록은 지워지지 않았습니다.<br>'
                  +'다시 명단에 등록되면 그대로 이어서 쓸 수 있어요.</p>';
    gate.classList.remove("hidden");
  }
}

/* ── 콘텐츠 잠금 ──────────────────────────────────────────────────────
   배포본은 ASK·CARDS 가 AES-GCM 으로 암호화돼 있고(window.__CPXENC),
   키는 명단을 통과한 사람에게만 서버가 준다. 무단 사용자는 파일을 통째로 받아도
   게이트를 뚫어도 카드가 빈 껍데기다.

   ⚠ 키는 받는 즉시 localStorage 에 캐시한다 — **오프라인에서 앱이 안 열리면 안 된다.**
     한 번이라도 들어와 본 기기는 그 뒤로 인터넷 없이도 열린다.
     차단(denyKick)될 때만 이 캐시를 지운다 → 그래야 차단이 실효를 갖는다.
   ⚠ 평문 빌드(개발용 index.html)에는 __CPXENC 가 없다 → 아무 일도 안 하고 통과한다. */
const LS_CKEY="cpx_ckey";
let _contentOpen=false;
function ckeyGet(){ try{ return localStorage.getItem(LS_CKEY)||""; }catch(e){ return ""; } }
async function contentUnlock(key){
  if(!key || !window.__CPXENC) return false;
  try{
    const b=atob(window.__CPXENC), raw=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++) raw[i]=b.charCodeAt(i);
    const kb0=atob(key), kb=new Uint8Array(kb0.length);
    for(let i=0;i<kb0.length;i++) kb[i]=kb0.charCodeAt(i);
    const ck=await crypto.subtle.importKey("raw",kb,{name:"AES-GCM"},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},ck,raw.slice(12));
    const o=JSON.parse(new TextDecoder().decode(pt));
    if(!o || !Array.isArray(o.CARDS) || !o.CARDS.length) return false;
    ASK=o.ASK; CARDS=o.CARDS; BOKC=o.BOKC||{};
    return true;
  }catch(e){ return false; }
}
/* 캐시된 키 → 서버가 방금 준 키 순으로 시도한다.
   true = 열렸다(또는 평문 빌드라 열 것이 없다) / false = 못 열었다(인터넷 필요) */
async function ensureContent(srvKey){
  if(!window.__CPXENC) return true;            // 평문 빌드
  if(_contentOpen) return true;
  const tries=[]; const c=ckeyGet();
  if(c) tries.push(c);                          // 캐시 먼저 — 네트워크를 안 기다린다
  if(srvKey && tries.indexOf(srvKey)<0) tries.push(srvKey);
  for(let i=0;i<tries.length;i++){
    if(await contentUnlock(tries[i])){
      _contentOpen=true; lsSet(LS_CKEY,tries[i]); return true;
    }
  }
  return false;
}
/* 키를 못 구했을 때의 안내. 게이트 자리에 띄운다 — 여기서 끝나지 않게 다시 시도 버튼을 준다. */
function showNeedNet(retry){
  const gate=document.getElementById("gate"), body=document.getElementById("gateBody");
  if(!gate||!body) return;

                +'한 번 열고 나면 다음부터는 오프라인에서도 열려요.</p>'
                +'<button id="gRetry">다시 시도</button>';
  gate.classList.remove("hidden");
  const b=document.getElementById("gRetry");
