<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CPX 플래시카드</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f242e; --line:#2a3140;
    --txt:#e6e9ef; --dim:#8b94a7; --accent:#4f8cff;
    --know:#2fbf71; --dont:#ef5350; --unrated:#5a6273;
    --chip:#222836;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;}
  header{padding:10px 12px 8px; border-bottom:1px solid var(--line); background:var(--panel);}
  .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .title{font-weight:700; font-size:16px; margin-right:auto;}
  .toggle{font-size:12px; padding:6px 10px; border-radius:999px; background:var(--chip);
    border:1px solid var(--line); color:var(--dim); cursor:pointer; user-select:none; white-space:nowrap;}
  .toggle.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .search{flex:1; min-width:120px; background:var(--panel2); border:1px solid var(--line);
    color:var(--txt); border-radius:8px; padding:7px 10px; font-size:13px; outline:none;}
  /* progress bar */
  .pbar{display:flex; height:8px; border-radius:6px; overflow:hidden; margin:8px 0 4px; background:var(--panel2);}
  .pbar > div{height:100%;}
  .pstats{font-size:11px; color:var(--dim); display:flex; gap:12px;}
  .pstats b{font-weight:700;}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle;}
  /* chips */
  .chips{display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; -webkit-overflow-scrolling:touch;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{font-size:12px; padding:5px 11px; border-radius:999px; background:var(--chip);
    border:1px solid var(--line); color:var(--dim); cursor:pointer; white-space:nowrap;}
  .chip.on{color:#fff; border-color:var(--accent); background:var(--accent);}
  /* main */
  main{flex:1; overflow-y:auto; padding:14px 12px 6px; -webkit-overflow-scrolling:touch;}
  .meta{font-size:12px; color:var(--dim); display:flex; justify-content:space-between; margin-bottom:10px;}
  .badge{padding:2px 8px; border-radius:6px; background:var(--panel2);}
  .badge.know{color:var(--know);} .badge.dont{color:var(--dont);}
  /* front */
  .front{display:flex; align-items:center; justify-content:center; min-height:46vh;
    background:var(--panel); border:1px solid var(--line); border-radius:18px; cursor:pointer; padding:24px; text-align:center;}
  .front .sym{font-size:34px; font-weight:800; letter-spacing:1px;}
  .front .hint{position:absolute; bottom:16px; font-size:12px; color:var(--dim);}
  .frontwrap{position:relative; display:flex; justify-content:center;}
  /* back */
  .field{background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden;}
  .field h4{margin:0; padding:10px 14px; font-size:12px; color:var(--dim); letter-spacing:.5px;
    display:flex; justify-content:space-between; align-items:center;}
  .field .body{padding:0 14px 12px; font-size:15px; line-height:1.55;}
  .field.hidden .body{display:none;}
  .field.hidden h4 .lock{color:var(--accent);}
  .field .lock{font-size:11px; color:var(--dim);}
  .field.tap{cursor:pointer;}
  .ddx-list{display:flex; flex-wrap:wrap; gap:6px;}
  .ddx-list span{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:4px 9px; font-size:13px;}
  .mn{font-size:20px; font-weight:800; color:#ffd166; letter-spacing:1px;}
  .aitems{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .aitems span{background:#23314a; border:1px solid #34507e; color:#cfe0ff; border-radius:8px; padding:4px 9px; font-size:13px;}
  .asks{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px;}
  .ask{font-size:13px; line-height:1.5; margin:6px 0; display:flex; gap:8px;}
  .ask b{color:#9ad0ff; flex:0 0 auto; min-width:70px;}
  .ask i{color:var(--txt); font-style:normal;}
  .astep{font-size:11px; color:var(--accent); margin-left:8px;}
  .warn{color:#ffb74d;}
  .empty{text-align:center; color:var(--dim); padding:40px 10px;}
  /* footer */
  footer{border-top:1px solid var(--line); background:var(--panel); padding:10px 12px;
    display:flex; flex-direction:column; gap:8px;}
  .rate{display:flex; gap:8px;}
  .rate button{flex:1; padding:11px; border-radius:12px; border:1px solid var(--line); font-size:14px; font-weight:700; cursor:pointer; background:var(--panel2); color:var(--txt);}
  .rate button.know{border-color:var(--know);} .rate button.know.act{background:var(--know); color:#062a16;}
  .rate button.dont{border-color:var(--dont);} .rate button.dont.act{background:var(--dont); color:#3a0606;}
  .nav{display:flex; align-items:center; gap:8px;}
  .nav button{padding:11px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); color:var(--txt); font-size:15px; cursor:pointer; min-width:84px;}
  .nav .pos{flex:1; text-align:center; font-size:13px; color:var(--dim);}
  button:active{transform:scale(.97);}

  /* ── 입장 게이트 ── */
  #gate{position:fixed; inset:0; z-index:1000; background:var(--bg); display:flex;
    flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; gap:14px;}
  #gate h1{font-size:22px; margin:0 0 4px;}
  #gate p{color:var(--dim); font-size:14px; margin:0; max-width:300px; line-height:1.6;}
  #gate input{width:240px; max-width:80vw; background:var(--panel2); border:1px solid var(--line);
    color:var(--txt); border-radius:10px; padding:12px; font-size:16px; outline:none; text-align:center;}
  #gate button{width:240px; max-width:80vw; background:var(--accent); color:#fff; border:none;
    border-radius:10px; padding:13px; font-size:16px; font-weight:700; cursor:pointer;}
  #gate .err{color:var(--dont); font-size:13px; min-height:16px;}
  #gate.hidden{display:none;}
  .gwho{position:fixed; top:7px; right:10px; z-index:5; font-size:11px; color:var(--dim);}
</style>
</head>
<body>

<div id="gate">
  <h1>CPX 플래시카드</h1>
  <div id="gateBody">
    <p>이름과 스터디 참여코드를 입력하세요</p>
    <input id="gName" placeholder="이름" autocomplete="off">
    <input id="gCode" placeholder="참여코드" autocomplete="off">
    <button id="gEnter">입장</button>
    <div class="err" id="gErr"></div>
  </div>
</div>

<header>
  <div class="row">
    <span class="title">CPX 플래시카드</span>
    <span class="toggle" id="tCover">가림</span>
    <span class="toggle" id="tTwo">A 2단검증</span>
    <span class="toggle" id="tShuf">섞기</span>
  </div>
  <div class="pbar" id="pbar"></div>
  <div class="pstats" id="pstats"></div>
  <div class="row" style="margin-top:6px;">
    <input class="search" id="search" placeholder="🔍 주제·질환·약자 검색 (예: 파킨슨)">
    <span class="toggle" id="fAll">전체</span>
    <span class="toggle" id="fDont">모름만</span>
    <span class="toggle" id="fUn">미평가만</span>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="main"></main>

<footer>
  <div class="rate">
    <button class="know" id="bKnow">✓ 외움 (1)</button>
    <button class="dont" id="bDont">✗ 모름 (2)</button>
  </div>
  <div class="nav">
    <button id="bPrev">◀ 이전</button>
    <span class="pos" id="pos"></span>
    <button id="bNext">다음 ▶</button>
  </div>
</footer>

<script>

 * ASK : A 항목(label) -> 실제로 물어볼 질문.  app가 A 펼치기에서 사용.

<script>
const LS_PROG="cpx_progress", LS_SET="cpx_settings";
let prog = JSON.parse(localStorage.getItem(LS_PROG)||"{}");
let set = Object.assign({cover:true,two:true,shuf:false,filter:"all",sys:"all",search:"",id:null},
                        JSON.parse(localStorage.getItem(LS_SET)||"{}"));
let deck=[], pos=0, flipped=false, rv=null;

const $=id=>document.getElementById(id);
const save=()=>{localStorage.setItem(LS_PROG,JSON.stringify(prog)); localStorage.setItem(LS_SET,JSON.stringify(set));};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildDeck(keepId){
  let d=CARDS.slice();
  if(set.sys!=="all") d=d.filter(c=>c.sys===set.sys);
  if(set.filter==="dont") d=d.filter(c=>prog[c.id]==="dont");
  if(set.filter==="unrated") d=d.filter(c=>!prog[c.id]);
  const q=set.search.trim().toLowerCase();
  if(q) d=d.filter(c=>(c.name+" "+c.ddx.join(" ")+" "+c.a.mn+" "+c.a.items.join(" ")).toLowerCase().includes(q));
  if(set.shuf) shuffle(d);
  deck=d;
  pos=0;
  if(keepId){const i=deck.findIndex(c=>c.id===keepId); if(i>=0) pos=i;}
  flipped=false;
}

function resetReveal(){
  const two=set.two;
  rv = set.cover ? {ddx:false,c:false,f:false,a:0} : {ddx:true,c:true,f:true,a:two?1:3};
}

function chipsHtml(){
  const sysList=[...new Set(CARDS.map(c=>c.sys))];
  let h=`<span class="chip ${set.sys==='all'?'on':''}" data-sys="all">전체 ${CARDS.length}</span>`;
  for(const s of sysList){const n=CARDS.filter(c=>c.sys===s).length;
    h+=`<span class="chip ${set.sys===s?'on':''}" data-sys="${s}">${s} ${n}</span>`;}
  $("chips").innerHTML=h;
  $("chips").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{set.sys=el.dataset.sys; buildDeck(); render();});
}

function progressBar(){
  let k=0,d=0,u=0;
  for(const c of CARDS){const p=prog[c.id]; if(p==="know")k++; else if(p==="dont")d++; else u++;}
  const T=CARDS.length;
  $("pbar").innerHTML=
    `<div style="width:${k/T*100}%;background:var(--know)"></div>`+
    `<div style="width:${d/T*100}%;background:var(--dont)"></div>`+
    `<div style="width:${u/T*100}%;background:var(--unrated)"></div>`;
  $("pstats").innerHTML=
    `<span><i class="dot" style="background:var(--know)"></i>외움 <b>${k}</b></span>`+
    `<span><i class="dot" style="background:var(--dont)"></i>모름 <b>${d}</b></span>`+
    `<span><i class="dot" style="background:var(--unrated)"></i>미평가 <b>${u}</b></span>`+
    `<span style="margin-left:auto">/ ${T}</span>`;
}

function field(key,title,inner,tappable){
  const hidden = set.cover && !rv[key];
  return `<div class="field ${hidden?'hidden tap':''} ${tappable&&!hidden?'tap':''}" data-f="${key}">
    <h4>${title}${hidden?'<span class="lock">눌러서 공개 ▾</span>':''}</h4>
    <div class="body">${inner}</div></div>`;
}

function aFieldHtml(card){
  const hidden = set.cover && rv.a===0;
  if(hidden) return `<div class="field hidden tap" data-f="a"><h4>A (동반증상)<span class="lock">눌러서 공개 ▾</span></h4><div class="body"></div></div>`;
  const stage=rv.a;
  let inner=`<div class="mn">${card.a.mn}</div>`;
  if(stage>=2){
    inner+=`<div class="aitems">`+card.a.items.map(i=>`<span>${i}</span>`).join("")+`</div>`;
  }
  if(stage>=3){
    inner+=`<div class="asks">`+card.a.items.map(i=>{
      const q=ASK[i]||"— (질문 추가 예정)";
      return `<div class="ask"><b>${i}</b><i>${q}</i></div>`;
    }).join("")+`</div>`;
  }
  let step="";
  if(set.two && stage<3) step=`<span class="astep">${stage===1?'▾ 확장 보기':'▾ 실제 질문 보기'}</span>`;
  return `<div class="field tap" data-f="a"><h4>A (동반증상)${step}</h4><div class="body">${inner}</div></div>`;
}

function render(){
  chipsHtml(); progressBar();
  [["tCover","cover"],["tTwo","two"],["tShuf","shuf"]].forEach(([id,k])=>$(id).classList.toggle("on",set[k]));
  $("fAll").classList.toggle("on",set.filter==="all");
  $("fDont").classList.toggle("on",set.filter==="dont");
  $("fUn").classList.toggle("on",set.filter==="unrated");
  $("search").value=set.search;

  if(deck.length===0){
    $("main").innerHTML=`<div class="empty">조건에 맞는 카드가 없어요.<br>필터·검색을 바꿔보세요.</div>`;
    $("pos").textContent="0 / 0"; updateRate(); save(); return;
  }
  if(pos>=deck.length) pos=deck.length-1;
  const card=deck[pos];
  set.id=card.id;
  const p=prog[card.id];
  const badge = p==="know"?`<span class="badge know">✓ 외움</span>`
              : p==="dont"?`<span class="badge dont">✗ 모름</span>`
              : `<span class="badge">미평가</span>`;
  let html=`<div class="meta"><span>${card.sys}</span>${badge}</div>`;

  if(!flipped){
    html+=`<div class="frontwrap"><div class="front" id="front">
      <div class="sym">${card.name}</div>
      <div class="hint">탭하거나 Space → 뒤집기</div></div></div>`;
  }else{
    html+=field("ddx","감별",`<div class="ddx-list">`+card.ddx.map(d=>`<span>${d.includes('⚠️')?'<span class=warn>'+d+'</span>':d}</span>`).join("")+`</div>`,true);
    html+=field("c","C (성상)", card.c.includes('⚠️')?`<span class="warn">${card.c}</span>`:card.c, true);
    html+=aFieldHtml(card);
    html+=field("f","F (요인)", card.f.includes('⚠️')?`<span class="warn">${card.f}</span>`:card.f, true);
    html+=`<div style="text-align:center;margin:6px 0 2px"><span class="toggle" id="reflip">↻ 앞면</span></div>`;
  }
  $("main").innerHTML=html;
  $("main").scrollTop=0;

  if(!flipped){ $("front").onclick=()=>{flipped=true; resetReveal(); render();}; }
  else{
    $("reflip").onclick=()=>{flipped=false; render();};
    $("main").querySelectorAll(".field.tap").forEach(el=>el.onclick=()=>{
      const k=el.dataset.f;
      if(k==="a"){ rv.a = set.two ? Math.min(rv.a+1,3) : 3; }
      else rv[k]=true;
      render();
    });
  }
  $("pos").textContent=`${pos+1} / ${deck.length}`;
  updateRate(); save();
}

function updateRate(){
  const card=deck[pos]; const p=card?prog[card.id]:null;
  $("bKnow").classList.toggle("act",p==="know");
  $("bDont").classList.toggle("act",p==="dont");
}
function rate(v){
  if(!deck.length) return;
  const card=deck[pos];
  prog[card.id] = (prog[card.id]===v)?undefined:v;
  if(prog[card.id]===undefined) delete prog[card.id];
  // 모름만/미평가만 모드에서 상태가 바뀌면 자동으로 다음으로
  if((set.filter==="dont"||set.filter==="unrated")){
    const id=card.id; buildDeck();
    // 방금 카드가 빠졌으면 같은 자리(다음 카드) 유지
    if(!deck.find(c=>c.id===id)){ /* pos already 0..; keep */ }
    render();
  } else { render(); }
}
function go(n){ if(!deck.length) return; pos=(pos+n+deck.length)%deck.length; flipped=false; render(); }

// events
$("tCover").onclick=()=>{set.cover=!set.cover; if(flipped)resetReveal(); render();};
$("tTwo").onclick=()=>{set.two=!set.two; if(flipped)resetReveal(); render();};
$("tShuf").onclick=()=>{set.shuf=!set.shuf; buildDeck(); render();};
$("fAll").onclick=()=>{set.filter="all"; buildDeck(); render();};
$("fDont").onclick=()=>{set.filter="dont"; buildDeck(); render();};
$("fUn").onclick=()=>{set.filter="unrated"; buildDeck(); render();};
$("search").oninput=e=>{set.search=e.target.value; buildDeck(); render();};
$("bKnow").onclick=()=>rate("know");
$("bDont").onclick=()=>rate("dont");
$("bPrev").onclick=()=>go(-1);
$("bNext").onclick=()=>go(1);
document.addEventListener("keydown",e=>{
  const g=document.getElementById("gate"); if(g && !g.classList.contains("hidden")) return;
  if(document.activeElement===$("search")) return;
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.key===" "){e.preventDefault(); if(!flipped){flipped=true;resetReveal();} else flipped=false; render();}
  else if(e.key==="ArrowUp"){ if(flipped){rv={ddx:true,c:true,f:true,a:3}; render();} }
  else if(e.key==="1")rate("know");
  else if(e.key==="2")rate("dont");
});

// ── 입장 게이트 ──
const GATE_KEY="cpx_session";
function startApp(){ buildDeck(set.id); resetReveal(); render(); }
async function gateInit(){
  const gate=document.getElementById('gate'), body=document.getElementById('gateBody');
  let cfg;
  try{ const r=await fetch('config.json?_='+Date.now(),{cache:'no-store'}); cfg=await r.json(); }
  catch(e){ body.innerHTML='<p>설정을 불러올 수 없어요.<br>잠시 후 다시 시도하거나 관리자에게 문의하세요.</p>'; return; }
  if(!cfg.open){ body.innerHTML='<p>지금은 닫혀 있어요.<br>관리자에게 문의하세요.</p>'; localStorage.removeItem(GATE_KEY); return; }
  function enter(name){
    localStorage.setItem(GATE_KEY,JSON.stringify({name:name,code:cfg.code}));
    gate.classList.add('hidden');
    if(!document.querySelector('.gwho')){ const w=document.createElement('div'); w.className='gwho'; w.textContent='👤 '+name; document.body.appendChild(w); }
    startApp();
  }
  const sess=JSON.parse(localStorage.getItem(GATE_KEY)||'null');
  if(sess && sess.code===cfg.code && sess.name){ enter(sess.name); return; }  // 코드 그대로면 자동 입장
  localStorage.removeItem(GATE_KEY);  // 코드 바뀌었으면 재로그인
  document.getElementById('gEnter').onclick=()=>{
    const n=document.getElementById('gName').value.trim();
    const c=document.getElementById('gCode').value.trim();
    const err=document.getElementById('gErr');
    if(!n){ err.textContent='이름을 입력하세요'; return; }
    if(c!==cfg.code){ err.textContent='참여코드가 올바르지 않아요'; return; }
    enter(n);
  };
  document.getElementById('gCode').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('gEnter').click(); });
}
gateInit();
</script>
