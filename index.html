});
/* 아직 안 보낸 편집을 확정하고 밀어낸다. 언로드 직전이면 sendBeacon 으로. */
function pushOut(beacon){
  /* 로그아웃이 부른 reload 의 pagehide 에서도 이게 돈다 —
     막지 않으면 앞사람 데이터를 다음 사람 이름으로 밀어낼 수 있다 */
  if(_loggingOut || _denied) return Promise.resolve(false);
  fbFlush(); mnFlush(); ddxFlush();      // 디바운스 대기중이던 입력부터 로컬 확정
  return flushDirty(beacon);
}
/* ── 명단에서 빠졌을 때 ────────────────────────────────────────────────
   세션만 끊어 게이트로 돌려보낸다. **학습 데이터는 한 글자도 지우지 않는다.**
   지우는 순간, 서버가 한 번만 잘못 답해도 그 사람 공부 기록이 영구히 날아간다 —
   되돌릴 방법이 없다. 반면 안 지우면 명단에 다시 넣는 것만으로 그대로 살아난다.
   차단은 되돌릴 수 있어야 하는 조치다. */
function denyKick(){
  if(_denied) return;
  _denied=true;
  /* 디바운스(400ms) 대기중이던 입력부터 로컬에 확정한다 —
     쫓겨나면서 방금 친 글자를 잃지 않게. 시트로는 안 나간다(어차피 거부당한다). */
  try{ fbFlush(); mnFlush(); ddxFlush(); }catch(e){}
  clearTimeout(_verifyT); _verifyT=null;
  clearInterval(_sheetTimer); _sheetTimer=null;
  try{ localStorage.removeItem(GATE_KEY); }catch(e){}   // 세션만 끊는다
  /* 콘텐츠 키 캐시도 지운다 — 이걸 남기면 차단당한 사람이 오프라인으로 계속 본다.
     ⚠ 이건 콘텐츠 키일 뿐 학습 데이터가 아니다. 공부 기록은 그대로 남는다. */
  try{ localStorage.removeItem(LS_CKEY); }catch(e){}
  _contentOpen=false;
  const gate=document.getElementById("gate"), body=document.getElementById("gateBody");
  if(gate&&body){
    body.innerHTML='<p><b>참여 명단에 없는 이름이에요.</b></p>'
                  +'<div class="err">관리자에게 문의하세요.</div>'
                  +'<p style="font-size:12px;opacity:.75;margin-top:14px">'
                  +'이 기기에 저장된 공부 기록은 지워지지 않았습니다.<br>'
                  +'다시 명단에 등록되면 그대로 이어서 쓸 수 있어요.</p>';
    gate.classList.remove("hidden");
  }
}

/* ── 콘텐츠 잠금 ──────────────────────────────────────────────────────
   배포본은 ASK·CARDS 가 AES-GCM 으로 암호화돼 있고(window.__CPXENC),
   키는 명단을 통과한 사람에게만 서버가 준다. 무단 사용자는 파일을 통째로 받아도
   게이트를 뚫어도 카드가 빈 껍데기다.

   ⚠ 키는 받는 즉시 localStorage 에 캐시한다 — **오프라인에서 앱이 안 열리면 안 된다.**
     한 번이라도 들어와 본 기기는 그 뒤로 인터넷 없이도 열린다.
     차단(denyKick)될 때만 이 캐시를 지운다 → 그래야 차단이 실효를 갖는다.
   ⚠ 평문 빌드(개발용 index.html)에는 __CPXENC 가 없다 → 아무 일도 안 하고 통과한다. */
const LS_CKEY="cpx_ckey";
let _contentOpen=false;
function ckeyGet(){ try{ return localStorage.getItem(LS_CKEY)||""; }catch(e){ return ""; } }
async function contentUnlock(key){
  if(!key || !window.__CPXENC) return false;
  try{
    const b=atob(window.__CPXENC), raw=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++) raw[i]=b.charCodeAt(i);
    const kb0=atob(key), kb=new Uint8Array(kb0.length);
    for(let i=0;i<kb0.length;i++) kb[i]=kb0.charCodeAt(i);
    const ck=await crypto.subtle.importKey("raw",kb,{name:"AES-GCM"},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:raw.slice(0,12)},ck,raw.slice(12));
    const o=JSON.parse(new TextDecoder().decode(pt));
    if(!o || !Array.isArray(o.CARDS) || !o.CARDS.length) return false;
    ASK=o.ASK; CARDS=o.CARDS; BOKC=o.BOKC||{};
    return true;
  }catch(e){ return false; }
}
/* 캐시된 키 → 서버가 방금 준 키 순으로 시도한다.
   true = 열렸다(또는 평문 빌드라 열 것이 없다) / false = 못 열었다(인터넷 필요) */
async function ensureContent(srvKey){
  if(!window.__CPXENC) return true;            // 평문 빌드
  if(_contentOpen) return true;
  const tries=[]; const c=ckeyGet();
  if(c) tries.push(c);                          // 캐시 먼저 — 네트워크를 안 기다린다
  if(srvKey && tries.indexOf(srvKey)<0) tries.push(srvKey);
  for(let i=0;i<tries.length;i++){
    if(await contentUnlock(tries[i])){
      _contentOpen=true; lsSet(LS_CKEY,tries[i]); return true;
    }
  }
  return false;
}
/* 키를 못 구했을 때의 안내. 게이트 자리에 띄운다 — 여기서 끝나지 않게 다시 시도 버튼을 준다. */
function showNeedNet(retry){
  const gate=document.getElementById("gate"), body=document.getElementById("gateBody");
  if(!gate||!body) return;
  body.innerHTML='<p><b>학습 내용을 불러오지 못했어요.</b></p>'
                +'<p style="font-size:13px;opacity:.8">처음 한 번은 인터넷 연결이 필요합니다.<br>'
                +'한 번 열고 나면 다음부터는 오프라인에서도 열려요.</p>'
                +'<button id="gRetry">다시 시도</button>';
  gate.classList.remove("hidden");
  const b=document.getElementById("gRetry");
  if(b) b.onclick=retry;
}

/* 게이트 입장 자격을 서버에 물어본다. JSONP.
   서버는 probe=1 이면 시트를 통째로 읽지 않고 판정만 돌려준다.
   응답이 없으면(오프라인·서버 다운) null → **통과시킨다.**
   여기서 잠그면 지하철에서 앱을 못 여는 사람이 생긴다. 들어간 뒤 온라인이 되면
   sheetLoad 가 'not allowed' 를 받아 그때 denyKick 이 회수한다. */
function authProbe(name,code){
  return new Promise(resolve=>{
    if(!SHEET) return resolve(null);                  // 시트 미설정이면 물어볼 곳이 없다
    const cb="__cpxa"+Math.random().toString(36).slice(2);
    const sc=document.createElement("script");
    let done=false;
    const cleanup=()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
                        if(sc.parentNode) sc.parentNode.removeChild(sc); };
    const finish=v=>{ if(done) return; done=true; cleanup(); resolve(v); };
    window[cb]=res=>{ if(res&&res.now) setSkew(res.now); finish(res||null); };
    sc.onerror=()=>finish(null);
    setTimeout(()=>finish(null),AUTH_WAIT);
    sc.src=SHEET+(SHEET.indexOf("?")<0?"?":"&")+"callback="+cb+"&probe=1&key=1"
          +"&name="+encodeURIComponent(name)+"&code="+encodeURIComponent(code||"")
          +"&_="+Date.now();
    document.head.appendChild(sc);
  });
}
function sheetAutoInit(){
  if(!SHEET || _sheetTimer) return;                       // 미설정이면 아무것도 안 건다
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden"){ pushOut(true); return; }  // 떠날 때: 비콘으로 밀어냄
    pushOut();                                             // 돌아올 때: 내 것 먼저 올리고
    sheetLoad();                                           // 남의 것을 받는다(10초 스로틀)
  });
  /* 페이지 종료 — beforeunload 는 모바일 사파리에서 안 온다. pagehide 가 맞다.
     fetch 는 언로드 중 취소되므로 sendBeacon 으로 보낸다. */
  window.addEventListener("pagehide",()=>{ pushOut(true); });
  _sheetTimer=setInterval(()=>{
    if(document.visibilityState==="hidden") return;        // 숨겨져 있으면 건너뛴다
    pushOut();                                             // 올리고 나서
    sheetLoad();                                           // 받는다
  },SHEET_EVERY);
  setInterval(pendPaint,30000);                            // 5분 경고를 제때 띄우려면 주기 갱신
  pendPaint();
}

/* 불러오기: Apps Script는 리다이렉트로 CORS가 깨지므로 JSONP
   done(applied) : 이 조회가 **실제로 끝난 시점**에 정확히 한 번 불린다.
     applied=true  응답을 받아 병합·pendClear 까지 마쳤다
     applied=false 아예 안 나갔거나(미설정·스로틀) 응답이 안 왔다(오프라인·타임아웃)
   확인(scheduleVerify)이 이걸 쓴다 — 고정 타이머로 세면 느린 서버를 실패로 오판한다. */
function sheetLoad(force,done){
  let _fired=false;
  const fin=v=>{ if(_fired) return; _fired=true; if(typeof done==="function") done(!!v); };
  /* 로그아웃 중이면 절대 받지 않는다. 아래 콜백이 localStorage 를 직접 다시 쓰기 때문에,
     방금 지운 앞사람 데이터가 서버 응답으로 되살아난다(로컬 ts 가 0 이라 서버가 무조건 이긴다). */
  if(!SHEET || _loggingOut || _denied) return fin(false);
  const s=sess(); if(!s.name) return fin(false);
  const now=Date.now();
  if(!force && now-_sheetLast<SHEET_MIN) return fin(false);   // 연타 방지 (탭을 빨리 왔다갔다 해도 1번)
  _sheetLast=now;
  const cb="__cpxfb"+Math.random().toString(36).slice(2);
  const sc=document.createElement("script");
  let _got=false;                            // ⚠ 파라미터 done 과 이름이 겹치면 SyntaxError 다
  function cleanup(){ try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
                      if(sc.parentNode) sc.parentNode.removeChild(sc); }
  window[cb]=function(res){
    _got=true;
    /* 요청을 보낸 뒤 로그아웃했을 수 있다 — 이미 날아오고 있던 응답이
       지운 직후에 도착해 되살리는 걸 막는다(reload 가 완료되기 전 창이 열려 있다). */
    if(_loggingOut){ cleanup(); fin(false); return; }
    /* 관리자가 명단에서 뺐다. 앱 안에 있는 사람도 여기서 회수된다.
       ⚠ 학습 데이터는 건드리지 않는다 — 아래 denyKick 주석 참조. */
    if(res && res.ok===false && res.err==="not allowed"){ denyKick(); cleanup(); fin(false); return; }
    try{
      /* 시계 오차 보정 — 이 응답이 오는 순간이 유일하게 서버 시각을 아는 때다.
         이후 모든 저장 ts 는 srvNow() = 기기시계 + skew 로 찍힌다. */
      if(res && res.now) setSkew(res.now);
      /* 서버는 {items:{카드ID:{text,textTs,mn,mnTs,ddx,ddxTs,tag,tagTs,hl,hlTs,prog,progTs}}} 를 준다.
         옛 rows 배열/옛 서버(필드별 ts 없음)도 그대로 받는다 */
      const it=res&&res.items;
      const rows=(it&&!Array.isArray(it))
        ? Object.keys(it).map(k=>Object.assign({cardId:k},it[k]||{}))
        : ((res&&res.rows)||(Array.isArray(res)?res:[]));
      let ch=false, chm=false, chd=false, cht=false, chh=false, chp=false, chq=false;
      /* 입력 중인 칸은 건드리지 않는다: 그 카드의 그 필드만 병합에서 빼고,
         다시 그리기는 포커스가 풀릴 때까지 미룬다(입력 내용·커서 보존). */
      const busy=editingNow();
      const skip=(id,f)=>!!(busy && busy.id===id && busy.field===f);
      rows.forEach(r=>{
        if(!r||!r.cardId) return;
        if(r.name && r.name!==s.name) return;          // 본인 것만
        const id=r.cardId;
        /* 필드별 수정시각. 서버가 그 키를 아예 안 주면(옛 서버) 행 ts 로 떨어진다.
           키는 있는데 비었으면 0 = 아직 _ts 가 없는 옛 행 → 로컬이 이긴다(마이그레이션 규칙). */
        const fts=k=>{ const v=r[k]; if(v===undefined) return +r.ts||0; return +v||0; };
        /* 필드 하나를 병합한다 — 판단은 오직 _ts 비교다. 값이 뭐냐로는 아무것도 안 가린다.
           빈 값도 정식 값이다(= 삭제·해제가 그대로 전파된다). 6개 필드 전부 같은 규칙.
             hasLocal : 로컬에 레코드가 있나 (없는데 서버도 비었으면 할 일이 없다)
             srvEmpty : 서버 값이 빈 값인가
             sameVal  : 값이 이미 같은가 → ts 만 서버 시각으로 교정한다 */
        function mergeF(srvTs,localTs,hasLocal,srvEmpty,sameVal,apply){
          if(srvTs>localTs){
            if(srvEmpty && !hasLocal) return false;      // 지울 것도 없다
            apply(srvTs); return true;
          }
          /* 값이 같을 때의 ts 교정.
             예전엔 srvTs!==localTs 이기만 하면 로컬 ts 를 서버 값으로 "내렸는데",
             그러면 그 사이 다른 기기가 만든 더 옛 삭제(묘비)가 최신 편집을 이길 수 있다.
             skew 보정이 들어온 뒤로 정상 경로에서는 두 ts 가 같으므로,
             내리는 건 로컬 ts 가 명백히 미래로 튄 경우(=skew 를 모르던 첫 저장)로만 좁힌다. */
          if(srvTs>0 && hasLocal && sameVal && localTs>srvNow()+60000){ apply(srvTs); return true; }
          return false;
        }

        /* 메모 */
        if(r.text!==undefined){
          const txt=String(r.text==null?"":r.text), sts=fts("textTs");
          if(!skip(id,"text")){
            const cur=fb[id], lts=+(cur&&cur.ts)||0;
            if(mergeF(sts,lts,!!cur,!txt, !!cur&&String(cur.text||"")===txt,
                      t=>{ fb[id]={text:txt,ts:t}; })) ch=true;
          }
          if(pendClear(id,"text",txt,sts)) chq=true;
        }
        /* 말야마 — 빈 값이면 "원래대로"가 전파된 것이다(로컬 override 를 비운다) */
        if(r.mn!==undefined){
          const mtx=String(r.mn==null?"":r.mn).trim(), sts=fts("mnTs");
          if(!skip(id,"mn")){
            const cm=mnOv[id], lts=+(cm&&cm.ts)||0;
            if(mergeF(sts,lts,!!cm,!mtx, !!cm&&String(cm.text||"")===mtx,
                      t=>{ mnOv[id]={text:mtx,ts:t}; })) chm=true;
          }
          if(pendClear(id,"mn",mtx,sts)) chq=true;
        }
        /* 감별진단: 말야마와 완전히 같은 규칙 */
        if(r.ddx!==undefined){
          const dtx=String(r.ddx==null?"":r.ddx).trim(), sts=fts("ddxTs");
          if(!skip(id,"ddx")){
            const cd=ddxOv[id], lts=+(cd&&cd.ts)||0;
            if(mergeF(sts,lts,!!cd,!dtx, !!cd&&String(cd.text||"")===dtx,
                      t=>{ ddxOv[id]={text:dtx,ts:t}; })) chd=true;
          }
          if(pendClear(id,"ddx",dtx,sts)) chq=true;
        }
        /* 컬러태그 — 빈 값이면 "미지정"이 전파된 것이다 */
        if(r.tag!==undefined){
          const raw=String(r.tag==null?"":r.tag).trim(), sts=fts("tagTs");
          const tv=(raw==="hard"||raw==="mid"||raw==="easy")?raw:"";
          const ct=tagOv[id], lts=+(ct&&ct.ts)||0;
          if(mergeF(sts,lts,!!ct,!tv, !!ct&&String(ct.v||"")===tv,
                    t=>{ tagOv[id]={v:tv,ts:t}; })) cht=true;
          if(pendClear(id,"tag",tv,sts)) chq=true;
        }
        /* 형광펜: 서버가 객체로 주거나 JSON 문자열로 준다. 파싱 실패는 빈 값으로 본다.
           빈 값이면 "형광펜 전부 해제"가 전파된 것이다 */
        if(r.hl!==undefined){
          let hv=r.hl;
          if(typeof hv==="string"){ const t2=hv.trim();
            if(!t2) hv=null; else { try{ hv=JSON.parse(t2); }catch(e){ hv=null; } } }
          const sts=fts("hlTs"), chl=hlOv[id], lts=+(chl&&chl.ts)||0;
          /* 구버전 앱은 fb 를 모르므로 {mn,ddx} 만 올린다. 그 응답을 그대로 받아들이면
             이 기기의 fb 칠이 통째로 지워진다 → 서버가 아예 안 보낸 필드는 로컬을 유지한다.
             hv 가 통째로 비었을 때(="")는 "전부 해제"가 맞으므로 전 필드를 비운다. */
          const srvA={}, wipeAll=!hv;
          let legacyPartial=false;
          HLF.forEach(k=>{
            if(hv&&Array.isArray(hv[k])){ srvA[k]=hv[k]; return; }
            const mine=(!wipeAll&&chl&&Array.isArray(chl[k]))?chl[k]:[];
            srvA[k]=(wipeAll||!chl)?[]:mine;                // 구버전이 뺀 필드는 보존
            /* 보존하긴 했지만 **시트에는 그 필드가 없다.** 다시 안 올리면
               "백업 완료"로 보이는 채로 로컬만 갖고 있다가 로그아웃 때 영영 사라진다. */
            if(mine.length && !wipeAll) legacyPartial=true;
          });
          const same=!!chl && HLF.every(k=>
            JSON.stringify(Array.isArray(chl[k])?chl[k]:[])===JSON.stringify(srvA[k]));
          const mk=t=>{ const nr={ts:t};
            HLF.forEach(k=>{ if(srvA[k].length) nr[k]=srvA[k]; }); hlOv[id]=nr; };
          if(mergeF(sts,lts,!!chl,!HLF.some(k=>srvA[k].length),same,mk)) chh=true;
          if(pendClear(id,"hl",hv,sts)) chq=true;
          /* 구버전이 일부 필드를 빼고 덮어썼다면 합쳐진 전체를 다시 올려야 한다.
             안 그러면 시트엔 없고 이 기기에만 있는 칠이 되어, 로그아웃 한 번에 사라진다. */
          if(legacyPartial){ dirtyMark(id,"hl"); chq=true; }
        }
        /* 진도: cpx_progress 는 형식 그대로(빈 값은 키 삭제), ts 는 cpx_progress_ts 에서 본다.
           빈 값이면 "평가 해제"가 전파된 것이다 */
        if(r.prog!==undefined){
          const raw=String(r.prog==null?"":r.prog).trim(), sts=fts("progTs");
          const pv=(raw==="know"||raw==="dont")?raw:"";
          const lts=+progTs[id]||0;
          const hasLocal=(prog[id]!==undefined)||(progTs[id]!==undefined);
          if(mergeF(sts,lts,hasLocal,!pv, String(prog[id]||"")===pv,
                    t=>{ if(pv) prog[id]=pv; else delete prog[id]; progTs[id]=t; })) chp=true;
          if(pendClear(id,"prog",pv,sts)) chq=true;
        }
      });
      if(ch) fbSaveLS();
      if(chm) mnSaveLS();
      if(chd) ddxSaveLS();
      if(cht) tagSaveLS();
      if(chh) hlSaveLS();
      if(chp){ lsSet(LS_PROG,JSON.stringify(prog));
               try{ localStorage.setItem(LS_PTS,JSON.stringify(progTs)); }catch(e){} }
      if(chq) pendSave();
      /* 여기까지 왔다 = 서버 응답을 읽었다 = 백업 경로가 살아 있다 */
      if(!(res&&res.ok===false)){ try{ localStorage.setItem(LS_OK,String(Date.now())); }catch(e){} }
      pendPaint();
      if(ch||chm||chd||cht||chh||chp){
        if(busy) _needRender=true;                   // 입력 중이면 focusout 뒤로 미룬다
        else renderKeep();                           // 자동갱신이므로 스크롤 위치는 지킨다
      }
    }catch(e){}
    cleanup();
    fin(true);                                     // 병합·pendClear 까지 끝났다
  };
  sc.onerror=()=>{ cleanup(); fin(false); };       // 오프라인 등 — 판정하지 않는다
  sc.src=SHEET+(SHEET.indexOf("?")<0?"?":"&")+"callback="+cb
        +"&name="+encodeURIComponent(s.name)+"&code="+encodeURIComponent(s.code||"")
        +"&_="+Date.now();
  document.head.appendChild(sc);
  /* ⚠ 예전엔 12초에 window[cb] 를 **지웠다.** 그보다 늦게 도착한 응답은
       "__cpxfbXXX is not defined" 로 죽었고, **그 응답이 들고 온 pendClear 가 통째로 버려졌다.**
       서버엔 멀쩡히 들어갔는데 확인만 못 받아 빨간 경고가 더 오래 남는 원인이다.
       (실측: script 24건 중 14건이 12초 초과 — 다만 모의서버가 HTTP/1.1 이라
        빈도는 과장됐을 수 있다. 코드 결함 자체는 실재한다.)
     → 늦게 와도 **처리는 한다.** 판정만 먼저 포기하고(fin(false)), 한참 뒤에
       빈 함수로 갈아끼워 예외 없이 조용히 흘려보낸 다음 치운다. */
  setTimeout(()=>{ if(!_got) fin(false); },AUTH_WAIT);
  setTimeout(()=>{
    if(_got) return;
    window[cb]=function(){};                       // 무덤 — ReferenceError 를 막는다
    if(sc.parentNode) sc.parentNode.removeChild(sc);
    setTimeout(()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } },60000);
  },45000);
}

/* 타이핑 중 로컬 즉시저장(디바운스). 시트로는 저장 버튼에서 즉시,
   저장을 안 눌러도 dirty 로 표시해 두면 2분 주기·탭 이탈·종료 때 자동으로 밀려 나간다. */
/* 로그아웃 중이면 어떤 저장·전송도 하지 않는다.
   doLogout() 이 지운 직후 unload 핸들러가 되살리는 걸 막는 유일한 장치다. */
let _loggingOut=false;
/* 이 탭이 어느 이름으로 입장했는지 — 다른 탭에서 계정이 바뀐 걸 알아채는 기준 */
let _myName="";
let fbPending=null, fbTimer=null;
function fbTouch(id,text){ fbPending={id:id,text:text};
  clearTimeout(fbTimer); fbTimer=setTimeout(fbFlush,400); }
function fbFlush(){
  clearTimeout(fbTimer);
  if(_loggingOut || !fbPending) return;
  const id=fbPending.id, t=String(fbPending.text||"").trim();
  fbPending=null;
  fb[id]={text:t,ts:srvNow()};              // 빈 값도 레코드로 남긴다(묘비)
  fbSaveLS();
  dirtyMark(id,"text");                     // 아직 push 안 함
}
function fbCommit(id,text,cardName){
  fbPending=null; clearTimeout(fbTimer);
  const t=String(text||"").trim(), ts=srvNow();
  fb[id]={text:t,ts:ts};                    // 비우기도 묘비로 남겨야 시트의 옛 메모가 안 되살아난다
  fbSaveLS();
  const s=sess();
  /* 메모만 보낸다 — mn 키를 안 넣어야 서버가 시트의 말야마를 유지한다 */
  sheetPush({name:s.name||"",code:s.code||"",cardId:id,cardName:cardName||"",text:t,ts:ts});
  return ts;
}

/* ── 말야마: 타이핑 중 로컬 즉시저장(디바운스), 시트 전송은 저장 버튼에서만 ── */
let mnPending=null, mnTimer=null;
function mnTouch(card,text){ mnPending={card:card,text:text};
  clearTimeout(mnTimer); mnTimer=setTimeout(mnFlush,400); }
function mnFlush(){
  clearTimeout(mnTimer);
  if(_loggingOut || !mnPending) return;
  const c=mnPending.card, t=mnPending.text; mnPending=null;
  mnSet(c,t,srvNow());
  dirtyMark(c.id,"mn");
}
function mnCommit(card,text){
  mnPending=null; clearTimeout(mnTimer);
  const ts=srvNow(), t=String(text||"").trim();
  const revert = (!t || t===mnBase(card));      // 원본 복귀
  mnSet(card,t,ts);
  const s=sess();
  /* 말야마만 보낸다 — text 키를 안 넣어야 서버가 시트의 메모를 유지한다.
     되돌리기는 빈 문자열 = "시트에서도 지워라". */
  sheetPush({name:s.name||"",code:s.code||"",cardId:card.id,cardName:card.name,
             mn: revert?"":t, ts:ts});
  return ts;
}
/* ── 시트 전송 공통 — 보낸 필드만 서버가 갱신한다. 키를 안 넣으면 서버는 기존 값·기존 _ts 유지.
   ts 는 srvNow()(서버시계로 환산한 지금)로 함께 보낸다. 큐에 들어가 며칠 뒤 재전송돼도
   그때의 도착 시각이 아니라 "원래 저장한 시각"으로 남아야 하기 때문이다. ── */
/* ⚠ 평가·태그·형광펜은 클릭 한 번마다 POST 를 한 건씩 냈다. 20장을 평가하면 40건이고,
   그 40건이 전부 같은 ScriptLock 앞에 줄을 선다 — 실측으로 같은 "전체 저장"이
   16초에서 37초로 늘었다(2.3배). 값은 이미 로컬에 저장돼 있으므로 급할 이유가 없다.
   → dirty 로만 찍어두고 잠깐 모았다가 **한 번의 벌크로** 내보낸다.
   탭을 닫거나 2분 주기가 오면 pushOut→flushDirty 가 어차피 같은 dirty 를 밀어내므로,
   모으는 동안 창을 닫아도 유실되지 않는다. */
let _coalT=null;
function pushSoon(){
  clearTimeout(_coalT);
  _coalT=setTimeout(()=>{ _coalT=null; flushDirty(); },1200);
}
function pushField(card,fields,ts){
  const s=sess();
  sheetPush(Object.assign({name:s.name||"",code:s.code||"",
                           cardId:card.id,cardName:card.name||"",
                           ts:(ts===undefined?srvNow():ts)},fields));
}

/* ── 감별진단: 말야마와 똑같은 디바운스 + 저장 버튼에서만 시트 전송 ── */
let ddxPending=null, ddxTimer=null;
function ddxTouch(card,text){ ddxPending={card:card,text:text};
  clearTimeout(ddxTimer); ddxTimer=setTimeout(ddxFlush,400); }
function ddxFlush(){
  clearTimeout(ddxTimer);
  if(_loggingOut || !ddxPending) return;
  const c=ddxPending.card, t=ddxPending.text; ddxPending=null;
  ddxSet(c,t,srvNow());
  dirtyMark(c.id,"ddx");
}
function ddxCommit(card,text){
  ddxPending=null; clearTimeout(ddxTimer);
  const ts=srvNow(), t=String(text||"").trim();
  const revert=(!t || t===ddxBase(card));           // 원본 복귀
  ddxSet(card,t,ts);
  pushField(card,{ddx: revert?"":t},ts);         // 되돌리기는 빈 문자열 = 시트에서도 지워라
  return ts;
}

/* ── 컬러태그 / 형광펜 / 진도: 값이 바뀌는 즉시 시트로 ── */
function tagCommit(card,v){
  const ts=srvNow();
  tagSet(card,v,ts);
  dirtyMark(card.id,"tag"); pushSoon();          // 미지정이면 빈 문자열 (fieldPayload 가 만든다)
  return ts;
}
function hlCommit(card){
  const ts=srvNow();
  const r=hlRec(card.id);
  /* hlToggle 이 이미 srvNow() 로 로컬 ts 를 찍어 두었다 — 그 값을 그대로 도장으로 쓴다 */
  const lts=+r.ts||ts;
  dirtyMark(card.id,"hl"); pushSoon();
  return lts;
}
function progCommit(card){
  const ts=srvNow();
  progTs[card.id]=ts;
  try{ localStorage.setItem(LS_PTS,JSON.stringify(progTs)); }catch(e){}
  dirtyMark(card.id,"prog"); pushSoon();
  return ts;
}

window.addEventListener("beforeunload",fbFlush);
window.addEventListener("beforeunload",mnFlush);
window.addEventListener("beforeunload",ddxFlush);
window.addEventListener("online",()=>{ queueFlush(); flushDirty(); retryPending(); });

/* ── 두 탭 동시 열기 대비 ────────────────────────────────────
   각 탭은 render() 마다 save() 로 prog/set 전체를 덮어쓴다. 다른 탭이 바꾼 걸 안 읽으면
   낡은 탭의 자동갱신 한 번만으로도 최신 진도가 되돌아간다.
   → storage 이벤트(같은 탭에서는 안 온다)로 다른 탭의 변경을 메모리에 즉시 반영한다.
   set 은 화면 표시 계열만 받는다 — 검색·필터·계통·섞기·현재카드는 탭마다 따로 놀아야
   덱(deck)과 상태가 어긋나지 않는다. */
const SET_SYNC=["cover","two","cols","libName","libMn","libDdx","libFb",
                "pTitle","pMn","pDdx","pFb","pFull","pTarget","pSys","pCols","libTab",
                /* theme 이 빠지면 다른 탭의 save() 가 자기 기억 속 옛 테마로 덮어써
                   방금 고른 테마가 되돌아간다 (set 전체를 통째로 저장하기 때문) */
                "theme"];
function lsSnap(k){
  if(k===LS_SET){ const o={}; SET_SYNC.forEach(x=>{ o[x]=set[x]; }); return JSON.stringify(o); }
  const m={};
  m[LS_PROG]=prog; m[LS_FB]=fb; m[LS_MN]=mnOv; m[LS_DDX]=ddxOv;
  m[LS_TAG]=tagOv; m[LS_HL]=hlOv; m[LS_PTS]=progTs; m[LS_PEND]=pend; m[LS_DIRTY]=dirty;
  return (k in m)?JSON.stringify(m[k]):null;
}
function reloadLS(k){                       // 실제로 메모리 상태가 달라졌으면 true
  const before=lsSnap(k);
  if(before===null) return false;           // 우리가 안 보는 키
  if(k===LS_PROG)       prog=lsObjSafe(LS_PROG);
  else if(k===LS_SET){  const s2=lsObjSafe(LS_SET);
                        SET_SYNC.forEach(x=>{ if(s2[x]!==undefined) set[x]=s2[x]; });
                        try{ themeApply(); }catch(e){} }   // 다른 탭에서 바꾼 테마를 즉시 반영
  else if(k===LS_FB)    fb=lsObj(LS_FB);
  else if(k===LS_MN)    mnOv=lsObj(LS_MN);
  else if(k===LS_DDX)   ddxOv=lsObj(LS_DDX);
  else if(k===LS_TAG)   tagOv=lsObj(LS_TAG);
  else if(k===LS_HL)    hlOv=lsObj(LS_HL);
  else if(k===LS_PTS)   progTs=lsObj(LS_PTS);
  else if(k===LS_PEND)  pend=lsObj(LS_PEND);
  else if(k===LS_DIRTY) dirty=lsObj(LS_DIRTY);
  return lsSnap(k)!==before;
}
window.addEventListener("storage",e=>{
  if(!e.key) return;                        // localStorage.clear() 는 무시
  /* 다른 탭에서 로그아웃·계정전환이 일어났다. 이 탭을 그대로 두면 헤더엔 앞사람 이름이
     떠 있는데 저장은 sess() 를 매번 읽으므로 **뒷사람 이름으로 나간다.**
     (앞사람이 열어둔 탭으로 돌아와 계속 공부하면 그 공부가 뒷사람 계정에 쌓인다) */
  if(e.key===GATE_KEY){
    const now=sess();
    if(String(now.name||"")!==String(_myName||"")) location.reload();
    return;
  }
  if(!reloadLS(e.key)) return;              // 달라진 게 없으면 다시 안 그린다(탭 간 핑퐁 방지)
  if(e.key===LS_PEND||e.key===LS_DIRTY){ pendPaint(); return; }
  if(editingNow()){ _needRender=true; return; }   // 입력 중이면 focusout 뒤로 미룬다
  renderKeep();
});

function buildDeck(keepId){
  let d=CARDS.slice();
  if(set.sys!=="all") d=d.filter(c=>c.sys===set.sys);
  if(set.filter==="dont") d=d.filter(c=>prog[c.id]==="dont");
  if(set.filter==="unrated") d=d.filter(c=>!prog[c.id]);
  const q=set.search.trim().toLowerCase();
  if(q) d=d.filter(c=>haystack(c).includes(q));
  if(set.shuf) shuffle(d);
  deck=d;
  pos=0;
  if(keepId){const i=deck.findIndex(c=>c.id===keepId); if(i>=0) pos=i;}
  flipped=false;
  libRand=null;                     // 대상 집합이 바뀌었으니 랜덤 순서도 새로
}
/* ddx는 문자열, a.items는 없을 수 있음 → 예전 .join() 호출은 검색을 통째로 죽였다 */
function haystack(c){
  return [c.name, c.sys, ddxOf(c), mnOf(c),
          ((c.a&&c.a.items)||[]).join(" "),
          (c.script||[]).join(" "),
          c.tests||"", c.edu||"", fbText(c.id),
          (c.bok||[]).map(x=>(x.s||"")+" "+(x.t||"")+" "
            +(x.b||[]).map(p=>(p&&p.tb)?p.tb.map(r=>r.join(" ")).join(" "):p).join(" ")).join(" ")
         ].join(" ").toLowerCase();
}


function chipsHtml(){
  const sysList=[...new Set(CARDS.map(c=>c.sys))];
  let h=`<span class="chip ${set.sys==='all'?'on':''}" data-sys="all">전체 ${CARDS.length}</span>`;
  for(const s of sysList){const n=CARDS.filter(c=>c.sys===s).length;
    h+=`<span class="chip ${set.sys===s?'on':''}" data-sys="${s}">${s} ${n}</span>`;}
  $("chips").innerHTML=h;
  $("chips").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{set.sys=el.dataset.sys; buildDeck(); render();});
}

function progressBar(){
  let k=0,d=0,u=0;
  for(const c of CARDS){const p=prog[c.id]; if(p==="know")k++; else if(p==="dont")d++; else u++;}
  // 답안지 타이밍 마크: 카드 1장 = 눈금 1칸
  $("pbar").innerHTML = CARDS.map(c=>{
    const p=prog[c.id];
    return `<span class="${p==="know"?"know":p==="dont"?"dont":""}" title="${c.name}"></span>`;
  }).join("");
  const pct = CARDS.length ? Math.round((k+d)/CARDS.length*100) : 0;
  $("pstats").innerHTML=
    `<span><b class="acc">${pct}%</b><i>진행률</i></span>`+
    `<span><b>${k}</b><i>외움</i></span>`+
    `<span><b>${d}</b><i>모름</i></span>`+
    `<span><b>${u}</b><i>미평가</i></span>`;
}





/* ── v3: 실전 문진 순서 단계공개 ───────────────────────────── */
/* 복기 공통분 — 시험 운영·SP 총평·트랙·OSCE. 카드에 속하지 않아 따로 둔다.
   ⚠ encrypt_content.js 의 암호화 대상 3번째 블록이다. 이름을 바꾸면 빌더도 함께 고칠 것. */
const STEP_DEFS = [
  {k:"old",   t:"① 주호소 (OLDCoEx)"},
  {k:"c",     t:"② C (성상)"},
  {k:"a",     t:"③ A (동반증상)"},
  {k:"f",     t:"④ F (요인)"},
  {k:"hx",    t:"⑤ 과거력 (E·외·과·약·사·가·여)"},
  {k:"pe",    t:"⑥ P/E"},
  {k:"dx",    t:"⑦ 진단 · 검사 · 교육"},
  {k:"emerg", t:"⑧ 응급"},
  {k:"bok",   t:"⑨ 실제 출제 복기"},
];
const OLD_LABEL = {O:"O 발생",L:"L 위치",D:"D 기간/빈도",Co:"Co 경과",Ex:"Ex 이전",
                   주호소:"주호소", 인적사항:"인적사항"};
const HX_LABEL = {E:"E 검사력",외:"외 외상·수술",과:"과 과거력",약:"약 약물",
                  사:"사 사회력",가:"가 가족력",여:"여 여성력"};

function hasStep(card,k){
  if(k==="old")   return card.old && Object.keys(card.old).length;
  if(k==="hx")    return card.hx  && Object.keys(card.hx).length;
  if(k==="pe")    return card.pe  && Object.keys(card.pe).length;
  if(k==="a")     return card.a && (mnOf(card) || card.a.exp);
  if(k==="dx")    return ddxOf(card) || card.tests || card.edu;   // 사용자가 새로 적은 감별진단도 포함
  if(k==="bok")   return card.bok && card.bok.length;
  return card[k];
}
function stepsOf(card){
  if(card.script && card.script.length) return [{k:"script",t:"진행 스크립트"}];
  return STEP_DEFS.filter(s=>hasStep(card,s.k));
}
function kvHtml(obj,labels){
  return `<div class="kv">`+Object.entries(obj).map(([k,v])=>
    `<div class="kvrow"><b>${labels[k]||k}</b><span>${v}</span></div>`).join("")+`</div>`;
}
/* ── 복기 렌더러 ──────────────────────────────────────────────
   복기본(Jackson_BLVD.docx)을 문단 단위 그대로 싣는다. 요약·재작성 없음.
   s = 출처 주호소(H3) · t = 증례 제목(H4) · b = 문단(문자열) 또는 {tb:[[셀…]…]} 표 */
function bokTb(rows){
  return `<div class="boktb"><table>`+rows.map((r,i)=>
    `<tr>`+r.map(c=>`<${i?"td":"th"}>${esc(c)}</${i?"td":"th"}>`).join("")+`</tr>`).join("")+`</table></div>`;
}
function bokHtml(secs){
  let h="", last=null;
  (secs||[]).forEach(sec=>{
    if(sec.s && sec.s!==last){ h+=`<div class="boks">${esc(sec.s)}</div>`; last=sec.s; }
    if(sec.t) h+=`<div class="bokt">${esc(sec.t)}</div>`;
    h+=(sec.b||[]).map(p=> (p && typeof p==="object" && p.tb) ? bokTb(p.tb)
                           : `<p>${esc(p)}</p>`).join("");
  });
  return `<div class="bok">${h}</div>`;
}
function stepBody(card,k,full){
  if(k==="script") return `<div class="script">`+card.script.map(l=>`<div>${l}</div>`).join("")+`</div>`;
  if(k==="old")    return kvHtml(card.old,OLD_LABEL);
  if(k==="hx")     return kvHtml(card.hx,HX_LABEL);
  if(k==="pe")     return kvHtml(card.pe,{});
  if(k==="c")      return card.c;
  if(k==="f")      return card.f;
  if(k==="emerg")  return `<span class="warn">${card.emerg}</span>`;
  if(k==="bok"){
    /* 공통분(운영·SP 총평·트랙·OSCE)은 카드마다 같은 1벌이라 접어 둔다.
       .step 의 클릭이 단계를 넘기므로 stopPropagation 이 반드시 필요하다. */
    return bokHtml(card.bok)
      + `<div class="bokcw"><span class="toggle" id="bokcT">▸ 공통 — 시험 운영 · SP 총평 · 트랙 · OSCE</span>`
      + `<div id="bokcB" style="display:none">${Object.keys(BOKC).map(g=>bokHtml(BOKC[g])).join("")}</div></div>`;
  }
  if(k==="dx"){
    let h="";
    /* 감별진단은 ddxOf()(=덮어쓰기 반영) + 형광펜을 거쳐 나온다. data-hlt 가 드래그 칠하기 대상 */
    const dd=ddxOf(card);
    if(dd)         h+=`<div class="kvrow"><b>진단</b><span><span data-hlt="ddx">${ddxDisp(card)}</span>`
                     +(ddxEdited(card)?`<span class="mnflag" title="내가 고친 감별진단">✎</span>`:"")+`</span></div>`;
    if(card.tests) h+=`<div class="kvrow"><b>검사</b><span>${card.tests}</span></div>`;
    if(card.edu)   h+=`<div class="kvrow"><b>교육</b><span>${card.edu}</span></div>`;
    return `<div class="kv">${h}</div>`;
  }
  if(k==="a"){
    const st = full ? 3 : ((rv&&rv.a)||1);
    let h=`<div class="mn"><span data-hlt="mn">${mnDisp(card)||"—"}</span>`
          +(mnEdited(card)?`<span class="mnflag" title="내가 고친 말야마">✎</span>`:"")+`</div>`;
    if(st>=2 && card.a.exp) h+=`<div class="aexp">${card.a.exp}</div>`;
    if(st>=3 && card.a.items && card.a.items.length)
      h+=`<div class="asks">`+card.a.items.map(i=>
        `<div class="ask"><b>${i}</b><i>${ASK[i]||"—"}</i></div>`).join("")+`</div>`;
    if(set.two && st<3 && (card.a.exp||(card.a.items||[]).length))
      h+=`<div class="astepwrap"><span class="astep">${st===1?"▾ 확장 보기":"▾ 실제 질문 보기"}</span></div>`;
    return h;
  }
  return "";
}
function resetReveal(){
  rv = {n: set.cover ? 0 : 99, a: set.two ? 1 : 3, skipped:{}};
}
function backHtml(card){
  const steps=stepsOf(card);
  const open = set.cover ? rv.n : steps.length;
  let h=`<div class="steps">`;
  steps.forEach((s,i)=>{
    const isOpen = i<open;
    const isNext = i===open;
    const skipped = rv.skipped && rv.skipped[s.k];
    h+=`<div class="step ${isOpen?"open":"locked"} ${isNext?"next":""} ${skipped?"skipped":""}" data-i="${i}" data-k="${s.k}">
      <h4>${s.t}${isOpen?(skipped?'<span class="lock miss">건너뜀</span>':""):(isNext?'<span class="lock">탭 ▾</span>':'<span class="lock dim">🔒</span>')}</h4>
      ${isOpen?`<div class="body">${stepBody(card,s.k)}</div>`:``}</div>`;
  });
  h+=`</div>`;
  if(set.cover && open<steps.length)
    h+=`<div class="stepbar"><span class="toggle" id="nextStep">다음 단계 ▾ (${open}/${steps.length})</span>
        <span class="toggle" id="allSteps">전체 열기</span></div>`;
  h+=`<div style="text-align:center;margin:6px 0 2px"><span class="toggle" id="reflip">↻ 앞면</span></div>`;
  return h;
}

/* ═══ 진도표 (2026-09-20) ═══════════════════════════════════════
   「2026 국시 준비 체크표」(9/16–10/19 PDF) 의 63주제 × 9/21–10/19(29일).
   칸 = 그날 그 주제를 봤다. 색 = 그 주제를 몇 번째 본 것인지(누적, 5단계).
   ⚠ 이건 CARDS(53장)와 다른 축이다 — 체크표의 63주제를 그대로 쓴다. CARDS.length 를 건드리지 않는다.
   저장: 가상 카드 __jindo 의 **메모(text) 필드**에 JSON 으로 싣는다. fb[JD_ID]={text,ts}.
     → 서버(Apps Script)는 카드ID 를 가리지 않으므로 **무변경**. 필드별 ts 병합·묘비·pend 확인·
       로그아웃 WIPE(LS_FB) 를 전부 기존 경로 그대로 탄다.
     구버전 클라이언트는 이 행을 받아 fb 에 들고만 있고 절대 올리지 않는다
     (keysToItems·bulkBackup 이 CARDS 에 없는 id 를 버린다) → 덮어쓰기 없음.
   병합 단위는 표 전체 1건(last-writer-wins). 두 기기에서 동시에 오프라인으로 칠하면 늦은 쪽이 이긴다. */
const JD_ID="__jindo", JD_CARD={id:JD_ID, name:"진도표"};
const JD_SYS=[
  ["소화기",["급성복통","소화불량-만성복통","토혈","혈변","구토","변비","설사","황달"]],
  ["순환기",["가슴통증","실신","두근거림","고혈압","이상지질혈증"]],
  ["호흡기",["기침","콧물-코막힘","객혈","호흡곤란"]],
  ["비뇨신장-내분비",["다뇨","핍뇨","붉은소변","배뇨이상-소변찔끔증","체중증가"]],
  ["전신증상-근골격",["발열","멍이 잘듦","피로","체중감소","어지럼","관절통-붓기","목통증","허리통증","피부발진"]],
  ["생식-출산-성장발달",["유방통","유방덩이","질분비물","질출혈","월경이상","월경통","산전진찰"]],
  ["신경",["기억력저하","두통","경련","감각이상","근력이상","의식장애","떨림-운동이상"]],
  ["정신",["기분변화","불안","수면장애","물질오남용","자살"]],
  ["상담",["성장-발달지연","예방접종","음주상담","금연상담","나쁜소식전하기","가정폭력","성폭력"]],
];
const JD_TOPICS=JD_SYS.flatMap(g=>g[1]);
const JD_HOLI={"0924":"추석","0925":"추석","0926":"추석","1003":"개천절","1005":"대체공휴일","1009":"한글날"};
const JD_DAYS=(()=>{ const a=[], W="일월화수목금토";
  for(let d=new Date(2026,8,21); d<=new Date(2026,9,19); d.setDate(d.getDate()+1)){
    const k=String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    a.push({k:k, m:d.getMonth()+1, d:d.getDate(), w:d.getDay(), wn:W[d.getDay()]});
  } return a; })();
function jdToday(){ const t=new Date(); return t.getFullYear()===2026
  ? String(t.getMonth()+1).padStart(2,"0")+String(t.getDate()).padStart(2,"0") : (t.getFullYear()<2026?"0000":"9999"); }
/* 저장 형식: {"v":1,"m":{"급성복통":["0921","0923"],...}} — 비었으면 "" (묘비) */
function jdGet(){
  const r=fb[JD_ID]; const out={};
  if(!r||!r.text) return out;
  try{ const o=JSON.parse(r.text); const m=(o&&o.m)||{};
       JD_TOPICS.forEach(t=>{ if(Array.isArray(m[t])) m[t].forEach(k=>{ out[t+"|"+k]=1; }); });
       /* 목록에 없는 주제(나중에 이름이 바뀐 경우)도 버리지 않는다 */
       Object.keys(m).forEach(t=>{ if(JD_TOPICS.indexOf(t)<0 && Array.isArray(m[t])) m[t].forEach(k=>{ out[t+"|"+k]=1; }); });
  }catch(e){}
  return out;
}
function jdPut(marks){
  const m={};
  Object.keys(marks).forEach(key=>{ const i=key.lastIndexOf("|"); const t=key.slice(0,i), k=key.slice(i+1);
    (m[t]=m[t]||[]).push(k); });
  Object.keys(m).forEach(t=>m[t].sort());
  const ord={}; JD_TOPICS.forEach(t=>{ if(m[t]) ord[t]=m[t]; }); Object.keys(m).forEach(t=>{ if(!ord[t]) ord[t]=m[t]; });
  const text=Object.keys(ord).length ? JSON.stringify({v:1,m:ord}) : "";
  fb[JD_ID]={text:text, ts:srvNow()};        // 비워도 ts 를 남긴다 = 묘비(다른 기기의 옛 표가 안 되살아난다)
  fbSaveLS();
  dirtyMark(JD_ID,"text"); pushSoon();       // 평가·태그와 같은 1.2초 모아보내기
}
function renderJindo(){
  const sc=document.querySelector(".jd-scroll");
  const keep=sc?{l:sc.scrollLeft,t:sc.scrollTop}:null;
  const today=jdToday();
  let h=`<div class="jd"><div class="jd-top"><h2>진도표</h2><span class="rng">2026.09.21 – 10.19 · 29일 · ${JD_TOPICS.length}주제</span></div>
    <div class="jd-stats" id="jdStats"></div><div class="jd-sys" id="jdSys"></div>
    <div class="jd-leg"><span>칸 색 = 그 주제를 몇 번째 봤는지</span>
      <span class="ramp"><span style="background:var(--jd1);color:var(--jd-lo)">1</span><span style="background:var(--jd2);color:var(--jd-lo)">2</span><span style="background:var(--jd3);color:var(--jd-hi)">3</span><span style="background:var(--jd4);color:var(--jd-hi)">4</span><span style="background:var(--jd5);color:var(--jd-hi)">5+</span></span>
      <span>다시 누르면 취소 · 맨 아랫줄 = 그날 본 주제 수</span></div>
    <div class="jd-scroll"><table><thead><tr><th class="c1">분류</th><th class="c2">주제</th>`;
  JD_DAYS.forEach(D=>{
    const cls=["d", D.w===6?"sat":"", (D.w===0||JD_HOLI[D.k])?"sun":"", D.k===today?"today":""].join(" ");
    h+=`<th class="${cls}"${JD_HOLI[D.k]?` title="${JD_HOLI[D.k]}"`:""}>${D.m}/${D.d}<span class="w">${D.wn}</span></th>`;
  });
  h+=`</tr></thead><tbody>`;
  JD_SYS.forEach(([g,ts])=>ts.forEach((t,i)=>{
    h+=`<tr${i===0?' class="gs"':""}>`;
    if(i===0) h+=`<td class="c1" rowspan="${ts.length}">${g}</td>`;
    h+=`<td class="c2"><span class="t"><span>${t}</span><span class="cnt"></span></span></td>`;
    JD_DAYS.forEach(D=>{
      const we=D.w===0||D.w===6||!!JD_HOLI[D.k];
      h+=`<td class="x${we?" we":""}${D.k===today?" today":""}" tabindex="0" role="checkbox" aria-checked="false" aria-label="${t} ${D.m}월 ${D.d}일" data-t="${t}" data-k="${D.k}"></td>`;
    });
    h+=`</tr>`;
  }));
  h+=`</tbody><tfoot><tr><td class="c1"></td><td class="c2">하루 합계</td>`;
  JD_DAYS.forEach(D=>{ h+=`<td class="dt" data-k="${D.k}"></td>`; });
  h+=`</tr></tfoot></table></div>
    <div class="jd-note">공휴일(빨강): 추석 9/24–26 · 개천절 10/3 · 대체공휴일 10/5 · 한글날 10/9 · 기록은 시트에 같이 백업돼요</div></div>`;
  $("main").innerHTML=h;
  const nsc=document.querySelector(".jd-scroll");
  const tb=nsc.querySelector("table");
  tb.onclick=e=>{ const td=e.target.closest("td.x"); if(td) jdToggle(td); };
  tb.onkeydown=e=>{ const td=e.target.closest("td.x"); if(!td) return;
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); jdToggle(td); } };
  jdPaint();
  if(keep){ nsc.scrollLeft=keep.l; nsc.scrollTop=keep.t; }
  else{ const th=nsc.querySelector("th.today"); if(th) nsc.scrollLeft=Math.max(0,th.offsetLeft-230); }
}
function jdToggle(td){
  const marks=jdGet(), key=td.dataset.t+"|"+td.dataset.k;
  if(marks[key]) delete marks[key]; else marks[key]=1;
  jdPut(marks); jdPaint();
}
function jdPaint(){
  const tb=document.querySelector(".jd table"); if(!tb) return;
  const marks=jdGet(), today=jdToday();
  const dayTot={}, topTot={};
  JD_DAYS.forEach(D=>dayTot[D.k]=0);
  const rows=tb.tBodies[0].rows;
  let ti=0;
  for(const tr of rows){
    const t=JD_TOPICS[ti++]; let run=0;
    tr.querySelectorAll("td.x").forEach(td=>{
      if(marks[t+"|"+td.dataset.k]){ run++; dayTot[td.dataset.k]++;
        td.dataset.l=Math.min(run,5); td.textContent=run; td.setAttribute("aria-checked","true"); }
      else{ delete td.dataset.l; td.textContent=""; td.setAttribute("aria-checked","false"); }
    });
    topTot[t]=run;
    const c=tr.querySelector(".cnt"); c.textContent=run?run+"회":"–"; c.classList.toggle("on",run>0);
  }
  const mx=Math.max(1,...Object.values(dayTot));
  tb.tFoot.querySelectorAll("td.dt").forEach(td=>{
    const n=dayTot[td.dataset.k], l=n?Math.max(1,Math.ceil(n/mx*5)):0;
    td.textContent=n||""; td.style.background=l?`var(--jd${l})`:""; td.style.color=l>=3?"var(--jd-hi)":"var(--jd-lo)";
  });
  const N=JD_TOPICS.length, tot=Object.values(topTot).reduce((a,b)=>a+b,0);
  const cov=JD_TOPICS.filter(t=>topTot[t]>0).length, two=JD_TOPICS.filter(t=>topTot[t]>=2).length;
  let idx=JD_DAYS.findIndex(D=>D.k===today); if(idx<0 && today>JD_DAYS[JD_DAYS.length-1].k) idx=JD_DAYS.length-1;
  let streak=0;
  if(idx>=0){ let i=idx; if(!dayTot[JD_DAYS[i].k]) i--; for(;i>=0&&dayTot[JD_DAYS[i].k];i--) streak++; }
  const left = today<JD_DAYS[0].k ? "9/21 시작" : (JD_DAYS.findIndex(D=>D.k===today)>=0 ? `${JD_DAYS.length-1-idx}일 남음` : "기간 종료");
  const tDone=dayTot[today];
  const pc=n=>Math.round(n/N*100);
  $("jdStats").innerHTML=`
    <div class="jd-stat"><span class="k">한 번 이상 본 주제</span><span class="v">${cov}<small>/ ${N}</small></span><div class="jd-bar"><span style="width:${pc(cov)}%"></span></div></div>
    <div class="jd-stat"><span class="k">2회 이상 본 주제</span><span class="v">${two}<small>/ ${N}</small></span><div class="jd-bar"><span style="width:${pc(two)}%"></span></div></div>
    <div class="jd-stat"><span class="k">누적 체크</span><span class="v">${tot}<small>칸</small></span></div>
    <div class="jd-stat"><span class="k">오늘</span><span class="v">${tDone===undefined?"–":tDone}<small>${tDone===undefined?"":"주제"}</small></span></div>
    <div class="jd-stat"><span class="k">연속 공부</span><span class="v">${streak}<small>일 · ${left}</small></span></div>`;
  $("jdSys").innerHTML=JD_SYS.map(([g,ts])=>{ const c=ts.filter(t=>topTot[t]>0).length;
    return `<div><span>${g}</span><span class="n">${c}/${ts.length}</span><div class="jd-bar"><span style="width:${Math.round(c/ts.length*100)}%"></span></div></div>`; }).join("");
}

/* ═══ 뷰 분기 ═══ */
/* 자동갱신(2분 주기·다른 탭 변경)으로 다시 그릴 때는 스크롤 위치를 지킨다.
   사용자 조작으로 부른 render() 는 종전대로 맨 위로 올라간다. */
let _keepScroll=false, _lastRendered="";   // 마지막으로 그린 "뷰|카드|앞뒤" — 스크롤 유지 판단용
function renderKeep(){ _keepScroll=true; try{ render(); } finally{ _keepScroll=false; } }
function render(){
  fbFlush(); mnFlush(); ddxFlush();              // 이동 전 입력중이던 메모·말야마·감별진단 확정
  const v = (set.view==="lib"||set.view==="print"||set.view==="jindo") ? set.view : "card";
  set.view=v;
  /* 라이브러리에 "들어올 때"마다 랜덤 순서를 새로 만든다(순서 암기 방지).
     라이브러리 안에서 표시 토글만 눌렀을 때는 다시 안 섞는다. */
  if(v==="lib" && _lastView!=="lib") libRand=null;
  _lastView=v;
  ["card","lib","print","jindo"].forEach(x=>document.body.classList.toggle("v-"+x,v===x));
  chipsHtml(); progressBar(); syncChrome();
  if(v==="lib"){ renderLib(); save(); return; }
  if(v==="print"){ renderPrint(); save(); return; }
  if(v==="jindo"){ renderJindo(); save(); return; }
  renderCard();
}
function syncChrome(){
  [["tCover","cover"],["tTwo","two"],["tShuf","shuf"]].forEach(([id,k])=>$(id).classList.toggle("on",set[k]));
  $("fAll").classList.toggle("on",set.filter==="all");
  $("fDont").classList.toggle("on",set.filter==="dont");
  $("fUn").classList.toggle("on",set.filter==="unrated");
  if($("search").value!==set.search) $("search").value=set.search;
  $("vsw").querySelectorAll("span").forEach(el=>el.classList.toggle("on",el.dataset.view===set.view));
}

/* ── 카드 뷰 (기존 render 본문) ── */
function renderCard(){
  if(deck.length===0){
    $("main").innerHTML=`<div class="empty">조건에 맞는 카드가 없어요.<br>필터·검색을 바꿔보세요.</div>`;
    $("pos").textContent="0 / 0"; updateRate(); save(); return;
  }
  if(pos>=deck.length) pos=deck.length-1;
  const card=deck[pos];
  set.id=card.id;
  const p=prog[card.id];
  const badge = p==="know"?`<span class="badge know">✓ 외움</span>`
              : p==="dont"?`<span class="badge dont">✗ 모름</span>`
              : `<span class="badge">미평가</span>`;
  let html=`<div class="meta"><span>${card.sys}</span>${badge}</div>`+tagbarHtml(card);

  if(!flipped){
    html+=`<div class="frontwrap"><div class="front" id="front">
      <div class="sym">${card.name}</div>
      <div class="hint">탭하거나 Space → 뒤집기</div></div></div>`;
  }else{
    html+=backHtml(card);
    }
  /* 말야마는 ③A 안의 내용이라 그 단계가 열린 뒤에만 편집칸을 보여준다 */
  if(flipped && mnVisible(card)) html+=mnHtml(card);
  /* 감별진단은 ⑦ 안의 내용이라 같은 논리로 ⑦ 공개 뒤에만 */
  if(flipped && ddxVisible(card)) html+=ddxHtml(card);
  html+=fbHtml(card);
  /* 스크롤 유지 규칙:
     같은 카드의 같은 면을 다시 그리는 것이면(저장·태그·단계열기·자동갱신 등)
     보고 있던 위치를 그대로 둔다. 카드가 바뀌거나 앞뒤를 뒤집을 때만 맨 위로 올린다.
     — 아래로 내려서 메모를 쓰다 저장을 누르면 위로 튀던 문제. */
  const _rkey=set.view+"|"+card.id+"|"+(flipped?"b":"f");
  const keepTop=(_keepScroll||_rkey===_lastRendered)?$("main").scrollTop:0;
  $("main").innerHTML=html;
  $("main").scrollTop=keepTop;
  _lastRendered=_rkey;

  if(!flipped){ $("front").onclick=()=>{flipped=true; resetReveal(); render();}; }
  else{
    $("reflip").onclick=()=>{flipped=false; render();};
    $("main").querySelectorAll(".step").forEach(el=>el.onclick=()=>{
      /* 형광펜을 칠하려고 글자를 드래그하면 마우스를 떼는 순간 이 클릭이 발동한다.
         그러면 단계가 넘어가고 render() 가 돌아 방금 잡은 선택이 눈앞에서 사라진다.
         → 이 안에 살아 있는 선택이 있으면 단계 조작을 하지 않는다. */
      const sel=window.getSelection();
      if(sel && !sel.isCollapsed && String(sel.toString()||"").trim()
         && el.contains(sel.anchorNode)) return;
      const steps=stepsOf(card), i=+el.dataset.i, k=el.dataset.k;
      if(k==="a" && i<rv.n){ rv.a=set.two?Math.min(rv.a+1,3):3; render(); return; }
      if(i<rv.n) return;
      for(let x=rv.n;x<i;x++) rv.skipped[steps[x].k]=true;   // 건너뛴 단계 표시
      rv.n=i+1; render();
    });
    const ns=$("nextStep"); if(ns) ns.onclick=()=>{rv.n=Math.min(rv.n+1,stepsOf(card).length); render();};
    const as=$("allSteps"); if(as) as.onclick=()=>{rv.n=stepsOf(card).length; render();};
    const bt=$("bokcT"); if(bt) bt.onclick=e=>{
      e.stopPropagation();                       // 단계 진행 클릭과 분리
      const b=$("bokcB"), on=b.style.display==="none";
      b.style.display=on?"":"none";
      bt.textContent=(on?"▾":"▸")+" 공통 — 시험 운영 · SP 총평 · 트랙 · OSCE";
    };
  }
  bindTag(card);
  bindMn(card);
  bindDdx(card);
  bindFb(card);
  $("pos").textContent=`${pos+1} / ${deck.length}`;
  updateRate(); save();
}

/* ── 컬러태그 버튼 4개 (앞/뒤 상관없이 항상) ── */
function tagbarHtml(card){
  const cur=tagOf(card);
  return `<div class="tagbar"><span class="lab">난이도</span>`
    +TAGS.map(t=>`<span class="tagbtn ${cur===t.v?"on":""}" data-tag="${t.v}">${t.e} ${t.n}</span>`).join("")
    +`</div>`;
}
function bindTag(card){
  $("main").querySelectorAll(".tagbtn").forEach(el=>el.onclick=()=>{
    const v=el.dataset.tag;
    tagCommit(card, (v && tagOf(card)===v) ? "" : v);   // 같은 걸 다시 누르면 해제
    render();
  });
}

/* ── 말야마 편집 UI (③A 공개 뒤에만 노출) ── */
/* 편집칸은 그 내용이 들어 있는 단계가 공개된 뒤에만 보인다 (③A → 말야마, ⑦ → 감별진단) */
function stepVisible(card,k){
  if(!set.cover) return true;                 // 가림 끄면 항상
  const steps=stepsOf(card), ai=steps.findIndex(s=>s.k===k);
  const open=rv?rv.n:0;
  return ai>=0 ? open>ai : open>=steps.length;   // 해당 단계가 없는 스크립트 카드는 전부 연 뒤
}
const mnVisible =card=>stepVisible(card,"a");
const ddxVisible=card=>stepVisible(card,"dx");

/* ── 형광펜 UI: 드래그 선택 → 색 버튼 ──
   버튼 클릭 순간 선택이 풀리는 브라우저가 있어, selectionchange 로 마지막 선택을 붙잡아 둔다. */
/* 선택은 "어느 카드의" 선택인지까지 기록한다 — 카드를 넘긴 뒤 펜을 누르면
   엉뚱한 카드의 문자열이 칠해지기 때문이다. */
let _sel={f:null,t:"",id:null};
document.addEventListener("selectionchange",()=>{
  const s=window.getSelection();
  if(!s||s.isCollapsed||!s.rangeCount) return;   // 빈 선택이면 직전 값을 유지한다
  const t=String(s.toString()||"").trim();
  if(!t) return;
  if(set.view!=="card") return;                  // 카드 뷰에서만 칠한다
  let n=s.getRangeAt(0).commonAncestorContainer;
  if(n&&n.nodeType===3) n=n.parentNode;
  const host=(n&&n.closest)?n.closest("[data-hlt]"):null;
  if(!host) return;                              // 칠할 수 있는 영역 밖의 선택은 무시
  if(host.closest(".pcard")) return;             // 프린트 뷰의 data-hlt 는 대상이 아니다
  const cur=deck[pos];
  _sel={f:host.getAttribute("data-hlt"), t:t, id:(cur&&cur.id)||null};
});
function penHtml(f){
  return `<span class="pen" data-penf="${f}"><span class="lab">형광펜</span>`
    +`<span class="penbtn y" data-pen="y" title="노랑으로 칠하기 (같은 곳 다시 선택+노랑 = 해제)"></span>`
    +`<span class="penbtn p" data-pen="p" title="분홍으로 칠하기 (같은 곳 다시 선택+분홍 = 해제)"></span>`
    +`<span class="penbtn x" data-pen="x" title="선택 영역의 형광펜 지우기">지우기</span></span>`;
}
/* 각 필드의 편집칸. 펜 버튼이 이 칸 바로 아래에 있으므로
   "칠할 글자도 이 칸에서 고르는" 게 자연스럽다 — 위 표시 영역까지 올라갈 필요가 없다. */
const TA_ID={mn:"mnText", ddx:"ddxText", fb:"fbText"};
/* textarea 안의 선택은 Selection API 로 안 잡힌다(selectionchange 가 못 본다).
   selectionStart/End 로 직접 읽어야 한다 — 이게 편집칸에서 칠하기가 되는 유일한 길이다. */
function taSelOf(f){
  const ta=document.getElementById(TA_ID[f]);
  if(!ta) return "";
  const a=ta.selectionStart, b=ta.selectionEnd;
  if(a==null || b==null || a===b) return "";
  return String(ta.value.slice(a,b)).trim();
}
function bindPen(card,f,msgId){
  const msg=t=>{ const m=$(msgId); if(m) m.textContent=t; };
  $("main").querySelectorAll('.pen[data-penf="'+f+'"] [data-pen]').forEach(el=>{
    el.onmousedown=e=>e.preventDefault();        // 클릭으로 선택이 풀리지 않게
    el.onclick=()=>{
      /* 타이핑 디바운스(400ms)를 먼저 확정한다. 두 가지를 동시에 해결한다:
         ① 아래 render() 가 입력칸을 새로 그릴 때 방금 친 글자가 날아가지 않는다
         ② 칠 대상 원문(mnOf/ddxOf/fbText)이 편집칸의 현재 내용과 일치하게 된다
            — 안 맞추면 방금 타이핑한 글자를 선택해 칠할 때 "원문에 없다"고 거부된다 */
      fbFlush(); mnFlush(); ddxFlush();
      const ta=document.getElementById(TA_ID[f]);
      const keep=ta?{a:ta.selectionStart,b:ta.selectionEnd,focus:document.activeElement===ta}:null;
      /* 어느 쪽 선택을 쓸지 — 순서가 중요하다.
         textarea 의 selectionStart/End 는 **포커스를 잃어도 남고**, 칠한 뒤 일부러 복원까지
         하므로, 무조건 편집칸을 우선하면 "위쪽에서 새로 드래그했는데 편집칸의 묵은 선택이
         이겨서 엉뚱한 칠이 조용히 벗겨지는" 일이 생긴다.
         펜 버튼은 mousedown 을 막아 포커스를 안 뺏으므로, 지금 편집칸에 포커스가 있는지로
         "방금 어디서 골랐는지"를 정확히 가를 수 있다. */
      const focused=(ta && document.activeElement===ta);
      let sel=focused?taSelOf(f):"";
      if(!sel && _sel.f===f && _sel.t && _sel.id===card.id) sel=_sel.t;
      if(!sel) sel=taSelOf(f);                   // 포커스가 이미 풀린 경우의 최후 수단
      if(!sel){ msg("칠할 글자를 드래그해 선택한 뒤 누르세요"); return; }
      if(hlToggle(card,f,sel,el.dataset.pen)){
        hlCommit(card);
        _sel={f:null,t:"",id:null};              // 해제하려면 다시 선택하게 한다
        render();
        /* 선택을 되살려 연달아 색을 바꾸거나 지울 수 있게 한다
           (render 가 textarea 를 새로 만들어 선택이 풀리기 때문) */
        if(keep){ const t2=document.getElementById(TA_ID[f]);
          if(t2){ try{ t2.setSelectionRange(keep.a,keep.b); if(keep.focus) t2.focus(); }catch(e){} } }
        const m=$(msgId);
        if(m) m.textContent="형광펜 반영됨"+sheetNote();
      }else if(_hlWhy==="overlap"){
        msg("‘"+sel.slice(0,12)+"’ 은(는) 이미 칠해진 곳과 겹쳐요");
      }else{
        msg("‘"+sel.slice(0,12)+"’ 은(는) 지금 원문에서 찾을 수 없어요");
      }
    };
  });
}

let libTop=0, _libRO=null, _fitting=false, _roPrimed=false;
function tileHtml(c){

  const on={name:!!set.libName, mn:!!set.libMn, ddx:!!set.libDdx, fb:!!set.libFb};
  if(!on.name&&!on.mn&&!on.ddx&&!on.fb) on.name=true;      // 전부 끄면 제목이라도
  const mn=mnOf(c), ddx=ddxOf(c), f=fbText(c.id);
  const tg=tagOf(c);
  /* 태그는 "왼쪽 안쪽 띠(.tg-*)"로만 칠한다 — 테두리색(외움/모름)과 절대 안 섞이게 */
  const tgc=tg?` tg tg-${tg}`:"";

  let h=`<div class="tile ${p}${tgc}" data-id="${esc(c.id)}"><div class="tsys">${esc(c.sys)}`
       +(tg?`<span class="tgm">${tagEmoji(tg)}</span>`:``)+edFlag+`</div>`;
  if(on.name && on.mn)  h+=`<div class="tname">${esc(c.name)}</div>`;
  if(on.mn){
    // 말야마가 빈 카드(상담·산전진찰 등)는 대체 문구로 타일 유지
    h+=`<div class="cell hero" title="${esc(mn||c.name)}">`+(mn?`<span>${mnDisp(c)}</span>`
        :`<span class="mnempty">${on.name?"—":esc(c.name)}</span>`)+`</div>`;
  }else if(on.name){
    h+=`<div class="cell hero" title="${esc(c.name)}"><span>${esc(c.name)}</span></div>`;   // 말야마 끄면 제목이 주인공
  }
  if(on.ddx) h+=`<div class="cell tddx" title="${esc(ddx||"")}"><span>${ddx?ddxDisp(c):"—"}</span></div>`;
  if(on.fb)  h+=`<div class="cell tfb" title="${esc(f||"")}"><span>${f?fbDisp(c):"—"}</span></div>`;
  return h+`</div>`;
}
/* 라이브러리 탭: 전체 │ 🔴 │ 🟡 │ 🟢 │ 랜덤.
   기존 계통 칩·검색·모름만/미평가만 필터로 이미 좁혀진 deck 위에 "교집합"으로 얹는다.
   랜덤은 라이브러리에 들어올 때마다 새로 섞는다(libRand=null 이면 다시 섞음). */
const LIBTABS=[{v:"all",l:"전체"},{v:"hard",l:"🔴"},{v:"mid",l:"🟡"},{v:"easy",l:"🟢"},{v:"rand",l:"랜덤"}];
function libList(){
  const t=set.libTab||"all";
  if(t==="hard"||t==="mid"||t==="easy") return deck.filter(c=>tagOf(c)===t);
  if(t==="rand"){
    if(!libRand || libRand.length!==deck.length) libRand=shuffle(deck.map(c=>c.id));
    const by={}; deck.forEach(c=>by[c.id]=c);
    return libRand.map(id=>by[id]).filter(Boolean);
  }
  return deck;
}
function renderLib(){
  const tog=(k,label)=>`<span class="toggle ${set[k]?"on":""}" data-lib="${k}">${label}</span>`;
  const list=libList();
  let h=`<div class="cbar">
    <span class="libtabs">`
    +LIBTABS.map(t=>`<span class="${set.libTab===t.v?"on":""}" data-libtab="${t.v}">${t.l}</span>`).join("")
    +`</span><span class="sep"></span>
    <span class="lab">표시</span>${tog("libName","제목")}${tog("libMn","말야마")}${tog("libDdx","감별진단")}${tog("libFb","피드백")}
    <span class="sep"></span><span class="lab">열</span>`
    +[2,3,4].map(n=>`<span class="toggle ${set.cols===n?"on":""}" data-cols="${n}">${n}</span>`).join("")
    +`<span class="cnt">${list.length}장 · 3행 고정</span></div>
    <div class="libscroll" id="libscroll">`
    +(list.length?`<div class="grid" id="libgrid" style="--cols:${set.cols}">${list.map(tileHtml).join("")}</div>`
                 :`<div class="empty">조건에 맞는 카드가 없어요.<br>탭·필터·검색을 바꿔보세요.</div>`)
    +`</div>`;
  $("main").innerHTML=h;
  $("main").querySelectorAll("[data-libtab]").forEach(el=>el.onclick=()=>{
    const v=el.dataset.libtab;
    if(v==="rand") libRand=null;            // 랜덤 탭은 누를 때마다 다시 섞는다
    set.libTab=v; libTop=0; render();
  });
  $("main").querySelectorAll("[data-lib]").forEach(el=>el.onclick=()=>{ set[el.dataset.lib]=!set[el.dataset.lib]; render(); });
  $("main").querySelectorAll("[data-cols]").forEach(el=>el.onclick=()=>{ set.cols=+el.dataset.cols; render(); });
  $("main").querySelectorAll(".tile").forEach(el=>el.onclick=()=>{
    const i=deck.findIndex(c=>c.id===el.dataset.id);
    if(i>=0) pos=i;
    flipped=false; resetReveal(); set.view="card"; render();
  });
  const sc=$("libscroll");
  if(sc){
    sc.scrollTop=libTop;
    sc.onscroll=()=>{ libTop=sc.scrollTop; };
    if(_libRO) _libRO.disconnect();
    /* observe() 는 등록 직후 초기 콜백을 한 번 준다. 바로 아래 fitLib() 와 겹쳐
       렌더마다 이분탐색이 2회 돌았다 → 첫 콜백은 흘려보낸다. */
    if(window.ResizeObserver){
      _roPrimed=false;
      _libRO=new ResizeObserver(()=>{ if(!_roPrimed){ _roPrimed=true; return; } fitLibSoon(); });
      _libRO.observe(sc);
    }
  }
  fitLib();
}
/* 창 크기 변경·확대축소는 연속으로 쏟아진다 — 마지막 한 번만 계산한다 */
let _fitT=null;
function fitLibSoon(){ clearTimeout(_fitT); _fitT=setTimeout(fitLib,120); }
/* 보이는 스크롤 영역 높이를 실측해 정확히 3행으로 등분.
   창 크기·브라우저 확대축소(⌘+/−)가 바뀌어도 ResizeObserver가 다시 잡는다. */
function fitLib(){
  if(_fitting) return;
  const sc=$("libscroll"), g=$("libgrid");
  if(!sc||!g) return;
  _fitting=true;
  try{
    const cs=getComputedStyle(sc);
    const padv=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
    const gap=parseFloat(getComputedStyle(g).rowGap)||0;
    const rows=3;
    const rowh=(sc.clientHeight - padv - gap*(rows-1))/rows;
    g.style.setProperty("--rowh", Math.max(56,rowh)+"px");
    fitTiles();
  }finally{ _fitting=false; }
}
/* 칸(.cell)마다 글자를 제 칸에 들어가는 최대 크기로 맞춘다(잘림 방지). 이분탐색 9회.
   상한은 칸 종류별로 다르다 — 말야마/제목은 26px, 감별·피드백은 13px.
   피드백은 최소 3줄이 읽혀야 하므로 하한을 "칸높이 ÷ 3줄"까지 낮춘다.
   200자짜리 초장문은 1/9 화면에 온전히 넣는 게 물리적으로 불가능하므로
   하한까지 줄이고도 남으면 하단 페이드로 "더 있음"을 알린다(하드 컷 금지). */
const FB_MINLINES=3;
function fitTiles(){
  document.querySelectorAll(".tile .cell").forEach(box=>{
    const sp=box.firstElementChild; if(!sp) return;
    const cs=getComputedStyle(box);
    const H=box.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0);
    const W=box.clientWidth -(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);
    if(H<=0||W<=0) return;
    const isHero=box.classList.contains("hero");
    const lh=isHero?1.3:1.34;                 // CSS의 line-height와 맞춰둘 것
    let lo,hi;
    if(isHero){ lo=7; hi=Math.max(8,Math.min(26,H*0.62)); }
    else{
      hi=Math.max(7,Math.min(13,H/lh));       // 한 줄도 안 들어갈 만큼 낮은 칸이면 더 줄임
      // 피드백은 3줄 확보가 우선 — 하한을 칸높이/3줄까지 내린다
      lo=box.classList.contains("tfb")?Math.max(5,Math.min(7,H/(FB_MINLINES*lh))):7;
      if(hi<lo) hi=lo;
    }
    const fits=()=>sp.scrollHeight<=H+0.5 && sp.scrollWidth<=W+0.5;
    let best=lo;
    for(let i=0;i<9;i++){
      const mid=(lo+hi)/2;
      sp.style.fontSize=mid+"px";
      if(fits()){ best=mid; lo=mid; } else hi=mid;
    }
    // 내림으로 확정 — 반올림하면 방금 통과한 크기보다 커져 헛페이드가 뜬다
    sp.style.fontSize=(Math.floor(best*10)/10)+"px";
    box.classList.toggle("clip", !fits());
  });
}
window.addEventListener("resize",()=>{ if(set.view==="lib") fitLibSoon(); });

function renderPrint(){

  const tgt=(v,label)=>`<span class="toggle ${set.pTarget===v?"on":""}" data-ptarget="${v}">${label}</span>`;
  const sysList=[...new Set(CARDS.map(c=>c.sys))];
  const list=printSet();
  let h=`<div class="cbar">
    <span class="lab">포함</span>${tog("pTitle","제목")}${tog("pMn","말야마")}${tog("pDdx","감별진단")}${tog("pFb","피드백")}${tog("pFull","8단계 전문")}
    <span class="sep"></span><span class="lab">대상</span>${tgt("all","전체")}${tgt("dont","모름만")}${tgt("fb","피드백만")}
    <select class="sel" id="pSysSel"><option value="all">계통 전체</option>`
    +sysList.map(s=>`<option value="${esc(s)}"${set.pSys===s?" selected":""}>${esc(s)}</option>`).join("")
    +`</select>
    <span class="sep"></span><span class="lab">배치</span>`
    +[1,2,3].map(n=>`<span class="toggle ${set.pCols===n?"on":""}" data-pcols="${n}">${n}단</span>`).join("")
    +`<span class="sep"></span><span class="toggle" id="pGo">🖨 인쇄</span>
    <span class="cnt">${list.length}장</span></div>
    <div class="prscroll">`
    +(list.length?`<div id="printdoc" class="c${set.pCols}">${list.map(pcardHtml).join("")}</div>`
                 :`<div class="empty">조건에 맞는 카드가 없어요.</div>`)
    +`</div>`;
  $("main").innerHTML=h;
  $("main").querySelectorAll("[data-pr]").forEach(el=>el.onclick=()=>{ set[el.dataset.pr]=!set[el.dataset.pr]; render(); });
  $("main").querySelectorAll("[data-ptarget]").forEach(el=>el.onclick=()=>{ set.pTarget=el.dataset.ptarget; render(); });
  $("main").querySelectorAll("[data-pcols]").forEach(el=>el.onclick=()=>{ set.pCols=+el.dataset.pcols; render(); });
  $("pSysSel").onchange=e=>{ set.pSys=e.target.value; render(); };
  $("pGo").onclick=()=>window.print();
}

function updateRate(){
  const card=deck[pos]; const p=card?prog[card.id]:null;
  $("bKnow").classList.toggle("act",p==="know");
  $("bDont").classList.toggle("act",p==="dont");
}
function rate(v){
  if(!deck.length) return;
  const card=deck[pos];
  prog[card.id] = (prog[card.id]===v)?undefined:v;
  if(prog[card.id]===undefined) delete prog[card.id];
  progCommit(card);                  // 진도도 기기 간 동기화 대상
  /* 모름만/미평가만 모드에서는 방금 평가한 카드가 조건에서 빠질 수 있다.
     buildDeck() 은 pos 를 0 으로 되돌리므로(=첫 카드로 튐) 자리를 직접 잡아준다.
       - 아직 덱에 남아 있으면 그 카드 그대로
       - 빠졌으면 같은 인덱스 = 그 자리로 당겨온 "다음 카드" */
  if(set.filter==="dont"||set.filter==="unrated"){
    const id=card.id, at=pos;
    buildDeck();
    const i=deck.findIndex(c=>c.id===id);
    if(i>=0) pos=i;
    else if(deck.length){ pos=Math.min(at,deck.length-1); flipped=false; resetReveal(); }
    else pos=0;
  }
  render();
}
function go(n){ if(!deck.length) return; pos=(pos+n+deck.length)%deck.length; flipped=false; render(); }

document.addEventListener("keydown",e=>{
  const g=document.getElementById("gate"); if(g && !g.classList.contains("hidden")) return;
  const ae=document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;   // 메모 입력 중 단축키 차단
  /* 로그아웃 확인 중에는 뒤쪽 조작을 막는다 — "백업 완료"를 띄운 뒤에 새 평가를 찍으면
     그건 확인되지 않은 채로 지워진다 */
  const _ob=document.getElementById("outbox");
  if(_ob && !_ob.classList.contains("hidden")) return;
  if(set.view!=="card") return;                                    // 카드 뷰에서만
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.key===" "){e.preventDefault(); if(!flipped){flipped=true;resetReveal();} else flipped=false; render();}
  else if(e.key==="ArrowUp"){ if(flipped){const c=deck[pos]; if(c){rv.n=stepsOf(c).length; rv.a=3; render();}} }
  else if(e.key==="ArrowDown"){ if(flipped){const c=deck[pos]; if(c){rv.n=Math.min(rv.n+1,stepsOf(c).length); render();}} }
  else if(e.key==="1")rate("know");
  else if(e.key==="2")rate("dont");
});

// ── 입장 게이트 ──
const GATE_KEY="cpx_session";

/* ── 로그아웃 ─────────────────────────────────────────────────
   localStorage 는 기기 단위고 이름으로 나뉘어 있지 않다. 시트 행 키만 (이름, 카드ID) 다.
   그래서 세션만 비우면 다음 사람 화면에 앞사람 기록이 그대로 뜨고,
   그 사람이 카드를 건드리는 순간 dirty 가 **그 사람 이름으로** 시트에 올라간다.
   → 학습 데이터를 통째로 지운다.

   ⚠️ 반쯤 지우면 안 지우느니만 못하다. 이 앱은 "빈 값 + 시각"을 묘비(=지웠음)로 쓰므로,
   값만 지우고 ts 를 남기면 (예: cpx_progress 는 지우고 cpx_progress_ts 를 남기면)
   fieldPayload 가 {prog:"", ts} 를 만들어 **다음 사람의 시트 기록을 지워버린다.**
   그래서 목록을 손으로 적지 않고 상수에서 끌어와 짝이 빠질 수 없게 한다. */
const WIPE_KEYS=[LS_PROG,LS_PTS,LS_FB,LS_MN,LS_DDX,LS_TAG,LS_HL,
                 LS_DIRTY,LS_PEND,LS_FBQ,LS_SKEW,LS_OK,GATE_KEY,LS_OWNER];
/* LS_SET(cpx_settings)은 남긴다 — 뷰·테마 취향이라 개인 학습기록이 아니다 */

/* 아직 시트로 안 나간 건수. dirty·pending·재시도큐를 모두 센다 */
/* 아직 시트로 못 나간 **(카드,필드) 가짓수**. 단순 합산은 크게 부풀려진다 —
   같은 편집 1건이 pend 에도 있고 재시도큐에도 있고, retryPending() 이 실패할 때마다
   bulk 봉투가 큐에 하나씩 더 쌓이기 때문이다(취소·재시도할수록 숫자가 늘어난다).
   경고가 "기다렸다 다시 시도"를 권하는데 시도할수록 숫자가 커지면 사용자가 겁먹는다.
   → 키로 모아 중복을 없앤다. */
function unsentCount(){
  if(!SHEET) return 0;
  const seen={};
  Object.keys(dirty).forEach(k=>{ seen[k]=1; });
  Object.keys(pend).forEach(k=>{ seen[k]=1; });
  let q=[]; try{ q=JSON.parse(localStorage.getItem(LS_FBQ)||"[]")||[]; }catch(e){ q=[]; }
  q.forEach(p=>{
    if(!p||typeof p!=="object") return;
    const items=Array.isArray(p.bulk)?p.bulk:[p];      // bulk 봉투는 안을 펼쳐 센다
    items.forEach(it=>{
      if(!it||!it.cardId) return;
      PFIELDS.forEach(f=>{ if(it[f]!==undefined) seen[it.cardId+"|"+f]=1; });
    });
  });
  return Object.keys(seen).length;
}
/* ── 테마: 저장값 없으면 OS 를 따르고, 누르면 그 선택이 이긴다 ── */
function themePref(){ const v=set.theme; return (v==="dark"||v==="light")?v:"sys"; }
function themeNow(){                                   // 지금 실제로 어두운가
  const p=themePref();
  return p==="sys" ? matchMedia("(prefers-color-scheme:dark)").matches : p==="dark";
}
function themeApply(){
  const p=themePref();
  if(p==="sys") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",p);
  const b=document.getElementById("tTheme");
  if(b){ const dark=themeNow();
    /* 지금 상태가 아니라 "누르면 갈 곳"을 보여준다 — 어두우면 해, 밝으면 달 */
    b.textContent = dark ? "☀" : "☾";
    b.title = dark ? "밝게 보기" : "어둡게 보기";
    b.setAttribute("aria-label", b.title);
  }
}
function bindThemeBtn(){
  const b=document.getElementById("tTheme"); if(!b) return;
  const hit=()=>{ set.theme = themeNow() ? "light" : "dark"; save(); themeApply(); };
  b.onclick=hit;
  b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); hit(); } };
  /* 아직 한 번도 안 골랐으면 OS 가 바뀔 때 따라간다 */
  try{ matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{
    if(themePref()==="sys") themeApply(); }); }catch(e){}
  themeApply();
}

/* ── 로그아웃 버튼: 지우기 전에 시트로 밀어내고, 남은 게 있으면 알린다 ── */
function bindOutBtn(name){
  const b=document.getElementById("tOut"); if(!b) return;
  const hit=()=>askLogout(name);
  b.onclick=hit;
  b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); hit(); } };
}
let _outSeq=0;
function askLogout(name){
  const box=document.getElementById("outbox"), msg=document.getElementById("outMsg");
  const ok=document.getElementById("outGo"), no=document.getElementById("outNo");
  if(!box) return;
  /* 열 때마다 번호를 올린다 — 취소했다 다시 연 경우, 앞서 걸어둔 타이머가
     새 패널에 옛 결과를 써넣고 버튼까지 풀어버리는 걸 막는다 */
  const seq=++_outSeq;
  box.classList.remove("hidden");
  ok.textContent="로그아웃"; ok.classList.add("wait");
  no.onclick=()=>box.classList.add("hidden");
  const paint=t=>{ msg.innerHTML=t; };

  if(!SHEET){
    /* 시트가 없으면 지운 건 영영 못 돌아온다 — 다르게 경고해야 한다 */
    paint(`<b class="bad">이 기기의 기록이 영구히 지워집니다.</b><br>
           시트 백업이 꺼져 있어 <b>다시 로그인해도 돌아오지 않습니다.</b>`);
    ok.classList.remove("wait");
    ok.onclick=doLogout;
    return;
  }
  paint("아직 안 올라간 게 있는지 확인하는 중…");
  ok.onclick=null;
  /* 미전송분을 밀어내고 서버가 실제로 받았는지 확인한 뒤에 결론을 낸다.
     ⚠️ 입력 디바운스(400ms)를 먼저 확정해야 한다 — 안 그러면 flushDirty 가 지나간 뒤
     디바운스가 터져 dirty 가 늘고, 멀쩡한데도 "안 올라간 게 1건" 경고가 뜬다. */
  fbFlush(); mnFlush(); ddxFlush();
  queueFlush(); flushDirty(); retryPending();
  /* ⚠ 여기도 같은 함정이 있었다 — sheetLoad 를 쏘고 **2600ms 뒤에** 셌다.
     서버 응답은 실측 2.6~4.2초라, 정상적으로 다 올라갔는데도 "아직 N건 안 올라갔다,
     로그아웃하면 사라진다"는 헛경고가 떴다. 로그아웃을 망설이게 만드는 최악의 오보다.
     → 보낼 시간을 준 뒤(VERIFY_AFTER) 조회하고, **응답이 도착한 뒤에** 센다. */
  setTimeout(()=>{
    setTimeout(()=>sheetLoad(true,()=>{
      if(seq!==_outSeq || box.classList.contains("hidden")) return;   // 취소했거나 다시 열렸으면 그만
      const n=unsentCount();
      paint(n===0
        ? `이 기기의 기록을 지웁니다. 다음 사람 기록과 섞이지 않으려면 필요합니다.<br>
           <b class="good">✓ 시트 백업 완료</b> — <b>${esc(name)}</b> 님으로 다시 로그인하면 그대로 돌아옵니다.`
        : `이 기기의 기록을 지웁니다.<br>
           <b class="bad">⚠ 아직 시트에 안 올라간 게 ${n}건</b> 있습니다.
           지금 로그아웃하면 <b>그 ${n}건은 사라집니다.</b><br>
           연결을 확인하고 잠시 뒤 다시 시도하거나, 헤더의 <b>전체 저장</b>을 먼저 눌러보세요.`);
      ok.classList.remove("wait");
      ok.onclick=doLogout;
    }), VERIFY_AFTER);      // 보낸 것이 서버에 닿을 시간을 준 뒤 조회한다
  },400);
}
function doLogout(){
  /* ⚠️ 지우기 전에 반드시 이 깃발부터 세운다.
     아래 reload() 는 beforeunload/pagehide 를 발생시키고, 거기 걸린
     fbFlush·mnFlush·ddxFlush·pushOut 이 **지운 직후에 다시 써버린다.**
     (입력 디바운스 400ms 안에 로그아웃하면 방금 쓴 메모가 되살아나고,
      pushOut 은 앞사람 데이터를 시트로 밀어낸다.) */
  _loggingOut=true;
  clearTimeout(fbTimer); clearTimeout(mnTimer); clearTimeout(ddxTimer);
  clearTimeout(_coalT); _coalT=null;      // 평가·태그 모아보내기 타이머 (앞사람 것이 나가면 안 된다)
  /* 예약된 확인·주기 갱신도 끈다 — 이것들이 sheetLoad 를 다시 불러
     지운 데이터를 서버에서 도로 받아온다 */
  clearTimeout(_verifyT); _verifyT=null;
  clearInterval(_sheetTimer); _sheetTimer=null;
  fbPending=mnPending=ddxPending=null;
  /* 메모리도 비운다 — reload 가 실패하거나 늦어도 앞사람 데이터가 남지 않게 */
  fb={}; mnOv={}; ddxOv={}; tagOv={}; hlOv={}; prog={}; progTs={}; dirty={}; pend={};
  WIPE_KEYS.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  /* lsObjSafe 가 깨진 값을 만나면 cpx_*_corrupt_<ts> 로 원문을 통째 남긴다 —
     앞사람 원자료가 기기에 남지 않게 같이 지운다 */
  try{ Object.keys(localStorage).filter(k=>k.indexOf("_corrupt_")>0)
         .forEach(k=>localStorage.removeItem(k)); }catch(e){}
  /* 새로고침으로 끝낸다 — 남은 타이머·핸들러까지 확실히 털어내기 위해서다 */
  location.reload();
}
function startApp(){ buildDeck(set.id); resetReveal(); render(); }
async function gateInit(){
  const gate=document.getElementById('gate'), body=document.getElementById('gateBody');
  let cfg;
  try{ const r=await fetch('config.json?_='+Date.now(),{cache:'no-store'}); cfg=await r.json(); }
  catch(e){ body.innerHTML='<p>설정을 불러올 수 없어요.<br>잠시 후 다시 시도하거나 관리자에게 문의하세요.</p>'; return; }
  if(!cfg.open){ body.innerHTML='<p>지금은 닫혀 있어요.<br>관리자에게 문의하세요.</p>'; localStorage.removeItem(GATE_KEY); return; }
  SHEET = String(cfg.sheet||'').trim();   // 비어 있으면 구글시트 백업은 조용히 비활성
  function enter(name,ucode,isPersonal){
    const scode=(ucode===undefined?cfg.code:ucode);
    /* ── 주인이 바뀌었는가 ────────────────────────────────────────
       로그아웃을 안 거치고도 게이트로 돌아오는 길이 있다 —
       **관리자가 참여코드를 바꾸면 전원이 이 길을 탄다**(아래 코드 불일치 분기).
       그때 학습데이터는 그대로 남아 있어서, 다음 사람이 로그인해 "전체 저장"을 누르면
       앞사람 기록 전체가 그 사람 이름으로 시트에 복제된다.
       그래서 세션이 아니라 **주인 이름**을 따로 기억해 두고, 달라졌으면 여기서 지운다.
       같은 사람이 새 코드로 다시 들어오는 경우(코드 변경)는 이름이 같으니 그대로 유지된다. */
    let prevOwner=""; try{ prevOwner=localStorage.getItem(LS_OWNER)||""; }catch(e){}
    if(prevOwner && prevOwner!==name){
      _loggingOut=true;                      // 남은 타이머·unload 훅이 되살리지 못하게
      WIPE_KEYS.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
      try{ Object.keys(localStorage).filter(k=>k.indexOf("_corrupt_")>0)
             .forEach(k=>localStorage.removeItem(k)); }catch(e){}
      lsSet(GATE_KEY,JSON.stringify({name:name,code:scode,p:isPersonal?1:0}));
      lsSet(LS_OWNER,name);
      location.reload();                     // 메모리까지 비우고 새 사람으로 시작
      return;
    }
    lsSet(LS_OWNER,name);
    _myName=name;
    /* ⚠ cfg.code 가 아니라 **실제로 입력해 서버가 받아준 코드**를 저장한다.
       개인코드를 쓰는 사람은 cfg.code 와 다르므로, 하드코딩하면 이후 모든
       조회·저장이 남의 코드로 나가 본인이 'bad code' 로 잠긴다. */
    lsSet(GATE_KEY,JSON.stringify({name:name,code:scode,p:isPersonal?1:0}));
    gate.classList.add('hidden');
    const w=document.getElementById('gwho'); if(w) w.textContent='👤 '+name;
    startApp();
    /* 헤더 백업 표시: 누르면 큐·미전송·미확인분을 한 번에 다시 밀어내고 곧바로 확인한다 */
    const bk=document.getElementById("bkStat");
    if(bk) bk.onclick=()=>{
      if(!SHEET) return;
      bk.textContent="다시 보내는 중…";
      /* 사용자가 직접 누른 재시도다 — 실패 표시(f)와 확인 횟수(p)를 지워 기회를 새로 준다.
         안 지우면 이미 2회를 채운 항목이 보내자마자 다시 빨간색으로 돌아간다. */
      try{ Object.keys(pend).forEach(k=>{ delete pend[k].f; delete pend[k].p; }); pendSave(); }catch(e){}
      queueFlush(); flushDirty(); retryPending();
      /* 확인은 sendBulk 가 마지막 청크까지 보낸 뒤 스스로 건다(scheduleVerify).
         여기서 고정 타이머로 또 부르면 응답보다 빨라 헛판정이 난다 — 그게 원래 버그였다. */
    };
    bindBulkBtn();     // 헤더 "전체 저장" (시트 미설정이면 숨김)
    queueFlush();      // 지난번 실패분 재시도
    flushDirty();      // 지난번에 못 밀어낸 편집분
    /* ⛔ 이 한 줄이 없어서 **데이터가 영구히 안 올라가는 경로**가 있었다.
       flushDirty 는 보내기 전에 dirty 를 비우므로(아래 참조) 전송에 실패한 편집은
       pend 에만 남는다. 그런데 no-cors 라 실패를 못 읽고, 부팅·2분주기·탭복귀 어디에서도
       pend 를 다시 보내지 않았다 —
         탭 닫기 → sendBeacon 이 락 경쟁으로 전부 버려짐 → 서버 기록 0건
         → 재접속하면 pend=265, dirty=0 → 3분을 방치해도 그대로
       사용자가 헤더의 빨간 경고를 **직접 눌러야만** 복구됐다. 실측으로 재현했다.
       새 세션이므로 지난 세션의 실패 표시(f)와 확인 횟수(p)는 지우고 기회를 새로 준다. */
    try{ Object.keys(pend).forEach(k=>{ delete pend[k].f; delete pend[k].p; }); pendSave(); }catch(e){}
    retryPending();    // ← 지난 세션에서 확인 못 받은 것들
    sheetLoad(true);   // 본인 데이터 불러오기(JSONP) — skew 보정도 여기서 된다
    sheetAutoInit();   // 탭 이탈·복귀 · 2분 주기 밀어내기+갱신 (SHEET 없으면 아무것도 안 건다)
    pendPaint();
    /* 헤더 버튼은 **동기화 부트스트랩 뒤에** 건다. 여기서 예외가 나도 화면은 멀쩡해 보이므로,
       앞에 두면 그 세션 내내 시트 동기화가 통째로 안 걸린 걸 아무도 모른다. */
    try{ bindThemeBtn(); }catch(e){}   // 헤더 ☾/☀
    try{ bindOutBtn(name); }catch(e){} // 헤더 로그아웃
  }
  /* 여기서 예외가 나면 아래 입장 버튼 핸들러가 등록되지 않아 게이트가 영구히 닫힌다
     (사용자는 DevTools 없이는 못 빠져나온다). 그래서 안전 파서 sess() 를 쓴다 —
     깨진 JSON 이면 {} 를 돌려주므로 수동 로그인으로 자연히 흘러간다.
     지역변수 이름이 sess 면 그 파서를 가려버리므로 gsess 로 둔다. */
  const gsess=sess();
  /* 자동 입장. 공용코드 세션은 지금까지와 똑같이 cfg.code 와 대조한다
     (관리자가 공용코드를 바꾸면 전원 재입장 — 기존 동작 유지).
     개인코드 세션(p=1)은 cfg.code 와 다른 게 정상이므로 대조하지 않고,
     자격 회수는 서버가 한다 — sheetLoad 가 'not allowed' 를 받으면 denyKick 이 회수.
     여기서 서버 응답을 기다리지 않는 이유: 기존 사용자 전원에게 매번 왕복 지연이 붙는다. */
  if(gsess.name && (gsess.code===cfg.code || gsess.p)){
    const auto=()=>ensureContent(null).then(okc=>{
      /* 캐시된 키로 열렸다 → 네트워크를 아예 안 기다리고 입장 (기존 사용자 체감 지연 0) */
      if(okc){ enter(gsess.name,gsess.code,!!gsess.p); return; }
      /* 캐시가 없다 = 이 배포 후 첫 실행. 이때만 서버에서 키를 받아온다. */
      authProbe(gsess.name,gsess.code).then(res=>{
        if(res && res.ok===false && res.err==="not allowed"){ denyKick(); return; }
        ensureContent(res&&res.key).then(ok2=>{
          if(ok2) enter(gsess.name,gsess.code,!!gsess.p);
          else showNeedNet(auto);          // 인터넷이 없다 — 다시 시도 버튼을 준다
        });
      });
    });
    auto(); return;
  }
  try{ localStorage.removeItem(GATE_KEY); }catch(e){}  // 코드 바뀌었으면 재로그인
  const gbtn=document.getElementById('gEnter');
  /* 로그인 한 번의 전 과정. **이름·코드를 인자로 받는 이유는 재시도 때문이다** —
     안내 화면의 [다시 시도] 가 이걸 그대로 다시 부른다. reload 로 돌리면
     게이트가 초기화돼 사용자가 이름·코드를 다시 쳐야 한다(검증에서 잡힌 건). */
  function doLogin(n,c,err){
    const label='입장';
    gbtn.disabled=true; gbtn.textContent='확인 중…';
    if(err) err.textContent='';
    /* 코드를 여기서 cfg.code 와 바로 대조하면 **개인코드를 쓰는 사람이 못 들어온다**
       (개인코드는 config.json 에 없다). 판정은 명단을 아는 서버에 맡긴다. */
    authProbe(n,c).then(res=>{
      gbtn.disabled=false; gbtn.textContent=label;
      const fail=m=>{ const e=document.getElementById('gErr'); if(e) e.textContent=m; };
      if(res && res.ok===false){
        fail(res.err==='not allowed'
             ? '참여 명단에 없는 이름이에요. 관리자에게 문의하세요.'
             : '참여코드가 올바르지 않아요');
        return;
      }
      if(!res){
        /* 서버에 못 물어봤다(오프라인·서버 다운). 오프라인에서 앱을 못 여는 일은
           절대 없어야 하므로 공용코드로만 판단해 통과시킨다.
           온라인이 되는 순간 sheetLoad 가 자격을 다시 확인한다. */
        if(c!==cfg.code){ fail('참여코드가 올바르지 않아요'); return; }
        /* 다만 콘텐츠는 캐시된 키가 있어야 열린다 — 첫 실행이면 인터넷이 필요하다 */
        ensureContent(null).then(okc=>{
          if(okc) enter(n,c,false);
          else showNeedNet(()=>doLogin(n,c,null));
        });
        return;
      }
      ensureContent(res.key).then(okc=>{
        if(okc){ enter(n,c,c!==cfg.code); return; }
        showNeedNet(()=>doLogin(n,c,null));
      });
    });
  }
  gbtn.onclick=()=>{
    const n=document.getElementById('gName').value.trim();
    const c=document.getElementById('gCode').value.trim();
    const err=document.getElementById('gErr');
    if(!n){ err.textContent='이름을 입력하세요'; return; }
    if(!c){ err.textContent='참여코드를 입력하세요'; return; }
    doLogin(n,c,err);
  };
  document.getElementById('gCode').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('gEnter').click(); });
}
gateInit();
</script>
</body>
</html>
